name: release

# Dispara quando um push em main mexe no info.json. O primeiro passo confirma
# que o campo `version` realmente mudou (e nunca retrocedeu); só então compila,
# cria o GitHub Release e envia ao portal do Factorio.

on:
  push:
    branches: [main]
    paths:
      - info.json
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo do disparo manual"
        required: false
        default: "disparo manual"
      intro:
        description: "Frase de abertura das notas da release (opcional)"
        required: false
        default: ""
      publish_portal:
        description: "Enviar ao portal do Factorio neste disparo"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detectar bump de versão (bloqueia retrocesso)
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            V=$(python3 -c "import json; print(json.load(open('info.json'))['version'])")
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$V" >> "$GITHUB_OUTPUT"
            echo "::notice::disparo manual — publicando a versão atual ($V)."
          else
            python3 tools/check_version_bump.py --old-ref "$BEFORE" --github-output
          fi

      - name: Sem mudança de versão — encerrar
        if: steps.ver.outputs.changed != 'true'
        run: echo "::notice::info.json mudou, mas 'version' não; nenhuma release."

      - name: Validações
        if: steps.ver.outputs.changed == 'true'
        run: |
          python3 tools/build_glossary.py --check
          python3 tools/validate_locale.py locale/pt-BR
          python3 -m json.tool info.json > /dev/null
          python3 tools/check_changelog.py changelog.txt
          python3 tools/gen_mods_table.py --check
          python3 tools/check_collisions.py --check

      - name: Empacotar (Factorio 2.0)
        if: steps.ver.outputs.changed == 'true'
        run: python3 tools/build_release.py --target 2.0

      - name: GitHub Release
        if: steps.ver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
          # via env, nunca interpolado no script — a entrada pode conter
          # backticks/aspas e não deve ser interpretada como shell.
          INTRO: ${{ github.event.inputs.intro }}
        run: |
          set -euo pipefail
          if gh release view "V$V" >/dev/null 2>&1; then
            echo "::warning::release V$V já existe; pulando criação."
            exit 0
          fi
          if [ -n "${INTRO:-}" ]; then
            python3 tools/release_notes.py "$V" --intro "$INTRO" > /tmp/notes.md
          else
            python3 tools/release_notes.py "$V" > /tmp/notes.md \
              || printf 'Lançamento da `V%s`.\n' "$V" > /tmp/notes.md
          fi
          gh release create "V$V" "dist/slondo-ptbr_${V}.zip" \
            --title "V$V" --notes-file /tmp/notes.md

      - name: Portal do Factorio
        if: >-
          steps.ver.outputs.changed == 'true' &&
          (github.event_name != 'workflow_dispatch' ||
           github.event.inputs.publish_portal == 'true')
        env:
          # aceita o token sob qualquer um destes nomes, como secret ou como
          # variable: FACTORIO_API_KEY / FACTORIO_TOKEN / FACTORIO_PORTAL_API_KEY.
          TOK_S1: ${{ secrets.FACTORIO_API_KEY }}
          TOK_S2: ${{ secrets.FACTORIO_TOKEN }}
          TOK_S3: ${{ secrets.FACTORIO_PORTAL_API_KEY }}
          TOK_V1: ${{ vars.FACTORIO_API_KEY }}
          TOK_V2: ${{ vars.FACTORIO_TOKEN }}
          TOK_V3: ${{ vars.FACTORIO_PORTAL_API_KEY }}
          FACTORIO_PORTAL_INIT_URL: ${{ vars.FACTORIO_PORTAL_INIT_URL }}
          V: ${{ steps.ver.outputs.version }}
        run: |
          export FACTORIO_PORTAL_API_KEY="${TOK_S1:-${TOK_S2:-${TOK_S3:-${TOK_V1:-${TOK_V2:-${TOK_V3:-}}}}}}"
          if [ -z "$FACTORIO_PORTAL_API_KEY" ]; then
            echo "::warning::token do portal não encontrado em odnols/Traducoes-PT-BR (secret/var FACTORIO_API_KEY / FACTORIO_TOKEN / FACTORIO_PORTAL_API_KEY); upload pulado."
            exit 0
          fi
          echo "token do portal presente (${#FACTORIO_PORTAL_API_KEY} chars)."
          python3 tools/portal_upload.py --zip "dist/slondo-ptbr_${V}.zip"
