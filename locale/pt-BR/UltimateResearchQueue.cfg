urq-welcome=[font=default-bold]Bem-vindo à Ultimate Research Queue![/font]\n\nClique em uma tecnologia para visualizar suas informações neste painel. Clique no botão de gráfico para visualizar a tecnologia selecionada no gráfico de tecnologia.\n\nClique no botão "recolocar automaticamente na fila tecnologias multinível" para pesquisar continuamente as tecnologias multinível na fila. Ao colocar uma única tecnologia na fila, apenas essa tecnologia será pesquisada, e ao colocar várias tecnologias na fila, as tecnologias serão pesquisadas nessa ordem antes de serem repetidas.\n\nDepois de se acostumar com o mod, você pode desabilitar as dicas de controle nas configurações do mod por jogador.

