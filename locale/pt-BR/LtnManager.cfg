[gui]
ltnm-status-description=No 2.0 perdemos a informação sobre o valor do sinal :(. \n[img=flib_indicator_green]1 = status normal\n[img=flib_indicator_blue]n = trem controlado pelo LTN parado na parada, n = número de trens\n[img=flib_indicator_yellow]n = a parada faz parte de uma entrega agendada, n = número de trens\n[img=flib_indicator_white]1 = erro - não inicializado\n[img=flib_indicator_red]1 = erro - curto-circuito\n[img=flib_indicator_red]2 = erro - parada desativada

