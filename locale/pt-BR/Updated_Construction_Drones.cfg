[mod-setting-name]
throttling=Subdivisão da área de busca de trabalhos

[mod-setting-description]
throttling=Para um valor N, divide a área de busca por jogador em (N*2)^2 subdivisões. Reduzir o número melhora a capacidade de resposta, enquanto aumentá-lo reduz o uso da CPU.

