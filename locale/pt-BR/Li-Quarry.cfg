[mod-setting-description]
quarry-stone-waste-percentage=Define a quantidade de pedra que as pedreiras escavam em vez do recurso selecionado.\n0 desabilita a pedra como subproduto\nPadrão 0%
quarry-recipe-speed=Valores mais baixos significam receitas mais rápidas e vice-versa.\nNão relacionado ao multiplicador de velocidade de fabricação, que afeta as pedreiras
quarry-crafting-speed=Valores mais altos fazem as pedreiras fabricarem mais rápido.\nNão relacionado ao multiplicador de velocidade da receita, que afeta as receitas.
quarry-power-usage=Valores mais altos indicam maior consumo de energia.
quarry-complex-mode=As pedreiras extraem pedras ricas em minerais, das quais os minérios são extraídos. Basicamente, adiciona uma etapa extra ao processo de extração.
quarry-pollution-mult=Define a emissão de poluição para pedreiras e britadores de pedreira.\n0 desabilita a poluição.\nPadrão: 1
