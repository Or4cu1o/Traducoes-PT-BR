[item-description]
micro-fusion-reactor-equipment=Um reator muito pequeno. Não gera muita energia, mas é estável e confiável.
tiny-armor-mk0=A Tiny Armor-chan mais básica não oferece proteção ou espaço extra, mas ela está dando o seu melhor.
tiny-armor-mk1=Absorver os componentes de várias unidades de armadura leve significa que esta Tiny Armor agora oferece proteção mínima e possui alguns bolsos extras.
tiny-armor-mk2=Uma blindagem pesada ajuda esse conjunto mínimo de armadura a fornecer proteção útil e capacidade de carga extra, mas isso é o máximo que ele pode levar.

[equipment-name]
micro-fusion-reactor-equipment=Reator de fusão minúsculo

