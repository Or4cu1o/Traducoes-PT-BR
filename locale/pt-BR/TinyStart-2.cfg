[mod-setting-description]
TinyStart-fusion-solar=Escolha entre:\n[font=default-bold]I)[/font] um reator de microfusão de baixa potência (150 kW)\n[font=default-bold]II)[/font] 4 painéis solares (120kW).
TinyStart-shield=Escolha entre:\n[font=default-bold]I)[/font] um reator de microfusão adicional\n[font=default-bold]II)[/font] um escudo de energia de baixo desempenho\n[font=default-bold]III)[/font] 4 painéis solares adicionais\n[font=default-bold]IV)[/font] 2 baterias extras.
TinyStart-battery=Escolha entre:\n[font=default-bold]I)[/font] uma bateria extra OU\n[font=default-bold]II)[/font] 2 painéis solares adicionais (60kW).\nSe você escolher energia solar, ainda receberá 1 bateria.
TinyStart-init-spawn=Esta opção é para salvamentos existentes que não tinham o TinyStart presente. Se habilitada: Na primeira vez que um mapa existente for carregado com o TinyStart, todos os jogadores registrados no salvamento receberão a Tiny Armor.\nObservação: isso substitui qualquer armadura já equipada.
TinyStart-ghosts=Quando um edifício é destruído, um fantasma é colocado para permitir que os robôs de construção o reconstruam automaticamente. No Factorio vanilla, isso só acontece após os robôs de construção serem pesquisados. Marcar esta opção fará com que o TinyStart force a ativação do recurso para todas as facções com jogadores.
TinyStart-marathon-start=Deve ser definido antes de iniciar um novo jogo.\nInclui recursos extras destinados a encurtar a fase de queima. Inclui algumas fornalhas, mineradoras, motores a vapor, esteiras, insersores e pacotes científicos suficientes para pesquisa de automação 1 (dimensionável de acordo com suas configurações de dificuldade científica).
TinyStart-marathon-start-first-player-only=Eficaz apenas no modo multijogador.\nRequer que o "Marathon QuickStart" esteja definido.\nEm jogos multijogador, se marcado, somente o primeiro jogador receberá os recursos extras da configuração QuickStart.
TinyStart-spawn-charged=Se habilitado: Na primeira vez que TinyArmor for dado a um jogador, todos os equipamentos começarão totalmente energizados. Isso permite a utilização imediata dos roboports no início do jogo.
TinyStart-roboport-type=Escolha entre os roboports básicos (mark I, 20 bots) ou mark II (50 bots). Os roboports mark II têm demandas de energia muito altas; é recomendável escolher opções de energia adicionais em outros slots.
