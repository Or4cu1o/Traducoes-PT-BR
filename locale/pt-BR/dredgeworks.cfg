[mod-name]
dredgeworks=Dredgeworks

[mod-description]
dredgeworks=Agora as jazidas de minério se estendem para dentro do mar como variantes submersas. Drague-as com novos equipamentos flutuantes e construa mais fundo no azul com concreto refinado removível, posicionável sobre a água.

[dredgeworks]
floated=__1__ (flutuante)
submerged=__1__ (submerso)
submerged-desc=Minério abaixo do nível da água. Aterro ou outras coberturas de solo o removerão permanentemente.
refined-concrete-pricy=Pode ser usado para construir sobre a água. Posicioná-lo como bloco exige (__1__) unidades.

[entity-name]
light-buoy=Boia luminosa
deep-iron-ore=Minério de ferro submerso
deep-copper-ore=Minério de cobre submerso
deep-uranium-ore=Minério de urânio submerso
deep-stone=Pedra submersa
deep-coal=Carvão submerso
wire-buoy=Boia de fiação
seafloor-drill=Mineradora de leito marinho
floating-belt=Esteira flutuante

[entity-description]
wire-buoy=Equivalente aquático de um poste elétrico. Não pode ser posicionada em terra.
seafloor-drill=Plataforma de perfuração adaptada para uso oceânico. Pode minerar minérios submersos ou encalhados dentro do raio.
flotation-platform=Pode ser fixada a certos equipamentos para permitir que flutuem.

[item-name]
flotation-platform=Plataforma de flutuação

[item-description]
refined-concrete=Pode ser usado para construir sobre a água.
refined-hazard-concrete=Pode ser usado para construir sobre a água.

[recipe-name]
flotation-platform-wood=Plataforma de flutuação de madeira

[recipe-description]
flotation-platform-wood=Fazê-las sem plástico é menos eficiente.

[technology-name]
wire-buoy-technology=__ENTITY__wire-buoy__s
floating-logistics-technology=Logística aquática
floating-drill-technology=__ENTITY__seafloor-drill__s

[technology-description]
wire-buoy-technology=Estrutura flutuante para distribuição de eletricidade.
floating-logistics-technology=Equipa os equipamentos de logística com dispositivos de flutuação, permitindo que operem sobre a superfície da água.
floating-drill-technology=Extrai recursos de baixo da superfície da água.

[mod-setting-name]
refcrete_default_fill=Concreto refinado é o "aterro" padrão
seafloor_drill_beltstack=Empilhamento de saída da mineradora de leito marinho
concrete_placement_cost=Custo de posicionamento do concreto refinado
shallow_oil_concrete=Águas rasas fulgoranas permitem concreto refinado
allow_floating_edgecase=Permitir jazidas incomuns sobre a água
limit_belt_flotation=Limitar a geração de esteiras flutuantes
limit_inserter_flotation=Limitar a geração de insersores flutuantes

[mod-setting-description]
refcrete_default_fill=Com esta opção ativa, o concreto refinado será usado no lugar do aterro ao posicionar projetos sem base sobre superfícies não sólidas.
seafloor_drill_beltstack=Com esta opção e o Space Age ativos, as mineradoras de leito marinho produzem minérios empilhados, de acordo com a capacidade da sua esteira (semelhante às mineradoras grandes).
concrete_placement_cost=Quantas unidades de concreto refinado devem ser usadas para posicioná-lo como bloco. Aumentado por padrão para tornar a construção sobre o mar mais cara. Defina como 0 para impedir que o mod afete o rendimento.
shallow_oil_concrete=Se a parte mais rasa do oceano de Fulgora permite o posicionamento de concreto refinado. Pode ser ignorado se você estiver jogando sem o Space Age.
allow_floating_edgecase=Recursos que não são gerados nem como fluido nem como sólido básico, como a imersita do Krastorio 2, serão gerados na superfície da água se ativado.
limit_belt_flotation=Só gera versões flutuantes das esteiras básicas. Use se as esteiras de algum mod forem incompatíveis com a flutuação do Dredgeworks.
limit_inserter_flotation=Só gera versões flutuantes dos insersores básicos. Use se os insersores de algum mod forem incompatíveis com a flutuação do Dredgeworks.
