bc-force-chat-history=Histórico de chat da força
bc-normal-chat-type=Alcance padrão do chat
bc-player-closeable-chat=Chat fechável
bc-show-timestamp=Mostrar horário
bc-color-fade=Esmaecer cores das mensagens
bc-player-chat-history=Seu histórico de chat
bc-message-linger=Idade de permanência da mensagem
bc-virtual-signal-icon=Substituir sinais virtuais
bc-item-icon=Substituir itens
bc-fluid-icon=Substituir fluidos
