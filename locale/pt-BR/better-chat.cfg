[mod-setting-description]
bc-force-chat-history=O número de mensagens de chat mantidas por força. Números maiores degradam o desempenho ao conversar.
bc-normal-chat-type=Quantas pessoas ouvirão uma mensagem enviada normalmente.
bc-player-closeable-chat=Se o chat deve reimprimir parte de si mesmo para imitar melhor o comportamento natural ao abrir e fechar. Isto fica horrível com latência, então pode ser desativado.
bc-show-timestamp=Se cada mensagem do chat deve ser prefixada com o formato D:HH:MM.SS. Este horário é o tempo de jogo do save, não o tempo real.
bc-color-fade=O quanto a cor da mensagem fica esmaecida.
bc-message-linger=Quão recente uma mensagem precisa ser para aparecer entre as mensagens que permanecem visíveis.

[string-mod-setting]
bc-normal-chat-type-force=Força
bc-normal-chat-type-global=Todos
bc-normal-chat-type-player=Pessoal

[command-help]
team=<mensagem> - Envia uma mensagem aos jogadores da mesma força ou aliados dela

