[mod-name]
se-ltn-glue=Space Exploration - integração com LTN

[mod-description]
se-ltn-glue=Permite que o LTN faça entregas através do elevador espacial do SE.

[mod-setting-name]
se-ltn-use-elevator-clearance=Usar estação de liberação
se-ltn-elevator-clearance-name=Nome da estação de liberação

[mod-setting-description]
se-ltn-use-elevator-clearance=Trens que saem de um elevador e seguem diretamente para um destino com um limite de trens restante de 1 vão engasgar e produzir a mensagem "[color=purple]Destino cheio[/color]." Para evitar isso, o trem pode seguir primeiro para uma estação de liberação.\nTal estação [color=cyan]não pode ter um limite de trens[/color] e deve estar a pelo menos [color=cyan]um comprimento inteiro de trem de distância[/color] do ponto de saída dentro do elevador.\n\nEsta configuração adiciona tais estações a toda entrega do LTN que passa por um elevador. A próxima configuração define o nome de todas essas estações.\n\nComo solicitantes e fornecedores do LTN raramente têm limites de trem do Factorio, ativar este recurso é útil principalmente com depósitos com limite de trens.

[se-ltn-glue-message]
re-assign-delivery=[SE-LTN] __1__ chegou através de um elevador.
elevator-disconnected=[SE-LTN] Elevador __1__ desconectado do LTN.
elevator-connected=[SE-LTN] Elevador __1__ conectado ao LTN.
elevator-connected-masked=[SE-LTN] Elevador __1__ conectado às redes __2__ do LTN.
cross-surface-delivery=[SE-LTN] Entrega entre superfícies para __1__, conexões de superfície correspondentes: __2__.
requester-delivery-reset-should-be-disabled=[img=virtual-signal/se-warning] [color=yellow][SE-LTN] A configuração do LTN "__1__" está ativada. Ela não permitirá que os trens retornem à superfície de onde vieram originalmente, o que drenará lentamente a superfície com menos solicitações de trens e possivelmente transbordará os depósitos na outra.[/color]

[se-ltn-ui-tooltip]
network-id=IDs de rede do LTN codificados que têm permissão para passar por este elevador.
