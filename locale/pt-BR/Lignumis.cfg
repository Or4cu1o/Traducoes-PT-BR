[technology-description]
wood-science-pack=Permite a pesquisa de tecnologias básicas baseadas em produtos de madeira.
burner-automation=Tecnologia para automação básica usando máquinas a combustível.
planet-discovery-nauvis=Um planeta temperado que oferece todos os recursos comuns.
planet-discovery-lignumis=Uma lua orbitando Nauvis que não tem muito a oferecer além de alguma vegetação e um metal que pode ser útil.
lumber-mill=Máquina avançada para processar madeira.
advanced-carpentry=Máquina avançada para processar madeira.
deep-miner=Dá acesso a enormes depósitos de ouro antes inacessíveis.
steam-automation=Permite a pesquisa de tecnologias mais sofisticadas baseadas em produtos de madeira e ouro.
wood-liquefaction=Converter madeira em líquido oferece novas possibilidades.
provisional-rocketry=Precisamos sair desta lua de algum jeito. Esta é a nossa única chance!
basic-gun-turret=A defesa automática mais básica. Não é grande coisa, mas por ora tem que bastar.
basic-construction-robotics-gold=A assistência mais básica para necessidades de construção pessoal.
basic-construction-robotics-copper=A assistência mais básica para necessidades de construção pessoal.
wood-logistics=Transporte de mercadorias lento, mas automático.
tree-seeding=[entity=burner-agricultural-tower] permite plantar sementes em solo semeável. As sementes plantadas se transformam em árvores que podem ser colhidas.\n[entity=tree-plant] pode crescer na grama e na terra. [entity=gold-stromatolite] pode crescer em [tile=natural-gold-soil].
active-noise-cancelling=Ajuda a lidar com o ruído.
quality-assembler=Montadora de ponta para fabricar apenas máquinas da mais alta qualidade usando um recurso especial encontrado somente em Lignumis.
automation-science-pack=Deixe Lignumis para habilitar a pesquisa de tecnologia avançada.
gold-module=Domine a montagem de qualidade para desbloquear um módulo impecável, permitindo fabricar os itens mais refinados disponíveis.
aop-lumber-mill=Adiciona mais receitas para a serraria.
tree-seed-productivity=Aumenta a produtividade da receita de semente de árvore.
basic-circuit-board-productivity=Aumenta a produtividade da receita de placa de circuito básica.
lignumobile-basics=Aprenda a fabricar transporte pessoal. Infelizmente, falta a você algum tipo de material mais robusto.
