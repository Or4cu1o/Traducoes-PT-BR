[tips-and-tricks-item-description]
lignumis-briefing=[planet=lignumis] é uma lua de [planet=nauvis] para a qual você deve escapar a fim de ter acesso a tecnologias mais avançadas. Os principais recursos são [item=wood], [item=gold-ore], [item=peat] e [item=stone]. A lua não tem ferro nem cobre e, portanto, suas possibilidades são bem limitadas, com o [item=gold-ore] aparentemente pouco valioso como único metal disponível. A eletricidade só é descoberta depois que você escapa.\n\n[img=utility/warning_icon] Lignumis tem algum impacto no restante do jogo ao alterar receitas e tecnologias padrão. Confira as configurações do mod para ajustá-las ao seu gosto. Ou instale o Director's Cut no portal de mods para a experiência completa.
lignumis-burner-agriculture=Alimentar as torres agrícolas com sementes e combustível ao mesmo tempo exige soluções mais engenhosas do que a contraparte elétrica mais avançada. Devido a uma limitação da engine, os insersores continuarão pegando sementes e ignorando o combustível se ele estiver no lado errado da esteira. Use circuitos ou vários insersores para evitar esse tipo de problema por completo.
lignumis-noise=Os nativos de [planet=lignumis] são sensíveis a [img=airborne-pollutant/noise] ruídos altos. Qualquer coisa mecânica criada por você é potencialmente bem barulhenta. Mantenha sua base pequena e adicione muros para conter o ruído.\nAlgumas ferramentas para reduzir os níveis de ruído: [img=item/wooden-wall] muros, [img=entity/tree-01] árvores, [img=item/efficiency-module] módulos de eficiência, [item=active-noise-cancelling-tower].
lignumis-steam=Com [entity=steam-assembling-machine] e [entity=steam-inserter] você ganha novas ferramentas para construir cadeias de produção mais rápidas e compactas. Devido à falta de tecnologias melhores, queimar [item=moist-stromatolite-remnant] na [entity=desiccation-furnace] é sua única fonte de [fluid=steam]. Equilibre o vapor queimando o excesso de resto de estromatólito úmido em fornalhas comuns.\n\n[img=utility/warning_icon] A produção de [fluid=steam] não será suficiente para abastecer uma base inteira. Mantenha as instalações antigas a combustível onde for possível.
lignumis-escaping=O [entity=provisional-rocket-silo] permite levar um inventário generoso com você. Leve principalmente itens de infraestrutura para ter um início rápido em Nauvis. Deixe para trás combustível, ouro e pacotes científicos.\n\n[img=utility/warning_icon] Embora não seja obrigatório pesquisar tudo antes de partir, é uma boa ideia fazê-lo. Ou, ao menos, certifique-se de que pode continuar pesquisando depois de partir.\n[img=utility/warning_icon] Sua base continua a fazer barulho quando você está fora. Além disso, os inimigos continuarão a se expandir. Certifique-se de que sua base está protegida antes de partir.
