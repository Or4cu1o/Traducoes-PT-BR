[mod-setting-description]
lignumis-belt-progression=Esteiras amarelas exigirão esteiras de madeira para serem fabricadas.
lignumis-inserter-progression=O insersor elétrico amarelo exigirá insersor a combustível para ser fabricado.
lignumis-ammo-progression=Os cartuchos de arma de fogo exigirão cartuchos de dardos de madeira para serem fabricados.
lignumis-technology-progression=Adiciona pacotes científico da madeira e do vapor à maioria das tecnologias de fim de jogo. Desabilitar isto remove a relevância dos pacotes científico de Lignumis no fim do jogo.
lignumis-basic-circuit-board=Por favor, ative para jogos novos. Esta opção será obrigatória no futuro.
lignumis-circuit-progression=Os circuitos elétricos exigirão placas de circuito básicas para serem fabricados.
lignumis-assembler-progression=A máquina de montagem 1 exigirá máquinas de montagem a combustível para ser fabricada.
lignumis-lumber-mill-more-recipes=A serraria também pode fabricar torres básicas, montadoras a combustível e insersores a combustível. Melhora o balanceamento do uso de madeira quando todas as receitas telescópicas estão habilitadas e ajuda em jogos de maratona.
lignumis-fulgora-wood=Isto adiciona rodas dentadas de madeira à reciclagem de sucata como principal fonte de madeira. Desative isto se você tiver outra fonte de madeira ou importar tudo de outros planetas.
lignumis-early-robots=Os robôs pessoais passam da ciência do vapor para a ciência da madeira e são um pouco mais rápidos.
lignumis-lab=Move a receita da esteira para a pesquisa de logística e usa esteiras de madeira na receita do laboratório, para que ele possa ser fabricado ao pousar em Nauvis.
lignumis-double-rocket=O foguete provisório pode carregar 80 espaços em vez de 40.
lignumis-sciences-spoil=Tanto os pacotes científico da madeira quanto os do vapor deterioram, para dificuldade adicional.
lignumis-infinite-astroponics-productivity-research=A pesquisa de produtividade da astroponia é infinita, em vez de limitada ao nível 5 (que resulta em 50% de produtividade).
lignumis-electric-lumber-mill=A serraria consumirá eletricidade em vez de combustível e será desbloqueada após a pesquisa de eletricidade.
lignumis-k2so-gold-tech-card=Tecnologias de fim de jogo que exigiriam pacotes científico da madeira e do vapor passam a exigir Cartões de Tecnologia de Ouro fabricados com o ouro de Lignumis. Requer que as tecnologias progressivas estejam habilitadas.

