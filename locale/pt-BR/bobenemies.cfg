[factoriopedia-description]
bob-basic-enemy-1=[font=default-semibold][color=255,230,192]Solta [item=bob-alien-artifact] ao ser morto. [/color][/font]
bob-basic-enemy-2=[font=default-semibold][color=240,180,20]Gera obstáculos. [/color][color=230,230,20]Ácido lentificante.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Forte contra: Explosão.[/color][/font]\n\nEstas criaturas são a forma de vida dominante em Nauvis. Elas exibem várias formas distintas, mas todas pertencem à mesma espécie.\n\nAs variedades de [font=default-semibold][color=255,230,192]cuspidores e vermes[/color][/font] atacam com bile pegajosa e corrosiva, visando desacelerar seus alvos e digeri-los no local. Enquanto isso, os [font=default-semibold][color=255,230,192]mordedores[/color][/font] tentam encurralar seus alvos, retalhando-os com suas poderosas patas dianteiras e mandíbulas, enquanto também dão tempo para a bile fazer efeito.\n\nContra um alvo bem blindado, [font=default-semibold][color=255,230,192]a bile que essas criaturas usam é o seu aspecto mais ameaçador.[/color][/font] A bile usada por vermes e cuspidores desta linhagem tem uma composição ligeiramente diferente dependendo de seu tamanho, e elas podem agir em conjunto para [font=default-semibold][color=255,230,192]acumular seus efeitos lentificantes[/color][/font]. Se um veículo for forçado a parar enquanto é afetado dessa maneira, pode ser quase impossível fazê-lo se mover novamente.
bob-piercing-enemy-1=[font=default-semibold][color=255,230,192]Solta [item=bob-alien-artifact-blue] ao ser morto. [/color][/font]
bob-piercing-enemy-2=[font=default-semibold][color=40,200,200]Reação a dano: Não elétrico, Não ácido.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Forte contra: Explosão, Fogo, Físico, Perfuração.[/color][/font]\n[font=default-semibold][color=60,200,60]Fraco contra: Ácido, Elétrico, Laser, Veneno.[/color][/font]\n\nEsta linhagem de inimigos abre mão de qualquer forma de bile digestiva em seus ataques à distância em favor do lançamento de [font=default-semibold][color=255,230,192]farpas perfurantes de blindagem[/color][/font] em alta velocidade. Embora não possuam o dano ao longo do tempo de algumas outras linhagens, essas farpas exigirão boa mobilidade para serem evitadas. No entanto, [font=default-semibold][color=255,230,192]seus projéteis não serão capazes de ultrapassar muros[/color][/font].\n\nEstes inimigos são particularmente [font=default-semibold][color=255,230,192]resistentes a impactos cinéticos[/color][/font] de todos os tipos, têm alta regeneração e exibem [font=default-semibold][color=255,230,192]surtos de velocidade quando atacados[/color][/font], além de sua movimentação já veloz. Esses traços significam que seus [font=default-semibold][color=255,230,192]mordedores são muito mais perigosos[/color][/font] do que os de outras linhagens. [font=default-semibold][color=255,230,192]A eletricidade não ativará sua fúria[/color][/font].
bob-electric-enemy-1=[font=default-semibold][color=255,230,192]Solta [item=bob-alien-artifact-orange] ao ser morto. [/color][/font]
bob-electric-enemy-2=[font=default-semibold][color=255,120,40]Ameaça antiaérea. [/color][color=230,230,20]Ácido lentificante. [/color][color=40,200,200]Reação a dano: Elétrico. [/color][color=180,60,230]Fogo amigo.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Forte contra: Elétrico, Laser.[/color][/font]\n[font=default-semibold][color=60,200,60]Fraco contra: Ácido, Fogo, Veneno.[/color][/font]\n\nUtilizar descargas elétricas em seus ataques permite que os mordedores desta linhagem [font=default-semibold][color=255,230,192]atinjam alvos diretamente atrás de muros[/color][/font]. A bile que os cuspidores e vermes elétricos empregam em seus ataques à distância também utiliza eletricidade para infligir paralisia, embora o efeito seja de curta duração. Notavelmente, [font=default-semibold][color=255,230,192]inimigos de outras linhagens também são suscetíveis a este efeito[/color][/font], assim como objetos voadores que normalmente ignorariam poças de ácido no chão.\n\nSer atingido por eletricidade fará com que os mordedores e cuspidores desta linhagem [font=default-semibold][color=255,230,192]acelerem significativamente[/color][/font], e [font=default-semibold][color=255,230,192]suas próprias poças de bile eletricamente carregada podem desencadear sua fúria[/color][/font].
bob-acid-enemy-1=[font=default-semibold][color=255,230,192]Solta [item=bob-alien-artifact-purple] ao ser morto. [/color][/font]
bob-acid-enemy-2=[font=default-semibold][color=200,60,60]Dano ao longo do tempo. [/color][color=40,200,200]Reação a dano: Impacto. [/color][color=70,130,220]Ataque pós-morte.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Forte contra: Ácido, Veneno.[/color][/font]\n[font=default-semibold][color=60,200,60]Fraco contra: Elétrico.[/color][/font]\n\nA bile ácida desses inimigos foi reformulada para máxima corrosividade e persistência, ao custo de sua capacidade de lentidão. Ela grudará em qualquer inimigo que caminhe ou dirija sobre ela, [font=default-semibold][color=255,230,192]não apenas causando dano imediato, mas também dano ao longo do tempo[/color][/font]. Ela também é capaz de causar [font=default-semibold][color=255,230,192]mais dano contra estruturas[/color][/font] do que outros tipos semelhantes de ácido. [font=default-semibold][color=255,230,192]Os inimigos também podem explodir em uma borrifada de ácido ao morrer, ou liberar ácido quando atingidos pelo impacto de um objeto grande[/color][/font].
bob-explosive-enemy-1=[font=default-semibold][color=255,230,192]Solta [item=bob-alien-artifact-yellow] ao ser morto. [/color][/font]
bob-explosive-enemy-2=[font=default-semibold][color=255,120,40]Ameaça antiaérea. [/color][color=70,130,220]Ataque pós-morte.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Forte contra: Ácido, Explosão.[/color][/font]\n[font=default-semibold][color=60,200,60]Fraco contra: Elétrico, Fogo, Laser.[/color][/font]\n\nA linhagem explosiva depende de dano instantâneo em uma ampla área em vez de métodos mais lentos como a bile digestiva. Seus ataques não são tão desordenados quanto parecem, no entanto, pois são moldados para não atingir aliados. Felizmente, [font=default-semibold][color=255,230,192]o círculo mais amplo de dano explosivo que causam também não parece ter como alvo infraestruturas que não sejam de combate[/color][/font].\n\nApesar de não terem um efeito digestivo ou lentificante, as poças que seus ataques deixam no chão ainda devem ser evitadas. Essas poças extraem compostos orgânicos do solo abaixo delas para processamento em mais explosivos. Assim, [font=default-semibold][color=255,230,192]as poças são capazes de explodir novamente após um intervalo, e podem fazer isso várias vezes[/color][/font]. Mordedores e cuspidores desta linhagem também podem explodir ao morrer.
bob-poison-enemy-1=[font=default-semibold][color=255,230,192]Solta [item=bob-alien-artifact-green] ao ser morto. [/color][/font]
bob-poison-enemy-2=[font=default-semibold][color=200,60,60]Dano ao longo do tempo. [/color][color=255,120,40]Ameaça antiaérea. [/color][color=60,200,60]Efeito de cura. [/color][color=40,200,200]Reação a dano.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Forte contra: Ácido, Veneno.[/color][/font]\n[font=default-semibold][color=60,200,60]Fraco contra: Fogo[/color][/font]\n\nEm vez de toxinas químicas convencionais, o veneno utilizado pelos inimigos desta linhagem é uma mistura de enzimas produzidas por células de flutuação livre, adaptadas para atacar qualquer material com o qual entrem em contato. As células são expelidas pela saliva das criaturas ou em nuvens de gás ao redor de seus corpos, e também são capazes de [font=default-semibold][color=255,230,192]curar os ferimentos de criaturas aliadas[/color][/font].\n\nEstes inimigos causam [font=default-semibold][color=255,230,192]quantidades moderadas de dano ao longo do tempo em uma ampla área[/color][/font], mas seu atributo mais perigoso é sua habilidade de cura, especialmente em combinação com outras linhagens inimigas.
bob-fire-enemy-1=[font=default-semibold][color=255,230,192]Solta [item=bob-alien-artifact-red] ao ser morto. [/color][/font]
bob-fire-enemy-2=[font=default-semibold][color=200,60,60]Dano ao longo do tempo. [/color][color=255,120,40]Ameaça antiaérea. [/color][color=180,60,230]Fogo amigo.[/color][/font]\n\n[font=default-semibold][color=200,60,60]Forte contra: Explosão, Fogo, Laser.[/color][/font]\n[font=default-semibold][color=60,200,60]Fraco contra: Impacto, Físico, Perfuração.[/color][/font]\n\nAtaques de todas as criaturas desta linhagem iniciam incêndios. Esses incêndios são alimentados por produtos químicos que são ao mesmo tempo combustíveis e altamente ácidos, garantindo que [font=default-semibold][color=255,230,192]mesmo estruturas totalmente à prova de fogo não fiquem imunes[/color][/font]. Embora inicialmente fracos, [font=default-semibold][color=255,230,192]eles crescem em intensidade à medida que mais combustível é adicionado por ataques repetidos[/color][/font], tornando-se eventualmente a forma mais destrutiva de ataque contra estruturas defensivas que qualquer linhagem de criatura hostil em Nauvis possui. As chamas também podem [font=default-semibold][color=255,230,192]se espalhar por uma pequena distância[/color][/font] a partir de seu ponto de origem.

[mod-setting-name]
bobmods-enemies-factionsappear=Nível de evolução para novas facções
bobmods-enemies-qualityenemies=Inimigos podem ter qualidade elevada
bobmods-enemies-originalcolors=Usar a cor original no mapa
bobmods-enemies-radarscanlimit=Limite de varredura do radar de solo
bobmods-enemies-randomizeenemies=Aleatorizar as facções inimigas
bobmods-enemies-factionlist=Lista de facções

[mod-setting-description]
bobmods-enemies-factionsappear=Nível de evolução inimiga no qual novas facções inimigas começarão a aparecer no mapa. Definir como 0 resultará em um início de jogo muito desafiador.
bobmods-enemies-qualityenemies=Novas estruturas de bases inimigas podem surgir com qualidade aumentada, o que produzirá unidades de qualidade superior e espólios de maior qualidade.
bobmods-enemies-originalcolors=Os geradores inimigos aparecerão no mapa com sua cor vermelha original em vez de cores específicas da facção destinadas a torná-los mais fáceis de identificar.
bobmods-enemies-radarscanlimit=Limita o número de itens no chão que o radar de solo marcará para desconstrução em um único ciclo. Embora isso possa ter um pequeno impacto no desempenho, o objetivo principal é evitar que os robôs de construção fiquem ocupados recolhendo itens por longos períodos de tempo. Definir como 0 removerá o limite.
bobmods-enemies-randomizeenemies=Novas facções inimigas serão desbloqueadas em uma ordem aleatória. Só pode ser feito no início do jogo ou quando este mod for adicionado pela primeira vez.
bobmods-enemies-factionlist=Lista de todas as facções que aparecem, em sua ordem de desbloqueio não aleatória (que pode ser alterada livremente). Separe cada uma com uma única vírgula e sem espaços. Remover mais de uma pode dificultar a coleta de todos os tipos de artefatos. Facções pertencentes a este mod que forem removidas no meio do jogo não desaparecerão do mapa, mas nenhuma nova base será gerada.
