[mod-setting-description]
inserter-fuel-leech-inserters-enabled=Os tipos de insersores para os quais o processamento em tempo de execução é realizado.\nA flag de protótipo allow_burner_leech está sempre ativada para todos os insersores, independentemente desta configuração.
inserter-fuel-leech-discover-per-tick=(Re)descobre esta quantidade de insersores já existentes no mapa a cada tick.\nAumente ao usar mods que criam muitos insersores que você deseja que sejam processados sem acionar os eventos apropriados.\nCaso contrário, deixe em 1. Definir isto como zero não ajudará com problemas de UPS, mesmo jogando em uma batata.
inserter-fuel-leech-discover-empty-chunks-per-tick=Pula no máximo esta quantidade de blocos vazios a cada tick ao (re)descobrir insersores.\nEsta é principalmente uma configuração de depuração. O valor padrão deve funcionar bem em qualquer sistema.
inserter-fuel-leech-self-leech-from-drop-enabled=Se um insersor a combustão precisar de combustível, ele poderá pegá-lo de seu alvo de entrega, além de pegá-lo do alvo de coleta.
inserter-fuel-leech-self-refuel-cheat-enabled=Se um insersor a combustão ficar preso sem combustível e tiver combustível em sua garra, ou se seu alvo de coleta ou alvo de entrega tiver combustível, um item desse combustível será teletransportado para o inventário de combustível do insersor.
inserter-fuel-leech-target-item-count-min=A quantidade de itens a ser mantida no inventário de destino. O comportamento padrão do insersor é inserir 5 itens de combustível em inventários de combustível de não veículos.
inserter-fuel-leech-pickup-margin-ticks=Os insersores teletransportarão itens de combustível para a sua garra com até essa quantidade de ticks de antecedência do alvo de coleta ou de atraso do alvo de entrega. Se este valor for muito baixo, o insersor já poderá ter coletado outro item ou perder a oportunidade de drenar de um alvo de entrega quando as estimativas de tempo falharem.
inserter-fuel-leech-no-use-for-fuel-seconds-to-wait=Segundos a aguardar antes da próxima atualização quando o insersor ou seu alvo não consumirem itens de combustível.\nEste também é o tempo de resposta para quando o alvo de entrega do insersor mudar.\nAumente isto primeiro se estiver enfrentando quedas de UPS.
inserter-fuel-leech-missing-resource-seconds-to-wait=Segundos a aguardar antes da próxima atualização quando o insersor deve obter combustível para si ou para seu alvo, mas não há combustível para coletar.\nEste também é o tempo de resposta para quando itens de combustível ficarem disponíveis.\nAumente isto se estiver enfrentando quedas de UPS devido a colunas de fornalhas notoriamente desabastecidas.
inserter-fuel-leech-missing-power-seconds-to-wait=Segundos a aguardar antes da próxima atualização quando um insersor que não queima combustível estiver sem energia.\nEste também é o tempo de resposta para quando a eletricidade (ou fluidos para certos insersores modificados) for restaurada.\nAumente isto se estiver enfrentando quedas de UPS em fábricas que utilizam muitos interruptores de energia ou insersores movidos a fluidos de mods.
inserter-fuel-leech-vanilla-self-refuel-seconds-to-wait=Segundos a aguardar antes da próxima atualização quando um insersor que consome combustível estiver sem combustível e puder se reabastecer a partir de um inventário a combustão no local de coleta (comportamento padrão do jogo) [s]
inserter-fuel-leech-wait-variation-seconds=Duração máxima em segundos a ser adicionada às durações de espera anteriores para ajudar a distribuir a carga de atualização uniformemente.\nAumente isto se notar picos recorrentes de queda de UPS em intervalos correspondentes a uma das outras configurações após construir muitos insersores em pouco tempo.\nAumentar este valor não ajuda quando o UPS estiver continuamente abaixo de 60.
inserter-fuel-leech-log-low-traffic=Exibe uma mensagem no bate-papo para eventos raros, como uma (re)inicialização de estado.
inserter-fuel-leech-log-discovery-cycle=Exibe uma mensagem no bate-papo quando um ciclo de (re)descoberta de insersores terminar.
inserter-fuel-leech-watch-last-inserter=Enche seu bate-papo pessoal com várias mensagens sobre o último insersor construído, com o objetivo de ajudar na depuração do script de controle deste mod.\nO insersor monitorado é o último construído por você. Construa e remova um insersor para parar de monitorar.

[string-mod-setting]
inserter-fuel-leech-inserters-enabled-none=Nenhum
inserter-fuel-leech-inserters-enabled-itemfueled=Insersores a combustão alimentados por itens
inserter-fuel-leech-inserters-enabled-all=Todos os insersores

[string-mod-setting-description]
inserter-fuel-leech-inserters-enabled-none=Nenhum processamento em tempo de execução para qualquer insersor. Impacto de UPS quase nulo.
inserter-fuel-leech-inserters-enabled-itemfueled=Processamento em tempo de execução para insersores a combustão alimentados por itens. O impacto no desempenho depende da quantidade desses insersores.
inserter-fuel-leech-inserters-enabled-all=Processamento em tempo de execução para todos os insersores. Maior impacto no desempenho.
