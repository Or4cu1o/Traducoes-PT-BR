[technology-description]
crude-asteroid-crushing=Separando recursos extraplanetários de forma rudimentar. Não gera benefícios de produtividade, mas cumpre a função.
promethium-thermals=A energia do Prometheus pode ser aproveitada para geração e distribuição térmica flexíveis. As condições frias de Aquilo mantêm reações anômalas sob controle.

[mod-setting-name]
heating-hard-mode=Reequilíbrio de energia de aquecimento
heat-conduit=Rendimento da receita do conduíte de calor
limit-dissipator-proximity=Limitar a proximidade do dissipador térmico
submerged-promethium-bonus=Bônus de Prometheus submerso
aquilo-ocean-destroys-items=O oceano de Aquilo destrói itens
stirling-generator-lithium=O gerador Stirling requer placas de lítio
beans-mode=Modo feijão

[mod-setting-description]
heating-hard-mode=Aumenta o custo de energia de aquecimento de várias máquinas importantes para compensar a termalização com Prometheus (consulte a página do mod para obter detalhes). Sobrecarregará seu sistema de aquecimento.
heat-conduit=Quando definido como um número acima de 0, adiciona uma receita para conduíte de calor (um tubo de calor mais fraco) que faz com que esse número de conduítes para o tubo de calor regular custe mais um pedaço de Prometheus.
limit-dissipator-proximity=Dissipadores térmicos não podem ser colocados na faixa de aquecimento de outra unidade térmica. Recomenda-se deixar esta opção ativa.
submerged-promethium-bonus=Por ponto, depósitos meteóricos submersos terão +3% de rendimento de Prometheus, -2% de rendimento carbônico e -1% de rendimento metálico. Opção oferecida caso você queira que Aquilo sirva como fonte primária de Prometheus.
aquilo-ocean-destroys-items=Itens soltos ou despejados no oceano amoniacal serão perdidos nas profundezas, destruídos permanentemente. Simplifica lidar com desequilíbrios, mas não é crucial para a experiência.
stirling-generator-lithium=Adiciona placas de lítio à receita do gerador Stirling para localizar seu uso em Aquilo, reduzindo a interrupção na progressão elétrica de outros planetas.
beans-mode=NÃO RECOMENDADO. Os inícios de Aquilo têm quase todas as modificações de recursos e progressão removidas, exceto quando necessário para evitar travamentos na progressão.

[frozen-reaches-intro]
greeting=Você pousou em um lugar inóspito. Apenas um conjunto de depósitos é acessível sem tecnologia; esteja pronto para explorar as profundezas antes que elas se esgotem.
starting-without-cargo-ships=! AVISO !\nNavios de carga não detectados. É altamente recomendável incluí-los no início do Aquilo para garantir o acesso aos recursos offshore muito mais cedo.
