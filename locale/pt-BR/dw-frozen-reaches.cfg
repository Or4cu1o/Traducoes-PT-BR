[item-description]
heat-conduit=Sistema de transferência de calor com núcleo de Prometheus. Eficiente em termos de material, mas com calor máximo limitado e dependente das condições atmosféricas para se manter estável.
thermal-buoy=Fonte de calor fraca alimentada por Prometheus. Não pode ser adjacente a plataformas ou outra boia térmica.
thermal-dissipator=Fonte de calor fraca alimentada por Prometheus. Segura para uso em superfície, mas com rendimento menor e não pode estar na faixa de aquecimento de outra unidade térmica.

