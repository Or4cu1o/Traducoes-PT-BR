tiberium-mixed-science=Combine vários tipos diferentes de dados do Tiberium para obter __1__% mais pacotes científicos do Tiberium!
tiberium-growth=Use aceleradores de crescimento para alimentar substrato de Tiberium para a blossom tree, fazendo com que eles cresçam o campo de minério de Tiberium ao redor em uma taxa acelerada

