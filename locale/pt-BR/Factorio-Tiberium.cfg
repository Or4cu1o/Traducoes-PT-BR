[map-gen-preset-description]
Tib-only=Uma predefinição para desativar a colocação automática de recursos que não sejam de Tiberium. Certifique-se de habilitar também "somente minério de Tiberium" em "configurações do mod".

[space-location-name]
tiber=Tiber

[space-location-description]
tiber=Um deserto silencioso, minado por campos de cristais verdes radioativos e brilhantes. O radar não mostra sinais de movimento, mas você jura que aqueles cristais estão mais perto do que há cinco minutos. Estabeleça rapidamente uma fábrica e desbloqueie novas tecnologias para conter as marés verdes, para que você e sua base não acabem em seu abraço fatal.

[tiberium-strings]
informatron-reminder=Se você é novo no Factorio e no Conquer: Tiberian dawn, recomendamos baixar o mod "informatron", que inclui um wiki que explica muitas de nossas mecânicas e sistemas.
growth-accelerator-gains=Cultivou __1__ minério extra
node-placement-error=Não é possível fazer brotar uma árvore de flor de Tiberium tão perto de outra árvore de flor de Tiberium
wild-blue-notification=A primeira mutação selvagem do __1__ blue Tiberium ocorreu em __2__
taking-tiberium-radiation-damage=Sofrendo dano de radiação do Tiberium!
tiber-restart-notice=Não é possível começar no tiber com um mundo existente. Comece um novo mundo se quiser começar no tiber.
reprocessor-input-error=__1__ não pode ser reciclado em substrato de Tiberium
growth-accelerator-input-error=Apenas substrato de Tiberium pode ser usado para acelerar o crescimento do Tiberium

[Factorio-Tiberium]
menu_Factorio-Tiberium=Factorio and Conquer
title_Factorio-Tiberium=Factorio and Conquer
mod_page=Bem-vindo ao Factorio e Conquer! \n Aqui é onde explicaremos a mecânica e as máquinas do mod.
menu_tiberium_growth=Crescimento de Tiberium
title_tiberium_growth=Crescimento de Tiberium
tiberium_growth=O Tiberium no mundo não é estático como outros minérios. Ele cresce com o tempo. Os nós crescem a cada 5 minutos, em um cronômetro diferente dos outros nós. \nO minério de Tiberium causa dano ao jogador com base em quantas peças de minério você estiver perto. 0.1 de dano para cada peça em um raio de 1.5 peças.
menu_nodes=Nodes
title_nodes=Nodes
nodes=Tiberium cresce a partir de nós no mundo. Um nó cresce a cada 5 minutos, em um tempo diferente dos outros nós. Cuidado, o tiberium causa dano a você e a colocação danifica construções. \nNovos nós podem ser criados pelo crescimento de Tiberium. Há uma chance de que um crescimento crie um nó em vez de adicionar minério ao bloco. Essa chance aumenta quanto mais minério houver no bloco alvo. Essa chance é 0 se o bloco alvo estiver abaixo do valor de dispersão de Tiberium.
menu_growth_accelerator=[item=tiberium-growth-accelerator]Aceleração do crescimento
title_growth_accelerator=Aceleração do crescimento
growth_accelerator=O acelerador de crescimento é uma maneira de usar o excesso de material, alimentando o Tiberium com ele para fazer o campo crescer mais rápido. Utiliza substrato de Tiberium, feito de minérios.\nColocados em nós, eles usam constantemente o substrato de Tiberium para acumular uma carga, que é então liberada quando o nó cresce.
menu_harvesting=Colheita de Tiberium
title_harvesting=Colheita de Tiberium
harvesting=Além das brocas de mineração básicas, o mod oferece diversas maneiras de coletar tiberium, algumas mais permanentes que outras. \nMinerar tiberium é bastante simples. Cintos, mineradores e postes de energia são imunes ao dano causado pelo crescimento de tiberium, então você pode colocá-los livremente para minerar tiberium.
menu_node_harvester=[item=tiberium-node-harvester]Coletor de nós
title_node_harvester=Coletor de nós
node_harvester=O coletor de nós é uma maneira de se livrar de nós indesejados. Ele os extrai, removendo-os permanentemente. Pode levar algum tempo, se o nó for rico.
menu_tiberium_spike=[item=tiberium-spike]Tiberium espinho
title_tiberium_spike=Tiberium espinho
tiberium_spike=Tiberium espinho permite a exploração segura do tiberium. Ao colocar um desses em um nó, ele o cobre completamente, interrompendo o crescimento, enquanto colhe Tiberium derretido.
menu_tiberium_control_node=[item=tiberium-network-node]Nó de rede Tiberium (TNN)
title_tiberium_control_node=Nó de rede Tiberium (TNN)
tiberium_control_node=A TNN é o ápice da mineração em massa de tiberium, realizando-a em grandes áreas com extrema rapidez. No entanto, ela não minera nós.
menu_tiberium_seed=[item=tiberium-seed]Semente de Tiberium líquida
title_tiberium_seed=Semente de Tiberium líquida
tiberium_seed=A semente de Tiberium líquido é um míssil que espalha tiberium. Dispará-la em um local cria minério de tiberium em um raio de 2 quadrados, incluindo a diagonal. Quadrados mais distantes recebem menos minério. Se uma semente fizer com que um quadrado ultrapasse o limite máximo de minério por quadrado (1000 por padrão), um Nodo é criado, permitindo o crescimento de tiberium.
menu_aoe_node_harvester=[item=tiberium-aoe-node-harvester]Coletor de nós AOE
title_aoe_node_harvester=Coletor de nós
aoe_node_harvester=O coletor de nós AOE é uma maneira de se livrar de muitos nós indesejados. Ele os minera, removendo-os permanentemente. Pode levar algum tempo, se os nós forem ricos.
menu_tiberium_control_network=[item=tiberium-control-node]Rede de controle do Tiberium
title_tiberium_control_network=Rede de controle do Tiberium
tiberium_control_network=A rede de controle de Tiberium é uma poderosa estrutura de sinalização que melhora a velocidade de mineração de equipamentos de coleta de tiberium próximos. \n\nCada edifício só pode ser afetado por no máximo 3 sinalizadores. O aumento base por sinalizador é de 100% de velocidade e 200% de consumo de energia. Isso pode ser aumentado em 25% e 40%, respectivamente, para cada nível da tecnologia de energia da rede de controle do Tiberium. Além disso, há um requisito de energia de 5 MW para cada entidade afetada por pelo menos 1 sinalizador. \n\nAs seguintes entidades são afetadas por isso: \n-Tiberium espinho \n-Coletor de nós de Tiberium \n-Nó de rede Tiberium \n-Coletor de nós AOE
menu_refining=Refinamento de Tiberium
title_refining=Refinamento de Tiberium
refining=O refino do tiberium é um processo de várias etapas, com alguns subprodutos ao longo do caminho.
menu_tiberium_ore=[item=tiberium-ore]Minério de Tiberium
title_tiberium_ore=Minério de Tiberium
tiberium_ore=O minério de tibério é o material base. Ele pode ser centrifugado ou refinado em lama. Também pode ser queimado como combustível. \nManter minério no seu inventário causa dano. Isso também se aplica ao minério nos seus espaços de lixo.
menu_sludge=[fluid=tiberium-sludge]Lodo
title_sludge=Lodo
sludge=O lodo é o principal subproduto do refino de tiberium. É produzido em cada etapa do refino e é opcional nas receitas diretas.\nEmbora seja menos valioso que o Tiberium refinado, ele ainda tem múltiplos usos.
menu_slurry=[fluid=tiberium-slurry]Lama Tiberium
title_slurry=Lama Tiberium
slurry=A lama é a primeira etapa do refino do tibério. Essa etapa ocorre em máquinas de montagem e pode ser usada para centrifugação ou refino em fundido.
menu_molten=[fluid=molten-tiberium]Tiberium derretido
title_molten=Tiberium derretido
molten=Fundido é a segunda etapa do refino de tibério. Esta etapa ocorre em refinarias. O tibério fundido pode ser usado em receitas diretas para produzir diretamente minérios individuais em grandes quantidades, centrifugados para uma proporção calculada de materiais ou refinados em líquido.
menu_liquid=[fluid=liquid-tiberium]Tiberium líquido
title_liquid=Tiberium líquido
liquid=O tiberium líquido é o último produto do refino. É usado em armamentos, produção de energia e na semeadura de mais tiberium. A produção de energia pode ser feita por meio do uso direto em uma usina de energia, acondicionando-o em células de combustível para uso em energia nuclear e simplesmente queimando-o como um fluido com valor combustível. \nUtilizar células de combustível para alimentar um reator nuclear é um processo de várias etapas. As células vazias precisam ser fabricadas e, em seguida, preenchidas com líquido. Após o uso em um reator, elas ficam sujas e precisam ser limpas. Esse processo também filtra qualquer célula que possa estar danificada ou inutilizável, portanto, você precisa garantir a produção contínua de células de reserva.
menu_centrifuging=[item=centrifuge]Centrifugação
title_centrifuging=Centrifugação
centrifuging=A centrifugação pode ser feita a partir de minério, lama, fundido ou líquido e produz uma proporção calculada de minérios para um estágio predefinido do jogo. \nAs relações de corrente são determinadas pelos requisitos dos pacotes científicos em 3 níveis: Pré-óleo, pré-foguete e o que for necessário para repetíveis. No entanto, o cálculo não é perfeito, portanto, informe qualquer coisa que você considere estranha.
menu_containment=Contenção
title_containment=Contenção
containment=O mod tem vários métodos para conter tiberium para quando você não quiser colhê-lo, bem como equipamentos para se proteger dele.
menu_armor=[item=power-armor-mk2]Armadura
title_armor=Armadura
armor=O mod inclui 2 níveis de proteção contra dano de contato do Tiberium. O Tiberium militar 1 reduz significativamente a quantidade de dano ambiental sofrido pelo Tiberium, enquanto o Tiberium militar 3 concede imunidade completa ao dano ambiental causado pelo Tiberium enquanto você estiver usando armadura de poder.
menu_sonic_fences=[item=tiberium-srf-emitter]Esgrima sônica
title_sonic_fences=Esgrima sônica
sonic_fences=Cercas sônicas são um método passivo para controlar o tiberium. Basta posicionar as cercas, com até 15 quadrados de distância entre elas, e uma cerca de energia sônica será gerada entre elas. Essa cerca impede que o tiberium cresça além dela. Essa cerca também afeta o crescimento, fazendo com que qualquer tiberium bloqueado seja reduzido em 50% e, em seguida, colocado no quadrado mais próximo do nó de onde veio.
menu_MARV=[item=tiberium-marv]MARV (VBRM)
title_MARV=Veículo blindado de recuperação mamute
MARV=O MARV é sua arma definitiva contra o tiberium. Simplesmente passando por cima do minério, o MARV limpa o terreno, coletando parte do tiberium para seu inventário e também reabastecendo seus suprimentos de combustível.
menu_weaponry=Armamento de Tiberium
title_weaponry=Armamento de Tiberium
weaponry=O mod possui diversas armas baseadas na tecnologia do tiberium. Como o tiberium é explosivo, é usado em mísseis e, com a capacidade de se ionizar facilmente, é perfeito para feixes de partículas iônicas.
menu_ion_projector=[item=tiberium-obelisk-of-light]Obelisco da luz
title_ion_projector=Obelisco da luz
ion_projector=Este laser de alta potência destrói tropas e armamentos com eficácia a longa distância. É a arma de bordo mais poderosa do jogo. No entanto, seu tempo de recarga lento significa que não pode ser a única arma a defender sua base. Certifique-se de ter energia de sobra antes de construir estes lasers, pois danos às suas usinas de energia manterão os obeliscos inativos.
menu_tiberium_missiles=[item=tiberium-rocket]Armas de mísseis de Tiberium
title_tiberium_missiles=Armas de mísseis de Tiberium
tiberium_missiles=O mod adiciona 2 armas de mísseis baseadas no poder explosivo do Tiberium. O primeiro é apenas um míssil robusto, causando dano adicional ao Tiberium em comparação com o míssil normal. O outro é uma bomba de Tiberium líquida, com um raio maior e mais dano que a bomba nuclear do vanila.
