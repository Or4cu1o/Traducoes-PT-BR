[mod-setting-description]
tiberium-direct-catalyst=Requer um pouco do recurso alvo como semente para receitas de transmutação. Ajuda a evitar que recursos de outros mods sejam desbloqueados fora de ordem.\nPadrão: desabilitado
tiberium-direct-surface-condition=O tiberium só pode ser transmutado para outros recursos em planetas onde ocorre naturalmente.\nPadrão: habilitado
tiberium-direct-planet-techs=Exija tecnologias adicionais com pacotes científicos de outros planetas para desbloquear a transmutação dos recursos daquele planeta.\nPadrão: habilitado
tiberium-easy-recipes=Simplifica receitas removendo todos os catalisadores e introduzindo receitas de transmutação antecipada para que você nunca precise se preocupar com centrifugação. Para uma experiência completa, desative também as configurações de resíduos abaixo.\nPadrão: desabilitado
tiberium-byproduct-1=Se as receitas de refino produzem resíduos de lodo de tiberium.\nPadrão: habilitado
tiberium-byproduct-2=Se as receitas de refino produzem resíduos de enxofre.\nPadrão: desabilitado
tiberium-byproduct-direct=Se receitas diretas produzem resíduos de lodo de tibério.\nPadrão: desabilitado
tiberium-damage=Escale o dano que o Tiberium causará às estruturas quando ele crescer, aos jogadores que estiverem sobre ele ou aos jogadores que o tiverem em seu inventário.\nDefault: 10
tiberium-radius=Distância dos nós onde o Tiberium pode crescer. Mineradores de área de efeito e distâncias entre árvores em flor também aumentam com isso.\nDefault: 30
tiberium-growth=Ajusta a quantidade de minério de Tiberium que pode crescer em um ladrilho.\nDefault: 10
tiberium-blue-target-evo=Em torno de qual fator de evolução você espera que o blue Tiberium comece a aparecer na natureza\nDefault: 0.6
tiberium-blue-saturation-point=Qual a porcentagem de Tiberium verde transformada em Tiberium azul que é considerada totalmente saturada.\nDefault: 50%
tiberium-blue-saturation-slowdown=Quão rápido o Tiberium verde deve ser transformado em Tiberium azul depois que o planeta estiver totalmente saturado com Tiberium azul.\nDefault: 10%
tiberium-debug-text=Envia muitas mensagens de depuração úteis e irritantes no jogo.\nPadrão: desabilitado
tiberium-debug-text-startup=Registra informações adicionais no arquivo factorio-current.log para solução de problemas de centrifugação ou outros problemas.\nPadrão: desabilitado
tiberium-force-vanilla-centrifuging=Ignore todas as configurações abaixo para receitas de centrifugação dinâmicas de Tiberium e use receitas estáticas e originais. Ativar a configuração fornecerá cobre, ferro, pedra, carvão e petróleo bruto da centrifugação, sem levar em conta recursos e receitas modificados.\nPadrão: desabilitado
tiberium-centrifuge-override=Configuração avançada: substitua a saída da receita __1__ gerada automaticamente por algo que você considere mais apropriado para sua combinação de mod.\nInsira uma sequência delimitada dos itens/fluidos e quantidades que devem vir da receita no formato exato "item1-internal-name:item1-amount,item2-internal-name:item2-amount" e.g. iron-ore:13,crude-oil:32\nVocê pode encontrar os nomes internos dos itens carregando em um jogo, pressionando F4 para abrir as configurações de depuração, habilitando "show-debug-info-in-tooltips" e, em seguida, passando o mouse sobre o item desejado e observando o "item-name" campo. Para fluidos, passe o mouse sobre eles no FNEI ou nas receitas de desbloqueio.\nPadrão: deixe em branco para usar a saída de receita __1__ gerada automaticamente
tiberium-centrifuge-alien-ores=Incluir ou não minérios e receitas de planetas diferentes de Nauvis na geração de receitas por centrifugação. Pode resultar em receitas distorcidas ou que interrompem a progressão.\nPadrão: desabilitado
tiberium-resource-inclusions=Configuração avançada: liste todos os itens/fluidos a serem considerados recursos que devem ser fornecidos pelas receitas de centrifugação ou transmutação de tiberium.\nInsira uma sequência delimitada por vírgulas dos itens/fluidos no formato exato "item1-internal-name,item2-internal-name" e.g. uranium-ore,crude-oil\nVocê pode encontrar os nomes internos dos itens carregando em um jogo, pressionando F4 para abrir as configurações de depuração, habilitando "show-debug-info-in-tooltips", e então passar o mouse sobre o item desejado e anotar o "item-name" campo. Para fluidos, passe o mouse sobre eles no FNEI ou nas receitas de desbloqueio.\nPadrão: deixe em branco para permitir apenas a centrifugação e a transmutação de recursos perfuráveis/bombeáveis
tiberium-resource-exclusions=Configuração avançada: liste recursos que nunca devem ser fornecidos por receitas de centrifugação ou transmutação de tiberium.\nInsira uma sequência delimitada por vírgulas dos itens/fluidos no formato exato "item1-internal-name,item2-internal-name" e.g. uranium-ore,crude-oil\nVocê pode encontrar os nomes internos dos itens carregando em um jogo, pressionando F4 para abrir as configurações de depuração, habilitando "show-debug-info-in-tooltips", e então passar o mouse sobre o item desejado e anotar o "item-name" campo. Para fluidos, passe o mouse sobre eles no FNEI ou nas receitas de desbloqueio.\nPadrão: deixe em branco para permitir a centrifugação e a transmutação de todos os recursos
tiberium-recipe-category-exclusions=Configuração avançada: liste categorias de receitas que devem ser ignoradas ao calcular os ingredientes necessários para criar.\nInsira uma sequência delimitada por vírgulas das categorias de receitas no formato exato "recipe-category1,recipe-category2" e.g. recycling,pressing\nPadrão: o script de receita de centrifugação tentará excluir receitas em loop ou receitas que fabricam itens do nada, mas às vezes será confundido por mods com cadeias de receitas novas ou complexas.
tiberium-value=Ajusta a quantidade de matéria-prima obtida de um único pedaço de minério de Tiberium. Valores mais altos tornam o jogo mais fácil.\nDefault: 10default: 10
tiberium-enemies-take-environmental-damage=Causa dano aos mordedores ao caminhar perto das árvores de flor de Tiberium. Historicamente, causou problemas com UPS.\nPadrão: desabilitado
tiberium-pollution-multiplier=Ajusta a quantidade de poluição extra produzida pelo refino e queima de Tiberium. Defina como 1 para que o refino de Tiberium não produza mais poluição do que receitas normais.\nPadrão:4
tiberium-spread-nodes=Se a expansão do Tiberium deveria naturalmente gerar novos nós e eventualmente cobrir o planeta inteiro.\nPadrão: habilitado
tiberium-starting-area=Inclua Tiberium como um dos seus fragmentos de minério iniciais.\nSim, ele vai se espalhar e consumir os outros fragmentos de minério iniciais.\nSim, isso tornará o jogo significativamente mais difícil.\nVocê não pode esperar misericórdia e apenas dor, você foi avisado.\nPadrão: desabilitado
tiberium-tier-zero=Adiciona um nível extra de centrifugação que você pode acessar antes de desbloquear receitas de fluidos ou eletricidade. Útil apenas para partidas de Tiberium com outros mods que estendem o início do jogo.\nPadrão: desabilitado
tiberium-advanced-start=Comece com algum equipamento básico de refino de Tiberium, para que você possa fazer uma corrida somente de Tiberium.\nPadrão: desabilitado
tiberium-all-planets=A opção de fazer com que o Tiberium apareça naturalmente em todos os planetas, em vez de apenas em Nauvis. Independentemente dessa configuração, você pode introduzir Tiberium em qualquer planeta manualmente.\nPadrão: desabilitado
tiberium-ore-removal=Para uso com a predefinição de geração de mapas "somente Tiberium". Habilita o minério de Tiberium na configuração inicial e a configuração inicial avançada de Tiberium.\nPadrão: desabilitado
tiberium-item-damage-scale=Ajusta o dano causado por carregar Tiberium no seu inventário com base no número de acúmulos que você possui. Cuidado ao minerar baús cheios de Tiberium!\nPadrão: desabilitado
tiberium-auto-scale-performance=Reduza a granularidade de crescimento do Tiberium no final do jogo para evitar possíveis perdas de UPS.\nPadrão: desabilitado
tiberium-technology-triggers=Algumas tecnologias do Tiberium são desbloqueadas pela mineração ou refino do Tiberium, em vez de pacotes em laboratórios.\nPadrão: habilitado
tiberium-description-default=Padrão
tiberium-description-enabled=Ativado
tiberium-description-disabled=Desativado
tiberium-grow-on-landfill=Permite que o Tiberium se espalhe em ladrilhos de aterro. Pode ter resultados imprevistos se usado com mods que regeneram recursos ou terreno.

