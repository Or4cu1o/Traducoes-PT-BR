[item-description]
tiberium-growth-credit=Usado por aceleradores de crescimento para aumentar o rendimento dos nós de Tiberium. Tem o que o Tiberium precisa: eletrólitos!
tiberium-primed-reactant=Um pacote condensado de Tiberium e catalisadores, pronto para ser transmutado em qualquer minério.
tiberium-primed-reactant-blue=Um pacote energético de Tiberium e catalisadores deve ser convertido em um reagente preparado com Tiberium antes de ser seguro para uso.
tiberium-ion-core=Um dispositivo para gerar fluxos de íons para armas iônicas.
tiberium-blue-explosives=Uma forma de Tiberium segura o suficiente para ser manuseada, mas explosiva sob as condições certas.
tiberium-cliff-explosives=Jogue os explosivos em um arco parabólico em direção a uma árvore de flor de Tiberium para detoná-la e destruir permanentemente a veia, interrompendo o crescimento futuro de Tiberium.
tiberium-rounds-magazine=Um carregador de balas com infusão de Tiberium.
tiberium-rocket=Um míssil com uma pequena quantidade de Tiberium líquido como carga útil.
tiberium-artillery-shell=Este projétil de longo alcance está repleto de uma pequena surpresa de Tiberium que deixará para trás um pouco de minério de Tiberium no impacto.
tiberium-grenade-all=Um explosivo projetado para usar frequências ressonantes para destruir qualquer minério de Tiberium.
tiberium-grenade-blue=Um explosivo projetado para usar frequências ressonantes para destruir minério de Tiberium azul.
tiberium-catalyst-missile-all=Um míssil que desencadeia uma reação em cadeia destruindo qualquer minério de Tiberium próximo no momento do impacto.
tiberium-catalyst-missile-blue=Um míssil que desencadeia uma reação em cadeia destruindo o minério de Tiberium azul próximo ao impacto.
tiberium-seed=Um míssil não prejudicial que espalha Tiberium verde ao atingir o alvo. Disparar vários mísseis no mesmo local pode criar um novo Nodo de Tiberium se atingir __1__ minério de Tiberium e estiver a __2__ casas de distância do Nodo de Tiberium mais próximo.
tiberium-seed-blue=Um míssil não prejudicial que espalha Tiberium azul ao atingir o alvo. Disparar vários mísseis no mesmo local pode criar um novo Nodo de Tiberium se atingir __1__ minério de Tiberium e estiver a __2__ casas de distância do Nodo de Tiberium mais próximo.
tiberium-chemical-sprayer-ammo=Pode ser pulverizado com um lança-chamas para produzir uma nuvem de curta duração de gás corrosivo Tiberium.
tiberium-empty-cell=Um recipiente de célula de combustível vazio, pronto para ser preenchido com combustível nuclear.
tiberium-dirty-cell=Um recipiente de Tiberium líquido contaminado para uso nuclear. Deve ser limpo e inspecionado antes de ser reutilizado.
tiberium-fuel-cell=Uma célula de combustível com uma pequena quantidade de Tiberium líquido, para uso em energia nuclear.
tiberium-science=Usado por laboratórios para pesquisa.
tiberium-data=Dados de um teste no Tiberium.

