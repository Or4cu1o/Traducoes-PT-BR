[technology-description]
tiberium-ore-centrifuging=Usando maquinário especializado, podemos separar o minério de tibério em matérias-primas úteis.
tiberium-slurry-centrifuging=Usando maquinário especializado, podemos separar a pasta de tibério em matérias-primas úteis.
tiberium-molten-centrifuging=Usando maquinário especializado, podemos separar o tibério fundido em matérias-primas e líquidos adicionais.
tiberium-liquid-centrifuging=Usando maquinário especializado, podemos separar o tibério líquido em ainda mais matérias-primas.
tiberium-advanced-molten-processing=Criamos esta tecnologia separadamente só para que você pudesse admirar este ícone? Sim, e de nada.
tiberium-control-network-tech=Desbloqueia métodos mais eficientes de mineração, utilização e controle do tibério.
tiberium-power-tech=Descubra as muitas maneiras pelas quais o tibério líquido pode ser usado como fonte de energia.
tiberium-sludge-processing=Desvende os segredos deste líquido misterioso. Não, espere, ainda é basicamente só lama.
tiberium-sludge-recycling=Você guardou toda essa lama como eu disse, certo? Ótimo, porque os cientistas acabaram de encontrar uma maneira de enriquecer o Tiberium derretido com ela.
tiberium-growth-acceleration=A capacidade de alimentar o Tiberium com recursos para acelerar seu crescimento.
tiberium-mutation=Por razões puramente científicas, encontramos uma maneira de cultivar o Tiberium azul em laboratório.
tiberium-monoculture=Bloqueie mutações para forçar as árvores flores a cultivarem apenas minério de Tiberium de um único tipo.
tiberium-easy-transmutation-tech=Nossos cientistas têm vergonha de admitir que perderam tanto tempo pesquisando transmutação quando poderiam simplesmente ter ativado o 'modo fácil'.
tiberium-transmutation-tech=Entender como o Tiberium opera em nível molecular para desvendar os segredos da transmutação nuclear.
tiberium-transmutation-tech-planet=Entendendo melhor como o Tiberium opera em nível molecular para desvendar os segredos da transmutação nuclear de recursos encontrados em __1__.
tiberium-mechanical-research=Testando as propriedades mecânicas do Tiberium à medida que começamos a aprender sobre esse material estranho.
tiberium-thermal-research=Testando as propriedades térmicas do Tiberium e usando sua forma fundida para liberar mais de seu potencial.
tiberium-chemical-research=Testando as propriedades químicas do Tiberium e refinando-o até sua forma mais pura e volátil.
tiberium-nuclear-research=Com todos os dados dos nossos testes anteriores, estamos confiantes de que podemos fazer experiências com Tiberium no nível molecular sem transformar nossa base em uma cratera.
tiberium-electromagnetic-research=Utilizando o poder computacional recém-descoberto para analisar as emissões do Tiberium normal e do teste anterior, podemos progredir mais rapidamente se combinarmos isso com os dados dos nossos testes anteriores.
tiberium-molten-processing=Refinando o Tiberium até um estado fundido, permitindo técnicas de extração mais avançadas.
tiberium-energy-weapons-damage=Pesquisas extensas sobre como melhorar os procedimentos de ionização do Tiberium podem gerar informações úteis para armas de energia em geral.
tiberium-explosives=Pesquisar como o Tiberium explode pode ser útil para melhorar todos os explosivos.
tiberium-containment-tech=Maneiras de retardar a disseminação do Tiberium. Emissores SRF podem criar cercas sônicas que o Tiberium não consegue atravessar e coletores de Nodos podem minerar nós para removê-los.
tiberium-control-network-speed=Ao alimentar mais energia no equipamento TCN, podemos minerar Tiberium mais rapidamente.
tiberium-advanced-containment-tech=Ferramentas avançadas para interromper o crescimento do Tiberium e removê-lo rapidamente. Será uma longa batalha, comandante, mas acreditamos que você pode transformar __1__ novamente em uma zona azul.
tiberium-military-partial-immunity=__1__ redução no dano sofrido por Tiberium
tiberium-military-total-immunity=Imune a danos de Tiberium ao usar qualquer armadura de poder
tiberium-control-network-speed-effect=Bônus de velocidade da rede de controle do Tiberium: __1__\nConsumo de energia da rede de controle Tiberium: __2__
tiberium-refining-blue=Esta potente variante de Tiberium raramente ocorre na natureza, mas consome Tiberium verde à medida que se espalha. Descobrimos maneiras de refiná-la em explosivos e Tiberium líquido puro.
tiberium-rocketry=Espere, você pesquisou toda essa tecnologia militar e suas torres ainda só disparam balas?
tiberium-artillery=Nova iniciativa de artilharia para se tornar sustentável... com uma carga útil de Tiberium. Salpique a paisagem com mais minério de Tiberium.
tiberium-nuke=Criando os mísseis Tiberium definitivos que fazem as duas coisas em que o Tiberium se destaca: produzir mais Tiberium e destruir qualquer coisa que não seja Tiberium.
tiberium-ore-destruction=Usando ressonância sônica, podemos estilhaçar minério de Tiberium para recuperar terras rapidamente. Só não respire o ar por um tempo.

