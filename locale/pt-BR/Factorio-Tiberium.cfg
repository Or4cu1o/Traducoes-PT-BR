[entity-description]
tiberium-power-plant=Consome Tiberium líquido para criar energia elétrica.
tibGrowthNode_infinite=Nó de Tiberium que foi cravado e não espalha mais Tiberium. Ainda é possível extrair recursos dele usando um espinho de Tiberium.
tiberium-srf-emitter=Um gerador de campo repulsor sônico que pode manter uma 'cerca' de comprimento máximo de 15 entre dois hubs. Requer 0,5 MW de energia para manter os campos.
tiberium-srf-wall=Um campo de repulsão sônica, inofensivo a tudo, exceto ao Tiberium. Faz com que traços de partículas de Tiberium no ar brilhem em azul à medida que são desintegradas.
tiberium-sonic-emitter=Um canhão sônico que usa frequências ressonantes para destruir minério de Tiberium próximo. Não ataca mordedores.
tiberium-sonic-emitter-blue=Um canhão sônico que usa frequências ressonantes para destruir apenas minério de Tiberium azul próximo. Não ataca mordedores.
tiberium-spike=Um extrator autônomo e autoalimentado de Tiberium fundido, refinando no local e evitando crescimento adicional.
tiberium-detonation-charge=Coloque este explosivo em uma árvore de flor de Tiberium e detone-a usando uma arma de projétil para destruir permanentemente a veia e impedir o crescimento futuro de Tiberium.
tiberium-growth-accelerator=Consome lentamente o substrato de Tiberium para acelerar o crescimento do Tiberium a partir do nó de Tiberium em que é colocado.
tiberium-growth-accelerator-node=Consome lentamente o substrato de Tiberium para acelerar o crescimento do Tiberium a partir do nó de Tiberium em que é colocado.
tiberium-monoculture-green=Um grande purificador que, quando colocado em um nó de Tiberium e ligado, garantirá que somente Tiberium verde cresça nas proximidades.
tiberium-monoculture-blue=Um grande purificador que, quando colocado em um nó de Tiberium e ligado, garantirá que somente Tiberium azul cresça nas proximidades.
tiberium-reprocessor=Uma instalação projetada para reciclar minérios não utilizados em substrato de Tiberium. Funciona na mesma proporção que as receitas da usina química, mas pode reciclar todos os minérios em uma única instalação.
tiberium-network-node=Colhe rapidamente minério de Tiberium em uma grande área.
tiberium-node-harvester=Coleta rapidamente minério de Tiberium diretamente de um nó de Tiberium. Pode remover permanentemente o nó de Tiberium se ele estiver esgotado.
tiberium-centrifuge-0=Uma centrífuga de queimador primitiva endurecida contra o contato do Tiberium, para separá-lo em seus componentes.
tiberium-centrifuge-1=Uma centrífuga endurecida contra o contato do Tiberium, para separá-lo em seus componentes.
tiberium-centrifuge-2=Uma centrífuga aprimorada e reforçada contra contato com o Tiberium, para separá-lo em seus componentes.
tiberium-centrifuge-3=Uma centrífuga aprimorada e reforçada contra contato com o Tiberium, para separá-lo em seus componentes.
tiberium-marv=Um veículo lento e fortemente blindado que pode destruir campos de minério de Tiberium apenas passando por cima deles.
tiberium-aoe-node-harvester=Coleta rapidamente minério de Tiberium diretamente de vários nós de Tiberium próximos. Pode remover permanentemente os nós de Tiberium se eles estiverem esgotados.
tiberium-control-node=Um nó na rede de controle de Tiberium que aprimora equipamentos de mineração especializados em Tiberium próximos. Um minerador pode ser aprimorado por até 3 nós TCN próximos, cada um concedendo maior velocidade e consumo de energia. Um minerador afetado por qualquer nó TCN requer 5 MW adicionais de energia.
tiberium-control-node-hidden-beacon=O custo fixo de energia para os mineradores afetou os beacons TCN.
tiberium-advanced-guard-tower=Uma estrutura defensiva versátil que dispara salvas de mísseis de seus lançadores de mísseis tomahawk. O general sheppard insiste que você não os carregue com bombas atômicas.
tiberium-obelisk-of-light=Uma arma laser extremamente poderosa da irmandade de Nod que requer tempo para carregar seus capacitores antes de cada disparo.

