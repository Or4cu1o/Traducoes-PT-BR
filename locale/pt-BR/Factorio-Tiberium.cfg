tiberium-hot-potato=Sofra danos por ter minério de Tiberium em seu inventário, acho que você deve encontrar uma maneira mais segura de transportá-lo
tiberium-seed-node=Use mísseis de semente de Tiberium para gerar uma nova árvore de flores
tiberium-spill=Derrame minério de Tiberium no chão destruindo uma estrutura contendo fluidos de Tiberium
tiberium-generator=Aumente a potência do seu gerador de absorção de radiação de Tiberium pisando em minério de Tiberium
tiberium-forgot-armor=Pesquise Tiberium militar 3 e ainda sofra dano pisando em minério de Tiberium porque você esqueceu de equipar uma armadura de poder
tiberium-marv=Colha minério de Tiberium usando um MARV
tiberium-srf=Alinhe dois emissores SRF para formar uma parede que possa conter o crescimento de Tiberium
tiberium-spike=Coloque um espinho de Tiberium em uma árvore em flor para impedir seu crescimento natural e, em vez disso, gerar um fluxo infinito de Tiberium derretido
