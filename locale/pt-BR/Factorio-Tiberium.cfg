tiberium-blue-spawn=Gere poluição suficiente para que o Tiberium verde comece a sofrer mutação para Tiberium azul
tiberium-substrate=Recicle materiais não processados em substrato de Tiberium
tiberium-use-growth-accelerator=Use substrato de Tiberium em um acelerador de crescimento para aumentar a produção dos campos de Tiberium
