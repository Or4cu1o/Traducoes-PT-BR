[transport_drones_pages]
welcome-1=Bem-vindo ao Transport Drones!\nDrones de transporte é um mod que introduz um novo método de movimentação de materiais pela sua fábrica.
fuel-depot-1=Todo o transporte na rede rodoviária requer combustível. O combustível é entregue por [font=default-bold]depósitos de combustível[/font].\n\nA operação é simples:\n - Coloque um depósito de combustível na rede rodoviária.\n - Coloque o combustível no lugar.\n - Adicione drones de transporte.\n\nAgora, o depósito de combustível enviará drones de transporte para depósitos de combustível na rede rodoviária.
drones-1=Os [font=default-bold]drones de transporte[/font] são os agentes que transportam materiais entre depósitos. Eles são designados apenas para um único depósito. Para funcionar, precisam de combustível e produzem poluição ao circular.
drone-details=As especificações atuais do drone são as seguintes:\n - Consumo de combustível: [font=default-bold]__1__[/font] por quilômetro.\n - Poluição: [font=default-bold]__2__[/font] por minuto.\n - Capacidade de itens do drone: [font=default-bold]__3__[/font] stacks.\n - Capacidade de fluido do drone: [font=default-bold]__4__[/font].\n - Velocidade máxima do drone: [font=default-bold]__5__[/font] km/h.
request-depot-1=Para mover itens na rede rodoviária, você usa [font=default-bold]depósitos de solicitação[/font]. Eles enviarão drones para o depósito de suprimentos mais próximo com o item solicitado.\nO número de itens que o depósito de solicitações coletará depende do número de drones presentes no depósito. Para cada drone, o depósito de solicitações aumentará a quantidade solicitada de acordo com a capacidade do drone.\n\n    Exemplo 1: Se os drones puderem conter 1 pilha (sem atualizações) e você colocar 5 drones, o depósito de solicitação despachará drones até ter 5 pilhas em seu inventário.\n    Exemplo 2: Se os drones puderem conter 2 pilhas (1 atualização de capacidade) e você colocar 10 drones, o depósito de solicitação despachará drones até ter 20 pilhas em seu inventário.\n\nDessa forma, você pode ajustar e sintonizar a quantidade solicitada, levando em conta fatores como a produtividade necessária, a distância entre a solicitação e os depósitos de suprimentos, etc. A contagem de solicitações pode ser substituída usando gravadores de depósito de transporte.\nA configuração de um depósito de solicitações é simples:\n - Coloque o depósito de solicitação na rede rodoviária.\n - Selecione o item a ser solicitado.\n - Insira drones de transporte.\nO depósito de solicitação solicitará primeiro o combustível da rede. Assim que tiver combustível, começará a enviar drones para coletar o item solicitado.
supply-depot=[font=default-bold]Depósitos de suprimentos[/font] (e depósitos de fluidos) são participantes passivos na rede rodoviária. Eles disponibilizam seu conteúdo aos depósitos de solicitação na rede rodoviária.
road-network=A [font=default-bold]rede rodoviária[/font] é o sistema no qual os depósitos estão conectados entre si e a estrada sobre a qual os drones de transporte operam. A construção da rede rodoviária é feita simplesmente usando os painéis rodoviários. Quaisquer painéis rodoviários conectados fazem parte da mesma rede rodoviária. Duas áreas desconectadas de painéis rodoviários são redes rodoviárias separadas, e seus depósitos não se abastecerão mutuamente.
buffer-depot=O [font=default-bold]depósito de buffer[/font] atua como depósito de solicitações e depósito de suprimentos.\n\nUm bom caso de uso é coletar minérios de postos avançados distantes para distribuição a muitos depósitos de solicitação próximos. O depósito de buffer pode ter um grande número de drones, e os depósitos de solicitação próximos precisam apenas de 1 ou 2 drones para lidar com a curta viagem do solicitante ao buffer.
circuit-connectors=Os conectores de circuito são a forma de ler e escrever sinais para os depósitos e a rede rodoviária. Eles permitem o uso de condições logísticas e da lógica da rede de circuitos para controlar o comportamento dos depósitos.
depot-reader=O [font=default-bold]leitor de depósito de transporte[/font] permite que você leia o conteúdo dos depósitos de solicitação, depósitos de combustível, depósitos de mineração, depósitos de fluidos e depósitos de buffer.\n\nA saída é sempre apenas 1 sinal, que é o conteúdo do inventário de saída.
depot-writer=O [font=default-bold]gravador de depósito de transporte[/font] permite que você habilite e desabilite os depósitos com base nas condições do circuito/logística.\n    Exemplo 1: Desabilitar um depósito de solicitações impedirá que ele envie drones para coletar itens.\n    Exemplo 2: Desativar um depósito de suprimentos impedirá que ele disponibilize seus itens para a rede rodoviária.
depot-writer-special=Existe um caso especial para depósitos de solicitação/buffer. Se o sinal do circuito for o item solicitado e a condição for '=', o depósito de solicitações usará a contagem de sinais como uma contagem de solicitações de itens.\n    Exemplo: Se o sinal estiver definido como 'iron gear = 155', então o depósito de solicitação tentará preencher até 155 itens, independentemente da contagem de drones.\n\nIsso também funciona usando um sinal de circuito.\n    Exemplo: se o sinal for definido como 'engrenagem de ferro = sinal verde', ele avaliará o valor de 'sinal verde' e essa será a contagem de solicitações de itens.
transport-depots=Os depósitos de transporte são as entidades na rede rodoviária que coordenam o transporte de itens e fluidos. Eles gerenciam o conteúdo e as solicitações da rede rodoviária. Eles se conectam à rede rodoviária por meio da placa de "aviso" no solo, de e para onde os drones serão despachados.
mining-depots=[font=default-bold]Depósitos de mineração[/font] também podem fornecer seu conteúdo diretamente para a rede rodoviária. Basta conectar a posição de entrada/saída do minerador à rede rodoviária.
network-reader=O [font=default-bold]leitor de rede rodoviária[/font] pode ler o conteúdo da rede rodoviária à qual está conectado. No entanto, você deve especificar qual sinal ler, abrindo o leitor e escolhendo o item/fluido cujo conteúdo deseja ler. Uma vez selecionado, o leitor da rede rodoviária continuará atualizando a contagem desse item com o conteúdo da rede rodoviária.\n\nIsso permite que você, por exemplo, habilite ou desabilite certas linhas de produção se a quantidade de minério na rede rodoviária cair abaixo de um determinado valor, ou habilite um armazenamento de reserva.
