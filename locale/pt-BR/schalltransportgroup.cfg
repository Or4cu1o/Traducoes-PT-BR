[mod-name]
SchallTransportGroup=Schall Transport Group

[mod-description]
SchallTransportGroup=Fornece uma nova aba de grupo "Transporte" separada, contendo todos os veículos originais e quaisquer itens já presentes no subgrupo de transporte original.\nFunciona como uma estrutura para reunir quaisquer itens relacionados a transporte.\nProjetado para jogadores que têm muitos veículos de mods entulhando a aba "Logística".

[mod-setting-name]
Schall-TGP-order=Ordem da aba do grupo

[mod-setting-description]
Schall-TGP-order=av: (padrão) depois da aba "Logística".\ndv: depois da aba "Combate".
