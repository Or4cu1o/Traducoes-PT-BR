[tips-and-tricks-description]
angelsrefining=Um mod que introduz minérios compostos, que devem ser refinados antes que você possa fundi-los e vazá-los em placas.
angels-ore-generation=O mod [tooltip=Angels refining,tips-and-tricks-description.angelsrefining] substitui todas as jazidas de minério por novas que você deve refinar antes da fundição. Todos os minérios fundíveis (do jogo base/Bob's/YI) serão substituídos por novos minérios compostos: \n\n__1__\n Também há um novo poço: __2__
angels-ore-refining=Os minérios compostos minerados devem ser refinados antes que você possa fundi-los e vazá-los em placas. Métodos de refino mais avançados resultarão em um rendimento maior de minérios processados e podem desbloquear novos minérios refinados.\n\nExistem 3 modos diferentes atualmente:\n    - Vanilla: refine para maior rendimento de minério de ferro e cobre.\n    - Pure Angel's: refine para uma variedade de materiais.\n    - Bob's-Angel's (vulgo BA ou AB): refine para muitos minérios modificados.\n\nFunciona bem em conjunto com os mods de Bob e suporta outros mods como Yuoki Industries (e os mods tristemente perdidos: Uranium Power e Nuclear.)\nEste mod também introduz o processamento avançado de minério, como trituração de minério, flotação, lixiviação ácida e cristalização para melhorar os rendimentos e a eficiência do minério. Além disso, este mod vem com sistemas de limpeza de águas residuais para uso nestas e em outras cadeias de processamento.\nAs cadeias de processamento de água e refino adicionadas neste mod são exploradas ao longo da árvore de tecnologias.
angels-crushing=Como primeiro passo após a mineração, o minério deve ser triturado em algo que possa ser manuseado. A trituração pega o minério minerado e separa a pedra dura dos materiais úteis.\n\nA receita geral transforma [img=item/angels-ore4] minério composto em [img=item/angels-ore4-crushed] minério triturado, bem como [item=angels-stone-crushed].\nA [item=angels-stone-crushed] pode ser processada em outros materiais no meio do jogo, mas no início pode ser transformada em [item=stone], [item=stone-brick] e [item=stone-wall]. O [img=item/angels-ore4-crushed] minério triturado pode ser fundido diretamente em alguns casos, ou pode ser processado ainda mais e, finalmente, classificado.
angels-crushing-notes=\n\n[font=default-bold]NOTAS[/font]: Exemplos do mundo real de trituração de minério existem em trituradores de bolas, de mandíbulas, pneumáticos e de impacto. Isso é usado para quebrar o minério em pedaços menores, aumentando assim a área de superfície para o processamento químico, particularmente no próximo passo, a flotação.
angels-floatation=A flotação é uma etapa de refino secundária que lava ainda mais o minério triturado para remover mais impurezas. Esta é a primeira das etapas de refino químico, usando água purificada. É aconselhável ter um sistema de purificação de água por perto e um sistema de purificação de águas residuais para os subprodutos, como geodos. Estes são materiais cristalinos encontrados comumente em solos e pedras.\n\nA receita geral converte minério triturado com um pouco de [fluid=angels-water-purified] em pedaços de minério, uma chance de geodo e algumas águas residuais.\nGeodos podem ser processados em uma variedade de coisas diferentes, dependendo dos mods instalados.\nOs pedaços podem ser classificados ou purificados ainda mais na próxima etapa, a lixiviação.
angels-floatation-notes=\n\n[font=default-bold]NOTAS[/font]: Exemplos do mundo real de flotação de minério são numerosos, feitos principalmente com um material semelhante a sabão e uma mistura de água ácida ou alcalina. Isso separará os materiais na solução com base em uma variedade de propriedades físicas e químicas. Se você desejar mais leituras, procure por flotação por espuma (observe que não há 'a' em flot), que é o termo mais geral para o processo.
angels-leaching=A terceira etapa no processo de refino é a lixiviação ácida. Este processo dissolve o pedaço da etapa anterior em um ácido forte, deixando para trás um pouco de escória no processo (supõe-se que isso não seja um problema neste momento). Esta mistura de minério e ácido é cristalizada em cristais de alta pureza relativamente uniformes. Este processo aproveita mais uma vez as propriedades químicas do minério.\n\nA receita geral transforma pedaços de minério com 10 de ácido em 2 cristais de minério.\nGrande parte do ácido necessário nesta etapa pode ser obtida a partir da etapa anterior, a flotação, mas algum ácido adicional pode ser necessário. Este é o primeiro estágio sem produção de resíduos.
angels-leaching-notes=\n\n[font=default-bold]NOTAS[/font]: Exemplos do mundo real de lixiviação ácida geralmente se referem à pilha de rejeitos. A pedra triturada e outros resíduos sólidos do sistema de purificação de minério são lançados em uma grande fossa com base de concreto selada (como uma grande piscina) e pulverizados com ácidos que se infiltram na pilha, dissolvendo assim quaisquer partes úteis da terra que não foram aproveitadas anteriormente. O licor (solução ácida) capturado na base é rico em minerais que geralmente são cristalizados para retornar ao sistema de fundição.
angels-purification=A etapa final de processamento de minério é o ápice da purificação de minério, removendo as últimas impurezas para revelar o minério mais limpo até agora. Uma combinação de calor regenerativo, processamento químico e eletrólise significa que nenhum material sólido ou líquido adicional é necessário ou desperdiçado neste processo.\n\nA receita geral converte cristais de minério em minério purificado.\nEsta etapa de \"polimento\" de minério é raramente usada, exceto para as substâncias mais exóticas e raras, para justificar sua alta qualidade antes da fundição.
angels-ore-sorting=A instalação de classificação de minério é um separador por gravidade, centrífuga e separador de grelha gigante e avançado que filtra o minério refinado em suas partes separadas (ou metais) para fundição em metais de alta qualidade.
angels-ore-sorting-vanilla=\n\nA instalação de classificação transforma os 4 minérios compostos de várias qualidades refinadas em minério fundível, pepitas e seixos, gerando uma mistura diferente. As pepitas e os seixos podem ser posteriormente convertidos em mais minério de metal. O minério purificado de grau superior criará maiores quantidades de minério fundível. O minério purificado também gera escória de metal.
angels-ore-sorting-overhaul=\n\nA instalação de classificação transforma os 6 minérios principais de várias qualidades refinadas em uma variedade de minérios de metal:\n4×[img=item/angels-ore4-crushed] Minério triturado tornam-se 2 minérios primários, 1 minério secundário, bem como 1 [item=angels-slag].\n6×[img=item/angels-ore4-chunk] Pedaços de minério tornam-se 2 minérios primários, 1 minério secundário e 2 minérios terciários, bem como 1 [item=angels-slag].\n8×[img=item/angels-ore4-crystal] Cristais de minério tornam-se 3 minérios primários, 1 minério secundário e 3 minérios terciários, bem como 1 [item=angels-slag].\n9×[img=item/angels-ore4-pure] Minério purificado tornam-se 3 minérios primários, 2 minérios secundários e 4 minérios terciários.\n\nVocê pode ver o que cada minério produzirá passando o mouse sobre o minério no chão.\nOs minérios primários e secundários estão listados abaixo:\n- [item=angels-ore1] e [item=angels-ore2]: Primário [item=iron-ore], Secundário [item=copper-ore]\n- [item=angels-ore3] e [item=angels-ore4]: Primário [item=copper-ore], Secundário [item=iron-ore]\n- [item=angels-ore6]: Primário [item=angels-tin-ore], Secundário [item=angels-quartz]\n- [item=angels-ore5]: Primário [item=angels-lead-ore], Secundário [item=angels-nickel-ore]
angels-ore-sorting-bobs=\n\nA instalação de classificação transforma os 6 minérios principais de várias qualidades refinadas em uma variedade de minérios de metal:\n4×[img=item/angels-ore4-crushed] Minério triturado tornam-se 2 minérios primários, 1 minério secundário, bem como 1 [item=angels-slag].\n6×[img=item/angels-ore4-chunk] Pedaços de minério tornam-se 2 minérios primários, 1 minério secundário e 2 minérios terciários, bem como 1 [item=angels-slag].\n8×[img=item/angels-ore4-crystal] Cristais de minério tornam-se 3 minérios primários, 1 minério secundário e 3 minérios terciários, bem como 1 [item=angels-slag].\n9×[img=item/angels-ore4-pure] Minério purificado tornam-se 3 minérios primários, 2 minérios secundários e 4 minérios terciários.\n\nVocê pode ver o que cada minério produzirá passando o mouse sobre o minério no chão.\nOs minérios primários e secundários estão listados abaixo:\n- [item=angels-ore1] e [item=angels-ore2]: Primário [item=iron-ore], Secundário [item=copper-ore]\n- [item=angels-ore3] e [item=angels-ore4]: Primário [item=copper-ore], Secundário [item=iron-ore]\n- [item=angels-ore6]: Primário [item=angels-tin-ore], Secundário [item=angels-quartz]\n- [item=angels-ore5]: Primário [item=angels-lead-ore], Secundário [item=angels-nickel-ore]
angels-watertype=Exemplos de fluidos do tipo água:\n[fluid=angels-water-saline] Água salina\n[fluid=angels-water-purified] Água purificada\n[fluid=angels-water-mineralized] Água mineralizada
angels-wastewaters=Exemplos de fluidos de águas residuais:\n[fluid=angels-water-yellow-waste] Água residual sulfúrica\n[fluid=angels-water-greenyellow-waste] Água residual fluórica\n[fluid=angels-water-green-waste] Água residual clórica\n[fluid=angels-water-red-waste] Água residual nítrica
angels-water-processing=Processe água do mar e águas residuais em água purificada e recupere sólidos úteis em uma [entity=angels-hydro-plant].
angels-water-processing-vanilla=\nConverta água em [fluid=angels-water-saline] útil para sais e [fluid=angels-water-purified] para suportar o processamento de minério, como a flotação.\nRecupere [item=sulfur] de [fluid=angels-water-yellow-waste] para reciclar de volta no processo.
angels-water-processing-overhaul=\nConverta água em [fluid=angels-water-saline] útil para sais e [fluid=angels-water-purified] para suportar o processamento de minério, como a flotação.\n\n
angels-water-processing-voiding=\nVocê pode remover o excesso de [tooltip=water type fluids,tips-and-tricks-description.angels-watertype] e [tooltip=wastewaters,tips-and-tricks-description.angels-wastewaters] do jogo usando um [entity=angels-clarifier].\n\n[font=default-bold]NOTAS[/font]: Para obter uma lista completa de fluidos que podem ser clarificados, verifique o compartimento de entrada de fluido da receita no clarificador.\n

