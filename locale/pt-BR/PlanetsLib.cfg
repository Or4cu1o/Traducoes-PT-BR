[mod-setting-description]
PlanetsLib-warn-on-hidden-prerequisites=Alerta o jogador quando um jogo é carregado com pré-requisitos ocultos.
PlanetsLib-update-vanilla-recipe-productivity-techs=Adiciona todas as receitas relevantes às tecnologias de produtividade de receitas padrão, caso ainda não estejam adicionadas. Deve permanecer ativado durante o uso normal, mas pode causar problemas de compatibilidade com mods mais antigos.
PlanetsLib-unlink-hidden-prerequisites=Sempre que uma tecnologia é um pré-requisito, mas também está oculta, ela é removida como pré-requisito para que a tecnologia sucessora não seja bloqueada.
PlanetsLib-enhanced-tooltips=Adiciona novas dicas de ferramentas aos protótipos, expondo ao usuário informações anteriormente ocultas.
PlanetsLib-enable-entity-replacements=Ativa substituições de entidade não vinculadas a outra configuração de inicialização. Disponível para auxiliar na desinstalação como alternativa caso os criadores de mods não vinculem suas substituições de entidade a uma configuração.
PlanetsLib-disable-all-entity-replacements=Força a desativação de todas as substituições de entidade em todos os mods. Não deve ser necessário, a menos que um mod esteja severamente desconfigurado.
PlanetsLib-enable-runtime-rocket-silo-replacements=Se os planetas configurarem um multiplicador de sustentação de foguete ou multiplicador de peças de foguete, substituições de silo de foguete em tempo de execução serão aplicadas. Desative esta configuração para desativar este comportamento com segurança e reverter substituições feitas em salvamentos se um mod tiver usado este recurso de maneira insegura.

