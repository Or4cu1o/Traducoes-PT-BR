[tips-and-tricks-item-description]
bpsb-intro-introduction=Bem-vindo ao mod Blueprint Sandboxes!\nEle permite usar algumas funcionalidades do modo Editor e do modo divino, sem sair do jogo atual, dentro de ambientes parecidos com laboratórios.\n\nAs melhores formas de levar projetos para dentro e para fora dos seus sandboxes são copiar e colar e usar a sua biblioteca de projetos. Às vezes, você também pode "trazer" um projeto para dentro e para fora mantendo-o no cursor.\n\nPara entrar no seu primeiro sandbox, use o atalho __CONTROL__bpsb-toggle-gui-sb-toggle-shortcut__ ou clique no botão de alternância na sua barra de atalhos. Use o mesmo método novamente para sair dos sandboxes.
bpsb-intro-isolation=A configuração Nível de isolamento controla o quanto os sandboxes estão integrados ao seu jogo. Há vantagens e desvantagens importantes em cada opção. Para todos os detalhes, veja a página do mod.\n\nTotal é o padrão histórico e busca separar os sandboxes do resto do jogo o máximo possível. Isto exige scripts para readicionar algumas coisas úteis perdidas por essa abordagem. O uso de forças e controladores afeta fundamentalmente o que é e o que não é possível com esta configuração.\n\nNenhum é uma configuração mais recente, possibilitada pela visão remota da versão 2.0, e busca apenas impedir trapaças óbvias no sandbox que poderiam afetar o resto do jogo.\n\nEis as diferenças importantes entre as duas:\n\nSegurança:\n- Total: vários perigos\n- Nenhum: totalmente seguro\n\nSimplicidade:\n- Total: complexo\n- Nenhum: simples\n\nAcessibilidade:\n- Total: limitações\n- Nenhum: sempre\n\nVisibilidade:\n- Total: pessoal / força\n- Nenhum: força\n\nVisualização remota:\n- Total: não é possível\n- Nenhum: totalmente integrada\n\nTecnologias:\n- Total: parcialmente sincronizadas via Lua\n- Nenhum: sincronizadas\n\nPesquisa:\n- Total: desativada\n- Nenhum: desativada\n\nConfiguração "todas as tecnologias":\n- Total: pode ser usada\n- Nenhum: não pode ser usada\n\nAlertas:\n- Total: separados\n- Nenhum: sincronizados\n\nChat:\n- Total: encaminhado via Lua\n- Nenhum: sincronizado\n\nPersonagem:\n- Total: trocado para o modo divino\n- Nenhum: continua sendo o seu\n\nConquistas:\n- Total: podem ser acionadas\n- Nenhum: serão acionadas\n\nMarcos (mod Milestones):\n- Total: separados\n- Nenhum: sincronizados\n\nEstatísticas:\n- Total: separadas\n- Nenhum: incluídas nas globais\n\nGrupos de logística / trens:\n- Total: separados\n- Nenhum: sincronizados\n\nContêineres / carregadores infinitos:\n- Total: visíveis somente no sandbox\n- Nenhum: visíveis para todos os membros da força\n\nDesfazer / refazer:\n- Total: reinicia ao entrar/sair\n- Nenhum: funciona normalmente
bpsb-intro-multiple-sandboxes=Uma interface de sandbox aparece enquanto você está dentro de um sandbox, e a primeira coisa que você notará é que pode mudar em qual sandbox está:\n\nPessoal: este é um sandbox parecido com um laboratório, exclusivo para você.\nForça: este é outro sandbox parecido com um laboratório, compartilhado entre toda a sua força.\n\nSe você não estiver usando o isolamento total, também pode ver e acessar esses sandboxes pela visão remota — inclusive os dos membros da sua força.
bpsb-intro-reset-v2=A próxima coisa que você pode notar na interface do sandbox é um botão Reiniciar. O botão Reiniciar redefine completamente o sandbox atual em que você está, caso queira recomeçar. Tenha consideração pelos outros ao usá-lo dentro de um sandbox de toda a força!
bpsb-intro-surface-properties=Esta interface ajuda a configurar um sandbox específico. Por exemplo, você pode forçar certos horários do dia ou eletrificar o piso para dispensar a colocação de postes de energia.\n\nSe você está jogando Space Age ou alguns mods interessantes, pode notar que algumas entidades e receitas têm condições de superfície que precisam ser atendidas, senão não serão construídas nem poderão ser selecionadas. Esta interface permite escolher uma predefinição baseada em locais reais ou personalizar conforme necessário. Nos bastidores, essas predefinições podem conter variações ocultas, porém importantes, nas propriedades, então você provavelmente vai querer escolher a predefinição mais próxima antes de fazer qualquer alteração!
bpsb-intro-sandbox-force=Enquanto você está em um ambiente de sandbox usando o modo de isolamento total, você é de fato transferido para outra força que se assemelha muito à sua força original — e isto não se aplica ao modo sem isolamento. Como você tem permissões mais poderosas dentro dos sandboxes, isto permite que elas fiquem bem separadas das suas atividades normais.\n\nIsto também significa que você não "possui" mais todas as entidades do seu mundo real, como trens, plataformas ou torres. Infelizmente, isto faz com que você não receba mais alertas se elas forem danificadas ou destruídas. Planeje-se para isso garantindo que sua base esteja bem defendida, ou verifique com mais frequência para não encontrar um desastre à sua espera.\n\nDependendo das suas configurações de mod, esta força irá sincronizar a pesquisa que você desbloqueou ou já terá toda a pesquisa desbloqueada. No primeiro caso, o "progresso" de uma tecnologia individual não pode ser em tempo real, mas a fila de pesquisa é mantida sincronizada.\n\nComo esta força é baseada na sua própria força, se você mudar de força terá sandboxes de força diferentes, e seu sandbox pessoal pode exigir uma reinicialização (já que você não possui mais nada dentro dele).
bpsb-intro-new-recipes-v2=Enquanto você está em um ambiente de sandbox, você também tem acesso a algumas receitas e ferramentas novas para experimentar mais facilmente.\n\nPrimeiro, os carregadores ocultos do próprio Factorio são ativados, caso ainda não tenham sido ativados por outro mod. Para os mesmos fins de teste de carga, o acumulador, o baú e o cano infinitos também são ativados. Você pode usá-los como entradas e saídas abstratas para testar seus projetos.\n\nEm seguida, você tem um planejador de seleção de entidades, então com (__CONTROL__select-for-blueprint__) você pode gerar aquelas coisas interessantes no sandbox; usando o método de seleção alternativo (__CONTROL__reverse-select__), você pode removê-las!\n\nHá um planejador de seleção de pisos mais simples para mudar os pisos subjacentes (ou __CONTROL__reverse-select__ para revertê-los aos pisos de laboratório).\n\nPor fim, dentro dos sandboxes você pode fabricar itens imediatamente e diretamente no cursor; em vez de fabricar para o inventário e depois selecionar o resultado, tudo o que você clicar para fabricar fica pronto para uso! Isto também substitui o que estava no seu cursor antes, então você pode simplesmente __CONTROL__open-character-gui__, clicar em uma receita, __CONTROL__confirm-gui__, continuar projetando e repetir. Isto também é configurável por usuário.
bpsb-intro-god-mode=Ao entrar em um sandbox usando o modo sem isolamento, você estará visualizando o sandbox remotamente — e também pode acessá-lo clicando nele pela visão remota. Dentro desses sandboxes, a maioria das operações que seriam feitas por robôs é tratada automaticamente (via Lua), então isto costuma funcionar bem.\n\nSe você entrar usando o isolamento total, você é tratado como um deus e tem controle mais direto. Seu corpo fica onde você o deixou (cuidado com isso!) e você pode flutuar livremente aqui. Este inventário divino é persistente e separado do inventário normal do seu jogador. Isto nem sempre é possível, porque exige separar você do seu corpo e garantir que ele possa ser reconectado com segurança mais tarde.
bpsb-intro-auto-building=Além do modo divino, você também tem algumas capacidades do modo Editor! Normalmente, o modo divino colocaria entidades fantasma sem os itens no seu inventário, mas aqui os fantasmas são preenchidos automaticamente para você. Os planejadores de melhoria e de demolição também têm efeito imediato.\n\nComo isto não pode usar o modo Editor — e portanto precisa ocorrer em Lua — infelizmente é mais lento que as configurações de "construção imediata" do modo Editor. Além disso, para contornar possíveis erros relativos à ordem das operações, há algumas configurações relacionadas a esses comportamentos.\n\nCriar, destruir e melhorar podem acontecer de forma síncrona (no mesmo tick do evento) ou assíncrona (em um tick periódico agendado após o evento). Por padrão no Factorio anterior à versão 1.1.61, para lidar com um erro relativo à configuração Esteiras inteligentes, apenas a criação é definida como assíncrona.\n\nNas configurações do mod, definir o valor de "assíncrono por tick" para qualquer número acima de zero ativa este comportamento, controlando a quantidade tratada para cada sandbox individualmente. Quando desativado, o momento exato em que o evento é disparado é também quando a solicitação é tratada. Quando ativado, as solicitações são deixadas de lado e agendadas para serem tratadas em um tick futuro. A configuração então controla quantas dessas solicitações são tratadas a cada iteração; naturalmente, esta é uma configuração de desempenho: você se importa mais com taxa de processamento ou com latência?\n\nPor fim, a demolição manual também é tratada imediatamente por padrão. Isto é feito por um aumento absurdamente grande na velocidade de mineração do sandbox. Este aumento é ajustável nas configurações do mod.
bpsb-factorissimo-introduction=A compatibilidade com o Factorissimo é possível desde que você use o fork do notnotmelon, já que ele introduz algumas APIs que tornam a integração possível.\n\nNa maior parte, fábricas colocadas dentro de sandboxes ganham a funcionalidade extra fornecida por aquele sandbox. Por exemplo, o preenchimento automático de fantasmas e a fabricação rápida funcionam dentro das fábricas do Factorissimo. No entanto, há algumas limitações inevitáveis.\n\nComo as fábricas são armazenadas em uma superfície compartilhada, algumas funcionalidades que abrangem toda a superfície foram desativadas dentro delas. Você não pode ajustar o brilho dentro das fábricas e também não pode reiniciá-las. Além disso, a "persistência" do seu corpo invisível seria complexa demais de tratar, então você não pode sair do sandbox nem transferir-se para outro sandbox enquanto estiver dentro de uma fábrica dentro dele — você precisa sair da fábrica primeiro.

[messages]
universe-of-sandboxes-intro=Bem-vindo ao Universo dos Sandboxes! Todos os planetas terão pisos de laboratório, mas de resto mantêm todas as suas propriedades normais.\nUse o Editor para mudar fundamentalmente o terreno, se precisar. Sair do Editor troca para o modo divino, menos poderoso.\nSem um personagem, ao usar a visão remota para ver outra superfície e depois sair dela, o Factorio o colocará naquela superfície. Use isto para interagir de forma mais direta e sem as restrições de cobertura de radar. Para melhores resultados, defina o Nível de isolamento como Total nas configurações do mod.
blueprint-in-cursor-from-library=Havia um projeto no seu cursor, mas o Factorio o descreve incorretamente como inválido. Isto provavelmente ocorre porque ele está atualmente na biblioteca de projetos (um erro conhecido do Factorio).
character-lost=[img=utility/warning_icon] Infelizmente, seu personagem anterior foi completamente perdido, então você precisa recomeçar.
choose-first-associated-character=[img=utility/warning_icon] Você tem vários personagens associados, mas o sandbox não sabe exatamente qual você queria, então está escolhendo o primeiro que encontrar
god-inventory-almost-full=[img=utility/warning_icon] Seu inventário está quase cheio. Descarte alguns itens.
factorissimo-cannot-change-sandbox=[img=utility/warning_icon] Você está dentro de um prédio de fábrica, então não pode mudar de sandbox.
cannot-build-in-sandbox=[img=utility/warning_icon] Parte do que você tentou construir não pode ser construída dentro de um sandbox.
sandbox-force-changed-while-in-sandbox=Sua força mudou, então você foi removido de um sandbox no qual não tem mais permissão para estar.
sandbox-entrace-from-unsupported-controller=[img=utility/warning_icon] Você entrou em um sandbox de um jeito estranho, usando um controlador não suportado. Você está por conta própria.
sandbox-exiting-without-known-entrace=[img=utility/warning_icon] Você não deve ter entrado no sandbox da forma esperada, porque ele não sabe de onde você veio. O que acontecer a seguir pode ser inesperado.
sandbox-unsafe-to-close-remote-view=Você está usando uma visão remota que não pode ser fechada com segurança, então não pode entrar em um sandbox. Volte ao seu personagem primeiro.
sandbox-unsafe-to-replace-controller=Seu personagem/controlador atual não está estável, então você não pode entrar em um sandbox
sandbox-unsafe-to-replace-controller-watching-a-cutscene=assistindo a uma cena
sandbox-unsafe-to-replace-controller-using-a-jetpack=usando uma mochila a jato
sandbox-unsafe-to-replace-controller-using-the-editor=usando o editor
sandbox-unsafe-to-replace-controller-controller-stashed=o controlador primário está guardado
sandbox-unsafe-to-replace-controller-riding-a-rocket=viajando em um foguete
sandbox-unsafe-to-replace-controller-remote-view-while-not-physical=o controlador físico não é um personagem físico durante o uso da visão remota
sandbox-unsafe-to-replace-controller-remote-view-while-driving=dirigindo durante a visualização remota
sandbox-unsafe-to-replace-controller-riding-a-platform=viajando em uma plataforma
sandbox-unsafe-to-replace-controller-in-moving-vehicle=em um veículo em movimento
