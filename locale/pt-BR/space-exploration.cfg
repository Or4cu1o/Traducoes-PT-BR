[technology-description]
se-cargo-rocket-section-beryllium=A leveza do berílio pode ser usada para fazer seções de foguete de carga com menos recursos.
se-cryonite-lubricant=O lubrificante pode ser feito a partir de crionita para economizar petróleo.
se-heat-shielding-iridium=A resistência do irídio pode ser usada para criar blindagem térmica usando muito menos recursos.
se-low-density-structure-beryllium=Estruturas leves de berílio podem substituir os componentes pesados das estruturas de baixa densidade.
se-pyroflux-smelting=A vulcanita pode ser usada para processar outros recursos com mais eficiência.
se-processing-water-ice=Usando as propriedades da crionita, a água pode ser transformada em um sólido mais denso, útil para transportá-la.
se-processing-methane-ice=Usando as propriedades da crionita, o gás metano pode ser transformado em uma versão mais densa de gelo, útil para transportá-lo.
se-processing-unit-holmium=A blindagem de sinal aprimorada dos cabos de hólmio pode ser usada para fabricar microprocessadores usando menos subcomponentes.
se-vulcanite-rocket-fuel=A energia contida no pyroflux é potente o suficiente para produzir combustível de foguete.
cargo-landing-pad=Permite entregar produtos de lançamento de foguetes e cápsulas de carga de foguete para uma plataforma de pouso nomeada. Com pesquisas adicionais, também pode recuperar peças de foguetes.
se-computer-science-pack=Permite a pesquisa de tecnologias relacionadas à ciência orientada a dados e máquinas espaciais especializadas.
se-fusion-reactor-equipment=Fornece energia para módulos de equipamento.
se-antimatter-reactor-equipment=Fornece energia para módulos de equipamento.
antimatter-reactor-equipment=Fornece energia para módulos de equipamento.
se-space-elevator=Pode levar fios e trens entre a superfície de um planeta ou lua e sua órbita. Veja Elevadores espaciais no [img=virtual-signal/informatron] Informatron para mais informações [__CONTROL__informatron__]
se-space-elevator-cable-nano=Usando nanomaterial, uma construção mais eficiente em termos de recursos do cabo de elevador espacial se torna possível.
se-space-simulation-dual=Simulação mais eficiente ao combinar duas disciplinas.
se-space-simulation-triple=Simulação ainda mais eficiente ao combinar três disciplinas.
se-space-simulation-quad=A simulação mais eficiente, combinando todas as disciplinas. Não pode ser realizada em supercomputadores padrão.
se-compact-beacon=10 compartimentos de módulos com 75% de eficiência de transmissão para uma potência máxima de módulo de 7,5. Transmite os efeitos dos módulos para entidades aliadas próximas dentro de 2 blocos. Múltiplos transmissores afetando a mesma entidade irão sobrecarregá-la e impedi-la de operar.
se-compact-beacon-2=10 compartimentos de módulos com 100% de eficiência de transmissão para uma potência máxima de módulo de 10. Transmite os efeitos dos módulos para entidades aliadas próximas dentro de 2 blocos. Múltiplos transmissores afetando a mesma entidade irão sobrecarregá-la e impedi-la de operar.
kr-singularity-beacon=10 compartimentos de módulos com 100% de eficiência de transmissão para uma potência máxima de módulo de 10. Transmite os efeitos dos módulos para entidades aliadas próximas dentro de 2 blocos. Múltiplos transmissores afetando a mesma entidade irão sobrecarregá-la e impedi-la de operar.
se-centrifuge=Processa várias receitas para enriquecimento ou refinamento de materiais.
steam-turbine=Gera eletricidade a partir de vapor em temperaturas mais altas, como de um trocador de calor (energia contínua) ou de uma caldeira elétrica (armazenamento de energia).
se-space-belt=Esteira de transporte rápida, adesiva e magnética, projetada para evitar que itens voem para o espaço.
se-space-pipe=Cano pressurizado e termicamente isolado que evita que fluidos como água congelem no vácuo frio do espaço. A capacidade de passar pelo subsolo é limitada, mas variantes longas de canos são ótimas para mover fluidos por longas distâncias.
se-pyroflux-smelting-beryllium=O processo metalúrgico de pyroflux com berílio é duas vezes mais eficiente, ou até mais graças a uma etapa adicional de produtividade.
se-pyroflux-smelting-holmium=O processo metalúrgico de pyroflux com hólmio é duas vezes mais eficiente, ou até mais graças a uma etapa adicional de produtividade.
se-space-capsule-navigation=Desbloqueia a capacidade de usar a cápsula para transporte pessoal. Seções de foguete podem ser adicionadas diretamente à cápsula espacial para lançar sem um silo de foguetes de carga. Útil para mover personagens, mas não para a carga deles.
industrial-furnace=Maior, mais rápido e com mais compartimentos de módulo. Pode usar receitas avançadas de fundição e metalurgia, mas não receitas de forno de queima.
se-kr-rare-metal-substrate=Os avanços na compreensão das necessidades dos nossos meios de armazenamento de dados levaram à ideia de um substrato base aprimorado que, embora exija metais de terras raras, é produzido de forma mais eficiente.
se-kr-efficient-fabrication=Com a necessidade de quantidades cada vez maiores de componentes eletrônicos em nossas cadeias de produção, adicionar lítio à sua produção permite menos desperdício dos materiais primários.
se-kr-fuel-refining=Expandir ainda mais exigirá um processamento melhor de combustíveis.
se-kr-nutrient-enrichment=O enriquecimento de nutrientes permite cadeias de produção mais eficientes.
kr-intergalactic-transceiver=Utilizando um microburaco negro, esta máquina permite comunicação instantânea com qualquer outro transceptor em qualquer lugar do universo.
se-kr-transceiver-trigger=Ativar o transceptor permitiu que você contatasse a galáxia mais ampla e se localizasse dentro dela. Agora, com sua própria espaçonave, você pode resgatar a si mesmo.
se-kr-catalysed-condensation=A crionita é usada para resfriar rapidamente a atmosfera disponível em uma forma líquida mais densa. No entanto, esse ganho na velocidade de resfriamento significa que impurezas indesejadas da atmosfera também estão presentes no líquido, o que necessita de purificação adicional antes da separação.
se-kr-catalysed-electrolysis=Descobriu-se que o irídio e seu óxido reduzem a energia necessária para eletrolisar a água, permitindo que um processo mais rápido e menos intensivo em energia seja usado para dividir a água em seus elementos constituintes.
epic-quality=Você pode conseguir saquear isso em algum lugar do seu sistema solar.
legendary-quality=Você pode conseguir saquear isso em algum lugar distante no espaço profundo.
se-always-researched=Esta tecnologia oculta tem efeitos que não nos preocupamos em mostrar.

