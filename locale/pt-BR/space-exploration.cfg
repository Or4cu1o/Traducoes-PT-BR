se-core-seam=Pode ser minerado com um [img=entity/se-core-miner-drill] Minerador de núcleo para obter __1__ __2__. A fissura do veio pode ser temporariamente selada com [img=item/cliff-explosives] Explosivos de penhasco ou uma [img=item/grenade] Granada para poder construir sobre ela.
se-core-seam-sealed=Este veio foi selado e é possível construir sobre ele. Pode ser reaberto com um [img=entity/se-core-miner-drill] Minerador de núcleo para obter __1__ __2__.
