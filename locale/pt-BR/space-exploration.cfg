[string-mod-setting-description]
se-lifesupport-hud-visibility-option-1=Sempre mostrar o HUD.
se-lifesupport-hud-visibility-option-2=Só mostrar o HUD ao carregar equipamento de suporte de vida ou ao precisar de suporte de vida.
se-lifesupport-hud-visibility-option-3=Só mostrar o HUD ao precisar de suporte de vida.
se-lifesupport-hud-visibility-option-4=Nunca mostrar o HUD.
se-print-meteor-info-always=Sempre mostrar alertas de meteoros.
se-print-meteor-info-current-zone-only=Só mostrar alertas de meteoros que caírem na zona que você estiver observando. Se a zona for um planeta ou lua, alertas tanto da superfície principal quanto da superfície da órbita serão mostrados.
se-print-meteor-info-breakthrough-only=Só mostrar alertas de meteoros que estavam no alcance das suas defesas, mas não foram totalmente abatidos. Isso pode ocorrer por tiros errados ou por defesas sem munição ou energia.
se-print-meteor-info-breakthrough-and-current-zone-only=Só mostrar alertas de meteoros que estavam no alcance das suas defesas, mas não foram totalmente abatidos, e apenas na zona que você estiver observando.
se-print-meteor-info-never=Nunca mostrar alertas de meteoros.

