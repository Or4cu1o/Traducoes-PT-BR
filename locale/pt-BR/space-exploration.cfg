page_spaceships_text_2=Seu limite de estresse de integridade atual é [color=cyan]__1__[/color].\nAtualmente você tem [color=cyan]__2__[/color] espaçonaves.\nA velocidade máxima que uma espaçonave atingiu é de [color=cyan]__3__[/color] (inclui apenas espaçonaves atualmente existentes).
page_spaceships_construction_text_1=[font=heading-2][color=#ffe6c0]Visão geral[/color][/font]\nAs espaçonaves são feitas de muitos blocos e componentes menores que se encaixam para formar uma espaçonave com o seu próprio projeto. Você projeta uma espaçonave quase como uma minibase móvel.\n\nComece com uma planta baixa de piso de espaçonave. Não construa nada muito grande, pois suas primeiras espaçonaves terão restrições rígidas de tamanho, expansíveis por meio de pesquisas. Coloque paredes de espaçonave ao redor das bordas para criar anteparas e certifique-se de que não haja aberturas (incluindo diagonais). Coloque um console de espaçonave em algum lugar na parte interna; esta é a parte central da espaçonave e como você a controla. Quando o console é posicionado, ocorrem algumas pulsações enquanto o console identifica quais partes estão devidamente conectadas, quais partes estão devidamente contidas e o que vai se soltar se você tentar decolar. Se algum quadrado piscar em vermelho, há um problema com o seu projeto, que você pode diagnosticar verificando o console de espaçonave. Você também precisa de um tanque propulsor de foguete de espaçonave e de um motor de foguete de espaçonave. O tanque propulsor é o que armazena o combustível necessário para chegar ao espaço e fornece o componente VTOL. Os motores de foguete servem para a queima mais lenta pelo espaço para levar você ao seu destino. Alguma forma de defesa na frente (sempre ao norte) também é recomendável, pois a nebulosa em que você se encontra está cheia de detritos.\n\n[font=heading-2][color=#ffe6c0]Tensão de integridade[/color][/font]\nNo início, você terá o tamanho da espaçonave bastante limitado pelos limites de tensão de integridade do seu nível tecnológico. Tecnologias adicionais permitem que você construa espaçonaves maiores. A tensão de integridade é calculada em 2 partes:\n\nParte A. Tensão do casco, baseada principalmente no tamanho e na forma da nave.\nParte B. Tensão de contêineres, baseada na capacidade de armazenamento de itens e fluidos da nave.\n\nA tensão de integridade total é o maior entre os dois fatores de tensão; os dois valores não são somados. Se a sua tensão estrutural for 250 e a sua tensão de contêineres for 280, a tensão de integridade será 280.\n\nA barra de tensão do casco mostra 3 valores. O primeiro é a tensão do casco atual com desconto, baseada em blocos vazios de espaçonave. Até 10% do tamanho de uma nave não conta para a tensão de integridade se forem blocos vazios de espaçonave. Esse espaço livre tem desconto no cálculo de tensão e é útil para corredores. O segundo valor é a tensão do casco sem desconto e é útil para estimar o valor de tensão da nave que você teria se preenchesse o interior com estruturas. O terceiro valor é a tensão máxima permitida pelo seu nível tecnológico.\n\nNaves excepcionalmente longas e estreitas, ou naves com seções muito finas no meio, são menos resistentes do que projetos mais arredondados. Naves largas são resistentes, mas precisam desobstruir mais asteroides.\n\nAlgumas estruturas têm efeitos especiais na integridade ou na velocidade da nave, como o Nexus.\n\n[font=heading-2][color=#ffe6c0]Aerodinâmica[/color][/font]\nEsta área do espaço fica em uma nebulosa densa em detritos. Se você der um formato aerodinâmico à sua espaçonave, poderá aumentar a velocidade máxima da sua espaçonave em cerca de 30%. Uma frente reta no formato de caixa deve ser evitada, mas não é necessário construir uma cunha. Até 1/3 da frente da sua espaçonave pode ser plana sem penalidade. Formatos circulares também funcionam bem. Você pode acionar manualmente uma verificação de integridade para ver como está a aerodinâmica.\n\n[font=heading-2][color=#ffe6c0]Velocidade[/color][/font]\nA velocidade da nave é baseada no empuxo dos motores versus o peso da nave (aproximado pela tensão de integridade). Os motores podem ser posicionados dentro ou sobre a nave, mas motores na parte traseira da nave com espaço vazio atrás são mais eficazes. Motores totalmente enclausurados têm 60% de eficácia. Motores na borda da nave também têm uma ligeira vantagem.\n\nVocê pode definir uma velocidade-alvo para a nave buscar. Se a nave ultrapassar a velocidade-alvo, ela começará a desativar motores para corresponder mais precisamente à velocidade-alvo e economizar combustível. Existem 3 opções de limite de velocidade, para que você possa reduzir ainda mais sua velocidade em áreas com muitos asteroides que, de outra forma, poderiam sobrecarregar suas defesas.\n\n[font=heading-2][color=#ffe6c0]Atividades de longa distância[/color][/font]\nAo considerar viagens de longa distância, vale ressaltar que você pode fazer muita coisa no modo satélite enquanto seu corpo está em trânsito. Você também pode dar ordens a espaçonaves remotamente por meio do enlace de satélite.\n\n[font=heading-2][color=#ffe6c0]Máquinas de produção[/color][/font]\n[color=#ffaaaa]Aviso: Uma máquina de produção projetada para o espaço só poderá usar receitas compartilhadas por outras estruturas terrestres se a espaçonave estiver em terra firme. Se uma receita espacial estiver definida quando a espaçonave pousar, os ingredientes serão perdidos. Algumas máquinas de produção terrestres podem funcionar no espaço, mas perderão a capacidade de usar módulos de produtividade enquanto estiverem no espaço. Se a espaçonave decolar com módulos de produtividade nessas máquinas, os módulos de produtividade serão destruídos.[/color]\n\n[font=heading-2][color=#ffe6c0]Sinais de espaçonave[/color][/font]\nA seção superior direita do console de espaçonave pode ser conectada com fios separadamente da estrutura principal, pois ela emite seus próprios sinais:\n[img=item/se-spaceship-console] O número do console indica o ID da espaçonave.\n[img=virtual-signal/signal-speed] O número do sinal de velocidade indica a velocidade da espaçonave: -1 se parada, -2 se ancorada.\n[img=virtual-signal/signal-distance] O sinal de distância indica a distância até o destino selecionado: -1 se chegou, -2 se ancorada, -3 se nenhum destino estiver definido.\n[img=virtual-signal/se-planet-orbit] Um quarto sinal indica o destino atual, se houver.\n[img=virtual-signal/signal-D] Certas partes do espaço têm mais ou menos asteroides que a sua nave encontrará. A densidade de asteroides onde a nave está posicionada no momento é indicada com o sinal D.\n[img=virtual-signal/signal-A] Se a espaçonave estiver ancorada, ela indica o ID da zona ancorada com o sinal A.\n\n[font=heading-2][color=#ffe6c0]Passagem de sinal de circuito[/color][/font]\nOs engates de espaçonave têm um ponto de conexão de energia e de rede de circuitos em seu canto superior. Quando os engates são conectados durante o pouso automático, a energia e os sinais da rede de circuitos são unidos, permitindo que a energia e os sinais de circuito passem entre a nave e o local de pouso.
page_spaceships_automation_text_1=Existem duas maneiras de automatizar uma espaçonave. Ela pode ser controlada de forma semelhante a um trem usando o agendador, ou pode ser controlada manualmente usando circuitos.
page_spaceships_automation_scheduler_text_1=[font=heading-2][color=#ffe6c0]Voar usando o agendador[/color][/font]\nO agendador de espaçonaves permite automatizar as espaçonaves de forma muito semelhante à automação de trens. Um cronograma pode consistir em múltiplos engates para os quais a espaçonave deve voar e sob quais condições ela tem permissão para partir para o próximo engate do cronograma. Os engates podem receber prioridades individuais e limites de espaçonaves. Interrupções podem ser definidas para direcionar uma espaçonave dinamicamente. O cronograma da espaçonave fica armazenado em seu grupo de cronogramas, e várias espaçonaves podem compartilhar o mesmo grupo de cronogramas.\n\n[font=heading-3][color=#ffe6c0]Engates[/color][/font]\nO engate pode ser visto como análogo à parada de trem. Um engate tem duas propriedades de identificação: sua direção (voltado para a esquerda ou para a direita) e seu nome (semelhante aos nomes de paradas de trem). O agendador ignora o ID do engate. Um destino de engate no agendador deve ter a direção e o nome corretos para ser considerado um destino válido.\n\nSe houver vários engates correspondentes para os quais uma espaçonave possa voar, ela escolherá aquele com a maior prioridade. Se vários engates tiverem a maior prioridade, a espaçonave escolherá a viagem que exigir o menor ∆v.\nVocê também pode definir um limite de espaçonaves por engate. Assim como nos trens e nos limites de trens, as espaçonaves reservam um engate ao iniciarem sua viagem. Se o engate já tiver espaçonaves suficientes a caminho (ou no engate) para atingir o limite, outras espaçonaves não poderão escolhê-lo e irão para o próximo destino válido ou aguardarão.\nO limite também pode ser definido por meio de circuitos com [img=virtual-signal/signal-L] e a prioridade com [img=virtual-signal/signal-P].\n\n[font=heading-3][color=#ffe6c0]Interrupções[/color][/font]\nUma interrupção pode criar um destino temporário (ou vários) no cronograma se determinadas condições forem atendidas. Todas as interrupções são verificadas uma vez em sequência quando todas as condições de espera do destino atual tiverem sido atendidas. Não é possível (atualmente) interromper uma interrupção.\n\n[font=heading-3][color=#ffe6c0]Redirecionamento (também conhecido como recalcular rota)[/color][/font]\nUma espaçonave nunca recalculará a rota no meio do voo devido ao risco de ficar sem combustível, com algumas exceções: se o engate de destino for destruído, ela redirecionará a espaçonave, possivelmente para uma zona diferente. Ao chegar à zona de destino e tentar pousar, a espaçonave moverá periodicamente sua reserva para outros engates com a mesma identificação e prioridade igual ou superior para um pouso mais rápido.\n\n[font=heading-3][color=#ffe6c0]Estilingue[/color][/font]\nUm destino pode ser definido como estilingue, o que significa que a espaçonave voará até próximo dessa zona e, em seguida, continuará para o próximo destino no cronograma. A espaçonave não pousará e, portanto, isso não requer nenhum engate existente nessa zona.
page_spaceships_automation_circuits_text_1=[font=heading-2][color=#ffe6c0]Voar usando circuitos[/color][/font]\nA estrutura principal do console pode aceitar entradas de sinais pelo lado esquerdo:\n[img=virtual-signal/signal-speed] O sinal de velocidade define uma velocidade-alvo e aciona os motores. Um sinal negativo, em vez disso, para os motores.\n[img=virtual-signal/se-spaceship-launch] Um sinal positivo de lançamento de espaçonave aciona a decolagem.\n[img=virtual-signal/se-planet-orbit] Um sinal de destino define o destino (você pode ver o sinal de uma zona no painel lateral do Explorador do Universo depois de construir uma espaçonave).\n\nNota: Tanto o tipo do sinal de destino (ex.: [img=virtual-signal/se-planet-orbit] ou [img=virtual-signal/se-asteroid-belt]) quanto o valor/ID do sinal devem coincidir para que o destino seja definido.\n\nNota: O console de espaçonave não aceitará entradas de decolagem [img=virtual-signal/se-spaceship-launch] ou velocidade [img=virtual-signal/signal-speed] até que um jogador tenha lançado e acionado a nave manualmente pelo menos uma vez. Isso serve para evitar que espaçonaves construídas a partir de diagramas decolem acidentalmente enquanto ainda estão sendo construídas por robôs.\n\nNota: O console só verifica alterações no sinal de entrada a cada segundo; um sinal contínuo é necessário para que a nave reaja, pulsos de um único tique não funcionarão.\n\n[font=heading-2][color=#ffe6c0]Pouso automático[/color][/font]\nPara fazer uma espaçonave pousar, o console deve receber um par de sinais de ancoragem, sendo:\n"ancorar usando engate esquerdo" ([img=virtual-signal/se-anchor-using-left-clamp]) com "ancorar no engate direito" ([img=virtual-signal/se-anchor-to-right-clamp])\n"ancorar usando engate direito" ([img=virtual-signal/se-anchor-using-right-clamp]) com "ancorar no engate esquerdo" ([img=virtual-signal/se-anchor-to-left-clamp])\n\nO valor do sinal "ancorar usando..." deve corresponder ao valor de um engate na nave.\nO valor do sinal "ancorar no..." deve corresponder ao valor de um engate no destino.\nVocê pode ver e alterar esses valores nos engates abrindo a interface de um engate. Se uma correspondência for encontrada para ambos os sinais "ancorar usando..." e "ancorar no..." enviados ao console da nave, a nave tentará pousar com os dois engates conectados. Use com cuidado.\n\nA espaçonave sempre preferirá o engate com a maior prioridade, que pode ser definida por circuito usando [img=virtual-signal/signal-P]. Os limites de espaçonaves são ignorados.\n\n[font=heading-2][color=#ffe6c0]Engates[/color][/font]\nPara definir o ID de um engate, abra a interface do engate e altere o valor numérico do sinal do engate para o ID que deseja que o engate tenha. Você nunca precisa alterar o tipo do sinal do engate.\n\nVocê pode desativar um engate ancorado enviando a ele um sinal vermelho.\n\n[font=heading-2][color=#ffe6c0]Exemplo de pouso[/color][/font]\nA espaçonave tem um engate esquerdo com ID 315. Na interface desse engate, o sinal é [img=virtual-signal/se-anchor-using-left-clamp] com um valor de 315.\nA superfície de pouso tem um engate direito com ID 147. Na interface desse engate, o sinal é [img=virtual-signal/se-anchor-using-right-clamp] com um valor de 147.\nPara fazer a espaçonave pousar usando esses dois engates, o lado esquerdo do console da nave deve receber os seguintes sinais:\n[img=virtual-signal/se-anchor-using-left-clamp] 315\n[img=virtual-signal/se-anchor-to-right-clamp] 147
