kr-fusion-reactor=Funde os átomos em uma [item=kr-dt-fuel-cell] Célula de combustível DT para produzir uma grande quantidade de energia. Um reator de fusão pode suportar 16 turbinas avançadas.
se-kr-advanced-condenser-turbine=75% da eficiência energética de uma turbina a vapor avançada, mas 99% do vapor utilizado é devolvido como água. Faixa de temperatura: 950 a 1625.
