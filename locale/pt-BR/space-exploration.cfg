[mod-setting-description]
se-print-meteor-info=Quando exibir alertas de meteoros. Alertas de meteoros aparecem tanto como um relatório no console de bate-papo quanto como um alerta no mapa.
se-never-show-train-gui=Após desbloquear elevadores espaciais ou espaçonaves, uma GUI de seleção de paradas é aberta sempre que você visualiza o cronograma de um trem para adicionar paradas de trem de zonas diferentes. Esta configuração impede que essa GUI apareça.
se-deep-space-belt-speed-2=As esteiras do espaço profundo devem ser as esteiras mais rápidas. Se você tiver outros mods que adicionam esteiras mais rápidas, você pode aumentar a velocidade da esteira do espaço profundo para igualar ou superar.
se-scan-max-range=Varredura de satélite: o alcance máximo (em blocos) que a varredura pode avançar a partir da origem da superfície antes de parar. Planetas nunca serão escaneados além do seu raio e o raio máximo de um planeta é de 10000 blocos. Valores maiores que 10000 blocos se aplicarão apenas a zonas espaciais.
se-core-seam-map-tags=Quando ativado, sempre que um veio de núcleo for descoberto, ele será automaticamente marcado no mapa com um marcador de mapa.
se-lifesupport-hud-visibility=Escolha quando manter o HUD de suporte de vida visível.
robot-attrition-factor=Um multiplicador na chance de queda de robôs.\nNota: No Space Exploration, este multiplicador afeta 100% da interferência de robôs do seu planeta natal e 50% da interferência de outras zonas.
se-add-icon-labels=Alguns ícones de receitas e itens podem ser difíceis de distinguir. Esta configuração adiciona números ou letras sobrepostos aos ícones para torná-los mais distintos. Por exemplo, estruturas de observação e níveis de catálogo.
se-delivery-cannon-artillery-timeout=As solicitações de artilharia do canhão de entrega de armas expiram após este número de segundos se não forem atendidas.
se-use-underground-collision-masks=Quando ativado, [entity=se-space-underground-belt] e [entity=se-space-pipe-to-ground] não podem atravessar o espaço vazio.
se-use-new-space-rail-graphics=Configuração temporária, só deve ser desativada ao jogar com Elevated Rails.
se-quality-mod-support=[font=default-bold]A compatibilidade com este mod ainda é experimental![/font]\nPor favor, evite críticas não construtivas quando houver alterações.
se-space-age-mod-support=[font=default-bold]A compatibilidade com este mod ainda é experimental![/font]\nPor favor, evite críticas não construtivas quando houver alterações.
kr-stack-size=Aumenta o tamanho da pilha de muitos itens do jogo base e do K2. (Padrão: sem alterações)

