menu_space_capsule=[img=item/se-space-capsule] Cápsula espacial
title_space_capsule=Cápsula espacial
page_space_capsule_text_1=A cápsula espacial é um pequeno foguete pessoal e sistema de navegação de foguetes. Ela pode ser colocada no chão para atuar como um pequeno foguete de transporte pessoal, ou usada para construir um foguete de carga, onde atua como o sistema de orientação e cápsula de fuga do foguete.\n\nA cápsula espacial tem seu próprio sistema de suporte de vida, portanto, se você estiver sufocando no espaço, poderá se abrigar em uma cápsula espacial.\n\nSe usada em um foguete de carga, a cápsula espacial não é perdida. Ela sempre sobreviverá à viagem, seja pousando no chão ou em uma plataforma de pouso.\n\n[font=heading-2][color=#ffe6c0]Transporte pessoal[/color][/font]\n[color=#f5cb48]A capacidade de usar uma cápsula espacial de forma autônoma é bloqueada pela tecnologia "Navegação de cápsula espacial".[/color] Depois de pesquisar essa tecnologia, a cápsula espacial poderá ser usada em quase qualquer lugar sem a necessidade de um silo de foguetes de carga.\n\nUma cápsula espacial autônoma pode ser usada para transportar o seu personagem, mas não é adequada para transportar carga. Embora você possa levar alguns itens essenciais, como recipientes de suporte de vida, a capacidade é extremamente limitada e quaisquer itens levados podem aumentar drasticamente os custos de combustível. Se você pretende usar uma cápsula espacial, deve estar preparado para despejar todo o seu inventário em um recipiente e levar apenas o necessário. Se você precisa de um transporte de itens com melhor custo-benefício, use um foguete de carga.\n\nLançamento planetário: uma cápsula espacial pode ser lançada de um planeta, mas precisa de ajuda para isso. Ela precisa usar algumas seções de foguete de carga para construir um primeiro estágio descartável que ajude a sair da atmosfera. As seções de foguete de carga devem ser colocadas no porta-malas da cápsula junto com o combustível de foguete necessário. As seções de foguete de carga utilizadas não podem ser recuperadas.\n\nViajando no espaço: você pode viajar entre zonas espaciais adjacentes, como da órbita do planeta para a órbita da lua mais próxima, entre órbitas lunares ou das órbitas lunares externas para um cinturão de asteroides. Embora você possa viajar no espaço interestelar, os destinos disponíveis não são confiáveis. Viajar da órbita para a superfície do planeta ou da lua abaixo é mais fácil e não possui limite de capacidade.\n\nReentrada: a cápsula espacial pode pousar em um planeta ou lua por um pequeno custo de combustível de foguete. Cuidado: o local de pouso é imprevisível, e você precisará de mais combustível e seções de foguete de carga para decolar novamente.\n\nQueima de emergência: a queima de emergência levará você para casa usando reservas de combustível de emergência. Nenhum combustível adicional é necessário. Será um pouso forçado que danificará a cápsula, resultando em uma [img=item/se-space-capsule-scorched] Cápsula espacial comprometida, que precisará ser recondicionada para funcionar novamente. Você pode perder até 50% de quaisquer itens levados no inventário do seu personagem nesta jornada (resultados sobreviventes arredondados para cima).
page_delivery_cannons_text_1=Canhões de entrega são canhões elétricos assistidos por explosão com alcance interplanetário. Eles são projetados para disparar recursos homogêneos resistentes que possam sobreviver à aceleração repentina. Eles não podem disparar intermediários manufaturados ou estruturas mais complexas.\n\nUm canhão de entrega tem apenas um ponto-alvo; ele não tem conhecimento do que está naquele ponto e disparará a carga útil desde que tenha energia e uma cápsula de entrega carregada. Se quiser adicionar condições à capacidade de disparo do canhão, você restringe a capacidade do canhão de carregar recursos ou cápsulas.\n\nQuando uma cápsula de entrega atinge o solo, ela causa danos à área e a maioria dos recursos é destruída. Um baú de canhão de entrega pode capturar a cápsula com segurança, desde que o baú não esteja cheio. Você pode ter vários canhões disparando no mesmo baú com recursos diferentes.\n\nÉ aconselhável manter os baús-alvo vazios ou restringir a alimentação do canhão usando transmissão de sinal.\n\nCanhões de entrega têm capacidade de 1GJ e consomem 50MW ao carregar. O alcance do canhão de entrega é limitado pela quantidade de energia que ele pode armazenar. Disparar para locais mais distantes consome mais energia. Alguns destinos podem exigir mais energia do que o canhão de entrega consegue armazenar, de modo que ele nunca disparará. Você pode configurar uma estação repetidora de canhão de entrega em um local a meio caminho para enviar a carga em 2 etapas.\n\n[img=item/se-delivery-cannon-weapon] [font=heading-2][color=#ffe6c0]Entrega de armas[/color][/font]\nCanhões de entrega de armas agem de forma semelhante aos seus equivalentes sem armas, mas disparam armas em vez de recursos como carga útil. Além do modo de disparo padrão disponível para o canhão de entrega, os canhões de entrega de armas também possuem os modos __1__ e __2__.\n\nModo __1__: o canhão de entrega de armas seleciona automaticamente um novo alvo a cada disparo. Desliga-se automaticamente quando não restam mais inimigos na zona-alvo. Vermes e ninhos têm prioridade sobre inimigos em movimento ao selecionar novos alvos. O modo de disparo automático não é tão preciso quanto a seleção manual de alvos — em [color=cyan]1%[/color] das vezes, ele errará o disparo e atingirá uma posição aleatória na zona-alvo.\n\nModo __2__: o canhão de entrega de armas fica em espera até que um jogador selecione um alvo para ele com um [img=item/se-delivery-cannon-artillery-targeter-se-iridium-piledriver] controle de mira. Quando qualquer alvo é selecionado, um canhão de entrega de armas com o tipo de munição correspondente e energia suficiente para disparar no local selecionado disparará no ponto escolhido e voltará ao modo de espera. Quando vários alvos são selecionados usando o controle de mira, eles entram em fila — à medida que os canhões de entrega de armas no modo __2__ ficarem disponíveis, eles dispararão contra os alvos na fila. Se um alvo selecionado com o [img=item/se-delivery-cannon-artillery-targeter-se-iridium-piledriver] controle de mira não for alvejado dentro de alguns minutos, ele expirará — se isso acontecer, construa mais canhões de entrega de armas ou use o modo __1__.
menu_space_elevators=[img=item/se-space-elevator] Elevadores espaciais
title_space_elevators=Elevadores espaciais
page_space_elevators_text_1=Elevadores espaciais conectam a superfície de um planeta ou lua à sua órbita. A estrutura fornece uma conexão direta de energia e sinais. Os trens podem entrar no elevador para serem transportados para a outra superfície. Os elevadores espaciais são ideais para rotas de alto tráfego onde há uma constante necessidade de troca de itens, mas não são eficientes se os itens forem movimentados apenas ocasionalmente. Foguetes e canhões de entrega têm um custo relativamente alto por pilha transportada, enquanto elevadores espaciais têm um custo baixo por pilha transportada, mas um custo contínuo de manutenção.\n\n[font=heading-2][color=#ffe6c0]Posicionamento[/color][/font]\nA estrutura do elevador espacial deve ser posicionada alinhando-se à grade de trilhos 2x2. Quando um elevador espacial é posicionado, um canteiro de obras aparece na mesma coordenada em ambas as superfícies, solo e órbita. Se o espaço não estiver livre em ambas as superfícies, a construção será cancelada. Se isso acontecer, você pode clicar na marcação de GPS que aparece na mensagem de construção cancelada para ver a área ocupada na outra superfície.\n\n[font=heading-2][color=#ffe6c0]Construção[/color][/font]\nO elevador começa como 2 estruturas de ponto de ancoragem, mas a conexão entre elas, o cabo de sustentação, fica inacabada e necessita de mais materiais de construção. Os pontos de ancoragem atuam como canteiros de obras que exigem energia e [img=item/se-space-elevator-cable] Cabo de elevador espacial para construir o elevador espacial completo. O custo total do cabo de sustentação depende do raio do planeta ou lua. Você pode ver o estado da construção abrindo a entidade do elevador espacial. Ambas as extremidades podem contribuir para o processo de construção, mas ele pode ser concluído fornecendo materiais a apenas um dos lados.\n\n[font=heading-2][color=#ffe6c0]Manutenção[/color][/font]\nO elevador espacial precisa de conservação na forma de [img=item/se-space-elevator-cable] Cabo de elevador espacial adicional. A maior influência na manutenção é a passagem do tempo, mas cada material rodante que sobe ou desce pela estrutura também aumenta ligeiramente a necessidade de manutenção. Os custos de manutenção também são influenciados pelo tamanho do planeta; um poço de gravidade maior significa custos gerais mais altos. Você pode ver os custos de manutenção e transporte de vagões individuais passando o mouse sobre a barra de progresso de peças.\n\n[font=heading-2][color=#ffe6c0]Conexões de fios[/color][/font]\nO elevador atua como um poste de energia entre superfícies. Fios elétricos e de sinal conectados à seção intermediária da estrutura do elevador serão conectados diretamente à estrutura do lado oposto. Essa conexão requer que o cabo de sustentação esteja construído para transferir energia e sinais.\n\n[font=heading-2][color=#ffe6c0]Conexões de trem[/color][/font]\nO elevador espacial pode ser renomeado; isso altera os nomes internos das estações para ambas as extremidades do elevador, tendo cada uma um sufixo de seta indicando para cima ou para baixo. Os trens podem usar os elevadores automaticamente se a estação interna do elevador for definida como destino. Não é recomendado navegar manualmente um trem longo pelo elevador (porque o controle do jogador é desvinculado do trem quando você muda de superfície, então você precisa ficar pressionando para a frente para não ficar preso). Se um trem ficar preso, há uma opção nas configurações do elevador espacial para forçar o vagão para a frente, mas é necessário haver trilhos suficientes para o vagão avançar. Com essa opção ativada, você também deve garantir que a saída esteja sempre livre de outros trens, caso contrário, o trem empurrado para a frente abrirá caminho forçadamente contra outros trens e blocos de trilho.\n\n[font=heading-2][color=#ffe6c0]Energia[/color][/font]\nO elevador espacial possui uma reserva de energia, dividida entre os dois pontos de ancoragem. A energia é consumida dessa reserva para impulsionar um trem até a órbita, e enviar um trem para baixo a partir da órbita carregará a reserva. A estrutura não moverá um novo trem a menos que haja uma quantidade mínima de energia na reserva. Você pode ver quanta energia custará enviar um material rodante pelo elevador passando o mouse sobre a barra de progresso de energia.
