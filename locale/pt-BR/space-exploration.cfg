[tips-and-tricks-item-description]
kr-faq=[font=default-bold]Eu olho para a mancha de petróleo e ela mostra X, e quando olho para a produção esperada, vejo um número diferente. Por quê?[/font]\n     Quando você olha para uma mancha, você vê o número de ciclos de produção. Em um ciclo, 20 unidades de petróleo são produzidas. Consequentemente, quando você vê a produção esperada, este é o número de ciclos * 20.\n\n[font=default-bold]Como posso coletar gosma?[/font]\n     O [technology=military-science-pack] fornecerá acesso ao [item=kr-creep-collector], que é uma maneira rápida e fácil de coletar gosma. Você também pode coletar gosma manualmente, mas isso leva muito tempo!\n\n[font=default-bold]Onde posso obter [item=space-research-data]?[/font]\n     Em vez de lançar um foguete com um [item=satellite] como carga útil, você precisará produzir isso no espaço.\n\n[font=default-bold]Não gosto de radiação. Posso desativar o dano por radiação?[/font]\n     Veja a página de [font=default-bold]Comandos[/font].

