[mod-name]
combat-mechanics-overhaul=Revisão das mecânicas de combate

[mod-description]
combat-mechanics-overhaul=Revisa certas mecânicas de combate e configurações de colisão. Muros bloqueiam a maioria dos projéteis inimigos que passariam por cima deles, como os de cuspidores e os cartuchos de espingarda inimigos. Seus projéteis ainda passam por cima dos seus próprios muros sem problemas. Veículos de unidades voadoras podem voar sobre muros, mas ainda podem ser atingidos por projéteis. Unidades e estruturas recebem as marcações apropriadas de biológico/mecânico e voador/terrestre/estático para serem afetadas por ou imunes a certos efeitos. Tem várias opções de mod, incluindo, por exemplo, unidades voadoras e veículos não serem afetados por poças de ácido no chão. Também fornece utilidades de colisão para outros mods.

[mod-setting-name]
spitter-spit-blockable=Cuspe de cuspidor bloqueável
worm-spit-blockable=Cuspe de verme bloqueável
rockets-blockable=Foguetes bloqueáveis
pools-affect-structures=Poças afetam estruturas
pools-affect-flying=Poças afetam voadores
shotguns-hit-friendly=Espingardas atingem aliados
unit-speed=Velocidade das unidades %
unit-health=Vida das unidades %
unit-range=Alcance das unidades %
worm-health=Vida dos vermes %
worm-range=Alcance dos vermes %
spawner-health=Vida dos geradores %

[mod-setting-description]
spitter-spit-blockable=O cuspe dos cuspidores pode ser bloqueado por muros. Torna o cuspe dos cuspidores em projéteis bloqueáveis. Se desativado, o cuspe dos cuspidores é um jato que faz um arco por cima dos muros.
worm-spit-blockable=O cuspe dos vermes pode ser bloqueado por muros. Torna o cuspe dos vermes em projéteis bloqueáveis. Se desativado, o cuspe dos vermes é um jato que faz um arco por cima dos muros.
rockets-blockable=Foguetes podem colidir com árvores e muros inimigos. Bom para PvP.
pools-affect-structures=Poças, como as poças de ácido dos vermes, afetam estruturas.
pools-affect-flying=Poças, como as poças de ácido dos vermes, afetam unidades voadoras (vapores corrosivos).
shotguns-hit-friendly=Se ativado, os projéteis de espingarda podem atingir estruturas aliadas, como baús de madeira.
unit-speed=Velocidade de mordedores e cuspidores, 100 significa sem alteração.
unit-health=Vida de mordedores e cuspidores, 100 significa sem alteração.
unit-range=Alcance dos cuspidores, 100 significa sem alteração.
worm-health=Vida dos vermes, 100 significa sem alteração.
worm-range=Alcance dos vermes, 100 significa sem alteração.
spawner-health=Vida dos geradores de mordedores e de cuspidores, 100 significa sem alteração.
