[valves]
valve-shortcuts=\n\n[font=default-bold]Atalhos (configuráveis):[/font]\n__CONTROL__valves-threshold-plus__ Aumentar limiar\n__CONTROL__valves-threshold-minus__ Diminuir limiar
threshold-settings=\n[color=0.5,0.8,0.94]Os limiares padrão podem ser definidos nas configurações de inicialização.[/color]
more-in-factoriopedia=Mais informações na Factoriopedia.
configuration-doesnt-support-thresholds=A válvula unidirecional não suporta limiares
flying-warning-bad-connection=Não é possível ligar a saída da válvula à entrada da bomba
factoriopedia-bad-connections=\n\n[font=default-bold]Limitação ao ligar a bombas:[/font]\nA saída de uma válvula não pode ser ligada à entrada de uma bomba. Por uma limitação do motor do jogo, a bomba ignora a válvula. Você pode verificar ligações incorretas a qualquer momento com o comando [color=0.5,0.8,0.94]/valves-find-bad-connections[/color].
warn-command-help=Encontra e imprime todas as válvulas com a saída ligada à entrada de uma bomba. Essa configuração não é suportada. Para mais informações, veja a Factoriopedia ou a página do mod.
warn-all-found-none=Nenhuma ligação de válvula incorreta encontrada.
warn-all-found=__1__ ligação(ões) incorreta(s) encontrada(s):
warn-found-at=__1__ em __2__
warn-all-found-extended=[color=red]Aviso![/color] Detectada(s) __1__ ligação(ões) de válvula incorreta(s) com bomba(s). Veja a Factoriopedia ou a página do mod para mais informações.
warn-show-again=Verifique ligações de válvula incorretas a qualquer momento com: /valves-find-bad-connections

[controls]
valves-threshold-plus=Aumentar limiar da válvula
valves-threshold-minus=Diminuir limiar da válvula

[controls-description]
valves-threshold-plus=Ajusta o limiar usado pelas válvulas de transbordamento ou reabastecimento.
valves-threshold-minus=Ajusta o limiar usado pelas válvulas de transbordamento ou reabastecimento.

[mod-setting-name]
valves-default-threshold-top_up=Limiar padrão da válvula de reabastecimento
valves-default-threshold-overflow=Limiar padrão da válvula de transbordamento

[mod-setting-description]
valves-default-threshold-top_up=O limiar padrão ao posicionar uma nova válvula. Pode ser ajustado depois do posicionamento.
valves-default-threshold-overflow=O limiar padrão ao posicionar uma nova válvula. Pode ser ajustado depois do posicionamento.
