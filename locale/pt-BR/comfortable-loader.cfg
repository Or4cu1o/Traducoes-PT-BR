[mod-setting-description]
comfortable-loader-snap-to-belts=Os carregadores definirão automaticamente seu modo e rotação para corresponder às esteiras adjacentes (e inventários no lado da esteira) quando colocados
comfortable-loader-snap-to-inventories=Os carregadores serão inseridos automaticamente nos inventários para os quais estão voltados ou afastados quando colocados
comfortable-strict-fast-replace-loaders=Impedir que os carregadores substituam rapidamente qualquer coisa que não sejam outros carregadores
