[mod-name]
title=Sombras Aprimoradas

[mod-description]
description=Substitui ativos comumente usados contendo sombras incorporadas por variantes separadas por sombras.

[mod-setting-name]
enhanced-shadows-separate-shadows=Sombras divididas de sprites
enhanced-shadows-change-planet-shadow-opacity=Alterar opacidades de sombra de outros planetas

[mod-setting-description]
enhanced-shadows-separate-shadows=Substitui certos sprites vanilla sem uma camada de sombra separada (por exemplo, canos) por sprites multicamadas contendo uma camada de primeiro plano e uma camada de sombra. Melhora a aparência das sombras aprimoradas, mas pode apresentar problemas de compatibilidade.
enhanced-shadows-change-planet-shadow-opacity=Altera as opacidades das sombras em outros planetas para refletir melhor os níveis de difusão da luz atmosférica que suas pressões indicariam.
