[mod-setting-description]
map-gen-scale=Fator de escala do mapa; qualquer escala positiva é permitida. (padrão: 6, mínimo: 0,01)
spawn-position=Selecione sua posição de surgimento ou deixe em branco para definir as posições x e y você mesmo.\n\nAviso: surgimentos em ilhas (por exemplo, Reino Unido, Japão, Madagascar) podem não ter rochas suficientes para ligar ao continente. Ajuste as taxas de recursos ou jogue com um fator de escala maior, 10 ou mais.
spawn-x=Coordenada x de surgimento. Não surja na água! (padrão: Flandres, Bélgica)
spawn-y=Coordenada y de surgimento. Não surja na água! (padrão: Flandres, Bélgica)
use-large-map=Se deve usar os dados de mapa mais detalhados. Isso usa mais memória e o jogo demora mais para carregar. Também amplia o mapa em 2 vezes em relação aos dados normais. (padrão: falso)
safe-zone-size=Tamanho da zona segura na qual a água é transformada em areia para você não morrer na hora ao surgir sobre a água. (padrão: 5)
repeat-map=Repete o mapa, criando infinitas cópias da Terra. Se desativado, tudo além disso é água.
only-apply-to-earth=A geração da Terra será aplicada apenas ao planeta ou superfície chamada "earth". Não substitui mais o relevo de Nauvis.\n\nSe o planeta Terra estiver ausente no Space Age, esta opção também cria o planeta Terra.

[space-location-name]
earth=Terra

[space-location-description]
earth=Planeta natal do engenheiro solitário.

[technology-name]
planet-discovery-earth=Descoberta do Planeta Terra
