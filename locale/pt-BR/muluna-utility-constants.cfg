[mod-name]
muluna-utility-constants=Constantes de utilidade de Muluna

[mod-description]
muluna-utility-constants=Modifica certas constantes de utilidade essenciais ao motor do Factorio para melhor acomodar o uso de receitas de alta vazão pelo Muluna. Pode causar efeitos indesejados, portanto, todos os valores afetados são configuráveis.

[mod-setting-name]
utility-constant-max-fluid-flow-multiplier=Multiplicador de fluxo máximo de fluido

[mod-setting-description]
utility-constant-max-fluid-flow-multiplier=Ajusta a vazão máxima de fluidos das máquinas em relação ao padrão vanilla de 100/tick. Reduza esse valor se tiver problemas com distribuição desigual de fluidos.
