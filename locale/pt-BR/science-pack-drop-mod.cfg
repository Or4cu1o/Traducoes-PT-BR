[mod-setting-description]
drop-chance-automation-science-pack=Chance de o pacote de ciência de automação cair de inimigos mortos.
drop-chance-logistic-science-pack=Chance de o pacote de ciência logística cair de inimigos mortos.
drop-chance-military-science-pack=Chance de o pacote de ciência militar cair de inimigos mortos.
drop-chance-chemical-science-pack=Chance de o pacote de ciência química cair de inimigos mortos.
drop-chance-production-science-pack=Chance de o pacote de ciência de produção cair de inimigos mortos.
drop-chance-utility-science-pack=Chance de o pacote de ciência utilitários cair de inimigos mortos.
drop-chance-space-science-pack=Chance de o pacote de ciência espacial cair de inimigos mortos.
drop-chance-metallurgic-science-pack=Chance de o pacote de ciência metalurgia cair de inimigos mortos.
drop-chance-electromagnetic-science-pack=Chance de o pacote de ciência eletromagnetismo cair de inimigos mortos.
drop-chance-agricultural-science-pack=Chance de o pacote de ciência agricultura cair de inimigos mortos.
drop-chance-cryogenic-science-pack=Chance de o pacote de ciência criogenia cair de inimigos mortos.
drop-chance-promethium-science-pack=Chance de o pacote de ciência de promécio cair de inimigos mortos.
enable-hp-multiplier=Se habilitado, a quantidade de pacotes científicos descartados será multiplicada pela saúde máxima do inimigo dividida pelo divisor multiplicador de HP.
hp-multiplier-base-divisor=O multiplicador usado para o multiplicador de queda baseado em HP. Valores mais altos resultam em multiplicadores maiores. Exemplo: se definido como 2, um inimigo com 200 HP fornecerá um multiplicador x2.
enable-science-pack-drops=Se desativado, os inimigos não derrubarão nenhum pacote científico.
