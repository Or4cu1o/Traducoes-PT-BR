[mod-setting-description]
drop-chance-automation-science-pack=Chance de o pacote científico de automação cair de inimigos mortos.
drop-chance-logistic-science-pack=Chance de o pacote científico de logística cair de inimigos mortos.
drop-chance-military-science-pack=Chance de o pacote científico militar cair de inimigos mortos.
drop-chance-chemical-science-pack=Chance de o pacote científico de química cair de inimigos mortos.
drop-chance-production-science-pack=Chance de o pacote científico de produção cair de inimigos mortos.
drop-chance-utility-science-pack=Chance de o pacote científico de utilitários cair de inimigos mortos.
drop-chance-space-science-pack=Chance de o pacote científico espacial cair de inimigos mortos.
drop-chance-metallurgic-science-pack=Chance de o pacote científico de metalurgia cair de inimigos mortos.
drop-chance-electromagnetic-science-pack=Chance de o pacote científico de eletromagnetismo cair de inimigos mortos.
drop-chance-agricultural-science-pack=Chance de o pacote científico de agricultura cair de inimigos mortos.
drop-chance-cryogenic-science-pack=Chance de o pacote científico de criogenia cair de inimigos mortos.
drop-chance-promethium-science-pack=Chance de o pacote científico de Prometheus cair de inimigos mortos.
enable-hp-multiplier=Se habilitado, a quantidade de pacotes científicos descartados será multiplicada pela saúde máxima do inimigo dividida pelo divisor multiplicador de HP.
hp-multiplier-base-divisor=O multiplicador usado para o multiplicador de drop baseado em HP. Valores mais altos resultam em multiplicadores maiores. Exemplo: se definido como 2, um inimigo com 200 HP fornecerá um multiplicador x2.
enable-science-pack-drops=Se desativado, os inimigos não soltaram nenhum pacote científico.
