[mod-setting-description]
hps__lse-debug-mode=Ativa as informações de depuração.
hps__lse-use_elevator_clearance=Trens que saem de um elevador e vão diretamente para um destino com limite de trens restante de 1 vão engasgar e produzir a mensagem "[color=purple]Destino cheio[/color]". Para evitar isso, o trem pode ir primeiro para uma estação de liberação.\nEssa estação [color=cyan]não pode ter limite de trens[/color] e precisa estar a pelo menos [color=cyan]um comprimento de trem inteiro de distância[/color] do ponto de saída dentro do elevador.\n\nEsta configuração adiciona essas estações a toda entrega da LTN que passa por um elevador. A configuração seguinte define o nome de todas essas estações.\n\nComo solicitantes e provedores da LTN raramente têm limites de trem do Factorio, ativar este recurso é útil principalmente com depósitos que têm limite de trens.

[string-mod-setting]
hps__lse-debug-mode-0=0: somente crítico
hps__lse-debug-mode-1=1: erros e avisos
hps__lse-debug-mode-2=2: mensagens
hps__lse-debug-mode-3=3: registro de depuração completo
