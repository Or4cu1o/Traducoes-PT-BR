[mod-setting-description]
rso-vanilla-biter-generation=Quando ativado, o RSO usará a geração de mordedores original. Pode ser usado junto com a geração do RSO.
rso-biter-generation=Controla o gerador de mordedores embutido do RSO. É mais esparso que o original para permitir a exploração de recursos.
rso-use-donuts=Ativar esta configuração adiciona a rosca como um formato possível para as jazidas de minério. Torna o layout das jazidas mais variado.
rso-starting-richness-mult=A riqueza de todas as jazidas de recursos iniciais será multiplicada por este valor. Substitui o multiplicador global para a área inicial.
rso-global-richness-mult=A riqueza de todas as jazidas de recursos será multiplicada por este valor.
rso-resource-chance=Chance de gerar um recurso por região (0,1 - 1; 1 significa sempre).
rso-region-size=Define o tamanho da região usada para a geração de recursos. É definido em blocos — valores maiores tornam os recursos mais esparsos.\nAlterar durante o jogo em andamento pode ter efeitos inesperados.
rso-enemy-chance=Chance de gerar inimigos na região (0,1 - 1; 1 significa sempre).
rso-enemy-base-size=O tamanho das bases inimigas será multiplicado por este valor (mais geradores e torres por base, bases maiores).
rso-global-size-mult=O tamanho das jazidas de recursos será multiplicado por este valor. Jazidas muito grandes podem ser cortadas durante a geração.
rso-remove-trees=Com esta configuração ativada, as árvores serão removidas ao posicionar jazidas de recursos.\nIsto pode não ser 100% eficaz — algumas árvores podem permanecer.
rso-infinite-ores-in-start-area=Integração com os minérios infinitos do Angel's — define se jazidas infinitas devem aparecer na área inicial.
rso-infinite-ore-threshold=Integração com os minérios infinitos do Angel's — limiar acima do qual o minério passa a ser infinito. O intervalo é de 0 a 1, com 0 tornando as jazidas inteiras infinitas e 1 deixando quase nenhuma parte infinita.
rso-reveal-spawned-resources=Quando ativado, cada jazida gerada será revelada no mapa para todas as forças. Deve evitar jazidas de minério parcialmente reveladas no minimapa.
rso-distance-exponent=Configuração avançada — pode quebrar o equilíbrio do jogo e/ou o jogo.\nExpoente usado para calcular o aumento da riqueza do minério com a distância do centro.
rso-fluid-distance-exponent=Configuração avançada — pode quebrar o equilíbrio do jogo e/ou o jogo.\nExpoente usado para calcular o aumento da riqueza do fluido com a distância do centro.
rso-size-exponent=Configuração avançada — pode quebrar o equilíbrio do jogo e/ou o jogo.\nExpoente usado para calcular o aumento do tamanho com a distância do centro.
rso-multi-resource-active=Quando ativado, recursos adicionais podem ser gerados junto à jazida de recurso primária sorteada. Depende da configuração e é usado pelo jogo original e por alguns mods grandes.
rso-oil-in-start-area=Quando verdadeiro, o petróleo estará presente na área inicial. Se falso, ele só será gerado fora dela.
rso-ore-in-start-area=Quando verdadeiro, os minérios estarão presentes na área inicial. Se falso, eles só serão gerados fora dela.
