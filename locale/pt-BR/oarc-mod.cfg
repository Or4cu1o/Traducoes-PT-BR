oarc-command-dude-wheres-my-cargo-pod=Isso tentará teletransportar quaisquer cápsulas de carga do centro do mapa até você, caso estejam na mesma força que você. Isso foi pensado como uma solução temporária até que eu encontre uma forma de enviar cápsulas de carga diretamente para um novo spawn.
