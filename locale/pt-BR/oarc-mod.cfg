[mod-description]
oarc-mod=Este é um mod multijogador que permite a cada jogador criar seu próprio ponto de spawn ao entrar no jogo. Há vários recursos úteis para garantir que novos jogadores possam entrar a qualquer momento no jogo ou até mesmo entrar nas áreas de spawn de outros jogadores.\n\n[color=red][font=default-bold]Confira a página do GitHub e o Discord para mais informações e suporte.[/font][/color]\n\n[font=default-small]Isto costumava estar disponível como um cenário, mas agora é fornecido apenas como um mod. Para iniciar um novo jogo com este mod, basta usar o cenário padrão de jogo livre. O cenário incluído neste mod fornece apenas um modelo para substituir o cenário padrão de jogo livre. Ele também oferece uma maneira para anfitriões de servidor experientes definirem configurações a partir de um arquivo em vez das configurações habituais de mod. Leia o arquivo control.lua dentro do cenário para ver as observações.[/font]

