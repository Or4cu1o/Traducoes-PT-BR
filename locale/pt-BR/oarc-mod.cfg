[mod-setting-description]
oarc-mod-default-enable-secondary-spawns-on-other-surfaces=[color=red]SPAWNS SECUNDÁRIOS AINDA SÃO EXPERIMENTAIS!!![/color] Isso controla o comportamento padrão para se outros planetas/superfícies permitem spawns secundários. Se ativado, por padrão todas as outras superfícies gerarão spawns secundários quando os jogadores pousarem nelas. Spawns secundários significam que cada jogador que iniciar sua própria base terá seu próprio local de pouso nos outros planetas/superfícies. [color=red]Se você tiver outros mods instalados que adicionam superfícies adicionais, recomendo deixar isso desativado. Independentemente desta configuração, você pode configurar quais superfícies permitem spawn usando o menu de configurações do jogo.[/color]
oarc-mod-linked-chest-size=Este é o tamanho do baú compartilhado que os jogadores podem usar para compartilhar itens com outros jogadores. Isso só tem efeito se o recurso de baú compartilhado estiver ativado.
oarc-mod-welcome-msg-title=Este é o título da mensagem de boas-vindas que será exibida aos jogadores quando eles entrarem no jogo.
oarc-mod-welcome-msg=Esta é a mensagem de boas-vindas que será exibida aos jogadores quando eles entrarem no jogo e no painel de informações. [color=red]Deixe um único espaço para desativar.[/color]
oarc-mod-discord-invite=Coloque o convite do seu Discord aqui para que os jogadores possam copiá-lo facilmente do painel de informações do jogo. [color=red]Deixe um único espaço para desativar.[/color]
oarc-mod-enable-main-team=Permite que os jogadores entrem na equipe principal. Esta é a equipe padrão criada quando o jogo começa. Isso permite que os jogadores compartilhem o progresso da pesquisa.\n[color=red][font=default-bold]Você deve ativar uma ou ambas as opções de equipe principal e equipes separadas. Caso contrário, o padrão será permitir apenas a equipe principal.[/font][/color]
oarc-mod-enable-separate-teams=Permite que os jogadores iniciem suas próprias equipes (apenas cooperativo, sem PvP). Isso permite que os jogadores tenham seu próprio progresso de pesquisa.\n[color=red][font=default-bold]Você deve ativar uma ou ambas as opções de equipe principal e equipes separadas. Caso contrário, o padrão será permitir apenas a equipe principal.[/font][/color]
oarc-mod-allow-moats-around-spawns=Permite que os jogadores escolham spawns com um fosso ao redor deles.
oarc-mod-enable-moat-bridging=Se a área de spawn estiver cercada por terra, o fosso terá uma pequena ponte de terra conectando-a.
oarc-mod-minimum-distance-to-existing-chunks=Esta é a distância mínima em que um novo spawn será criado a partir de blocos existentes (mesmo que não visíveis).
oarc-mod-near-spawn-distance=A distância mínima em que um jogador pode escolher spawnar a partir da origem. Isso é usado como ponto de partida para o algoritmo de busca, portanto não é uma distância garantida.
oarc-mod-far-spawn-distance=A distância máxima em que um jogador pode escolher spawnar a partir da origem. Isso é usado como ponto de partida para o algoritmo de busca, portanto não é uma distância garantida.
oarc-mod-enable-buddy-spawn=Permite spawnar com um parceiro. 2 jogadores podem spawnar um ao lado do outro com suas próprias áreas iniciais.
oarc-mod-enable-offline-protection=Inibe ataques inimigos em bases onde todos os jogadores estão offline. Não é 100% garantido!
oarc-mod-enable-shared-team-vision=Garante que todas as equipes possam ver o mapa e a cobertura de radar umas das outras. Requer equipes amigáveis!
oarc-mod-enable-shared-team-chat=Todas as equipes podem ver as mensagens de chat umas das outras.
oarc-mod-enable-friendly-teams=Todas as equipes são amigáveis entre si. Amigos têm acesso irrestrito a estruturas e as torretas não atiram neles.
oarc-mod-enable-cease-fire=Todas as equipes estão em cessar-fogo. As torretas não atirarão em outras equipes.
oarc-mod-enable-shared-spawns=Permite que os jogadores compartilhem suas áreas de spawn para que outros jogadores possam entrar.
oarc-mod-number-of-players-per-shared-spawn=Número de jogadores que podem entrar em um spawn compartilhado, incluindo o jogador original.
oarc-mod-enable-friendly-fire=Ativa o fogo amigo. Assim você pode atirar em seus baús (ou atropelar seus amigos com um trem). Isso permite que você cause dano à sua PRÓPRIA equipe.
oarc-mod-main-force-name=O nome da força principal. Esta é a equipe padrão criada quando o jogo começa.
oarc-mod-default-surface=A superfície padrão em que os jogadores spawnarão se entrarem na equipe principal ou se o spawn em outras superfícies não estiver ativado.
oarc-mod-scale-resources-around-spawns=Escalona os recursos ao redor de cada área de spawn para que spawns distantes não fiquem imediatamente ao lado de jazidas muito ricas.
oarc-mod-modified-enemy-spawning=Altera e escalona o surgimento de inimigos de várias maneiras para garantir que cada área de spawn seja segura, independentemente do fator de evolução ou da distância do centro do mapa. É altamente recomendável deixar este recurso ativado, pois os jogadores provavelmente seriam dominados por inimigos imediatamente ao spawnar ou pousar em novos planetas.
oarc-mod-minimum-online-time=O tempo mínimo que um jogador deve ficar online antes de sair, caso contrário sua área de spawn será limpa.
oarc-mod-respawn-cooldown-min=O tempo mínimo que um jogador deve esperar antes de poder mudar seu ponto de ressurgimento para um novo local.
oarc-mod-enable-shared-power=Permite que os jogadores compartilhem sua rede elétrica com outros jogadores. Isso criará um poste elétrico especial no seu ponto de spawn que se conecta à rede de energia compartilhada sem fio.
oarc-mod-enable-shared-chest=Dá aos jogadores um baú especial que eles podem usar para compartilhar itens com outros jogadores. Ele usa o item "linked-chest", que é um recurso oculto no Factorio.
oarc-mod-enable-coin-shop=Ativa uma loja de moedas onde os jogadores podem comprar itens com as moedas que ganham ao matar mordedores.
oarc-mod-enable-regrowth=Ativa a rebrota. Isso remove lentamente os blocos inativos com o tempo. Qualquer bloco com estruturas de jogadores não será removido. Isso ajuda a manter o mapa (e o tamanho do arquivo) menor ao longo do tempo.
oarc-mod-enable-world-eater=Ativa o devorador de mundo. Requer a rebrota. Isso verifica lentamente todos os blocos quanto à ausência de estruturas e entidades de jogadores e os marca para remoção. Isso ajuda a manter o mapa (e o tamanho do arquivo) menor ao longo do tempo. Este é um recurso mais experimental, use por sua conta e risco.
oarc-mod-enable-abandoned-base-cleanup=Bases abandonadas serão limpas se os jogadores saírem pouco tempo após entrar. [color=red]Isso NÃO requer que a rebrota ou o devorador de mundo estejam ativados.[/color]
oarc-mod-regrowth-cleanup-interval-min=Este é o intervalo em minutos em que a limpeza da rebrota será executada. Sempre que ocorre uma limpeza do mapa, o jogo congela por um segundo, então você não vai querer executar isso com muita frequência! A limpeza de base abandonada acontece imediatamente quando um jogador sai e não é afetada por esta configuração.
oarc-mod-spawn-general-radius-tiles=Este é o raio da área de spawn em quadros. Não recomendo deixar muito menor do que 2 blocos (64) nem muito grande, a menos que você queira que os spawns demorem muito para gerar.
oarc-mod-spawn-general-moat-width-tiles=Esta é a largura do fosso ao redor da área de spawn em quadros, se um fosso estiver ativado e for selecionado no momento do spawn.
oarc-mod-spawn-general-tree-width-tiles=Esta é a largura do anel de árvores ao redor da área de spawn em quadros. Garante algumas árvores perto do spawn.
oarc-mod-spawn-general-enable-resources-circle-shape=Este é o formato das jazidas de recursos da área inicial.
oarc-mod-spawn-general-enable-force-tiles=Ativar isso preencherá toda a área de spawn com um quadro específico (grama em Nauvis). Caso contrário, aterro será usado conforme necessário para preencher quaisquer lacunas.
oarc-mod-spawn-general-shape=Este é o formato da área de spawn.
oarc-mod-resource-placement-enabled=Você deve deixar isso ativado, a menos que esteja especificando manualmente os posicionamentos de recursos no cenário personalizado!
oarc-mod-resource-placement-distance-to-edge=Esta é a distância da borda da área de spawn na qual os recursos serão posicionados. Aplicável apenas para spawns em formato de círculo/octógono.
oarc-mod-resource-placement-degrees-offset=Este é o deslocamento do ângulo inicial (em graus) para o posicionamento de recursos. Em qual ângulo (em graus) os recursos começam.  0 = leste. 90 = sul. Os recursos são posicionados no sentido horário a partir deste ângulo. Aplicável apenas para spawns em formato de círculo/octógono.
oarc-mod-resource-placement-degrees-final=Este é o deslocamento do ângulo final (em graus) para o posicionamento de recursos. Em qual ângulo (em graus) os recursos terminam. 0 = leste. 90 = sul. Os recursos são posicionados no sentido horário terminando neste ângulo. Aplicável apenas para spawns em formato de círculo/octógono.
oarc-mod-resource-placement-vertical-offset=Este é o deslocamento vertical (em quadros) para o posicionamento de recursos a partir do canto superior esquerdo do spawn. Aplicável apenas para spawns em formato quadrado.
oarc-mod-resource-placement-horizontal-offset=Este é o deslocamento horizontal (em quadros) para o posicionamento de recursos a partir do canto superior esquerdo do spawn. Aplicável apenas para spawns em formato quadrado.
oarc-mod-resource-placement-linear-spacing=Este é o espaçamento linear (em quadros) entre recursos. Aplicável apenas para spawns em formato quadrado.
oarc-mod-resource-placement-size-multiplier=Altera o tamanho das jazidas de recursos. As configurações padrão devem fornecer uma experiência inicial próxima ao vanilla.
oarc-mod-resource-placement-amount-multiplier=Altera a riqueza das jazidas de recursos. As configurações padrão devem fornecer uma experiência inicial próxima ao vanilla.

