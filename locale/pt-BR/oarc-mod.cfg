oarc-mod-faq-what-is-this-mod=O que é este mod?
oarc-mod-faq-what-is-this-mod-answer=Este mod reformula o spawn multijogador. Os jogadores podem criar seus próprios pontos de spawn longe do centro do mapa. Os jogadores também podem entrar nas bases de outros jogadores ou criar spawns com parceiro. O mod não altera a jogabilidade principal do Factorio, mas muda a forma como os jogadores iniciam o jogo. A área inicial é uma área predefinida com recursos, não um ponto de spawn "natural".
oarc-mod-faq-other-surfaces=Posso começar em uma superfície/planeta diferente?
oarc-mod-faq-other-surfaces-answer=[color=red]Eu recomendo iniciar apenas em [planet=nauvis] __PLANET__nauvis__ ou em uma superfície semelhante a __PLANET__nauvis__.[/color] A resposta curta é sim, mas você provavelmente não vai querer fazer isso. Não há uma maneira simples de garantir que você possa começar em outros planetas sem quebrar a progressão normal e a jogabilidade. Existem outros mods por aí, como o Any Planet Start, mas ainda não testei a compatibilidade.
oarc-mod-faq-secondary-spawns=O que são spawns secundários?
oarc-mod-faq-secondary-spawns-answer=Se ativado, quando um jogador viajar pela primeira vez para um novo planeta/superfície, receberá automaticamente uma área de pouso separada com base em sua escolha de spawn principal (o primeiro spawn criado). [color=red]Este recurso é atualmente um trabalho em andamento, mas adicionei suporte para os planetas do Space Age ([planet=fulgora] __PLANET__fulgora__, [planet=gleba] __PLANET__gleba__, [planet=vulcanus] __PLANET__vulcanus__ e [planet=aquilo] __PLANET__aquilo__).[/color] Existem alguns problemas conhecidos, como cápsulas de carga pousando no centro do mapa se você ainda não tiver uma plataforma de pouso configurada (use o comando /oarc-wheres-my-cargo-pod para recuperá-las). Além disso, Vulcanus ainda não oferece suporte de API para modificar demolidores ou territórios, então tenho um mecanismo de segurança rudimentar que remove demolidores próximos à sua área de spawn. Todos os planetas ainda devem ser jogáveis, mas não está perfeito. Por favor, relate problemas para mim no discord/github.
oarc-mod-faq-enemy-scaling=Como os inimigos são tratados?
oarc-mod-faq-enemy-scaling-answer=Boa pergunta! Meu mod tenta fornecer uma área inicial segura para qualquer jogador que entrar no jogo ou pousar em um novo planeta. A principal maneira de fazer isso é removendo a maioria dos inimigos ao redor das novas bases. Além disso, áreas próximas às bases dos jogadores apenas spawnarão as variantes mais fáceis de inimigos, independentemente da configuração global de evolução. Em [planet=nauvis] __PLANET__nauvis__, os vermes também são dimensionados para que você não fique cercado apenas por vermes colossais se optar por spawnar longe do centro do mapa. Em [planet=vulcanus] __PLANET__vulcanus__, como uma solução temporária até obtermos uma API adequada para modificar territórios, eu removo quaisquer demolidores que se aproximem da sua base. Esta é uma solução rudimentar, mas funciona por enquanto. Também dimensiono o dano causado aos geradores com base no fator de evolução e na distância até o ponto de spawn mais próximo. Isso ajuda a compensar o aumento da vida dos geradores em um fator de evolução alto. Para ajustar as distâncias, consulte a aba de configurações de superfície. Cada superfície tem suas próprias configurações para as áreas segura, de alerta e de perigo ao redor dos pontos de spawn.
oarc-mod-faq-what-are-teams=Quais são as diferentes opções de equipe?
oarc-mod-faq-what-are-teams-answer=Eu escrevi este mod apenas para jogo cooperativo, não PvP, mas você pode desativar o cessar-fogo e as equipes amigáveis nas configurações. Dependendo das configurações do mod, você pode entrar na equipe principal, que compartilha pesquisas, ou criar sua própria equipe, que tem sua própria árvore de pesquisa. Todas as equipes/forças são amigáveis entre si e podem se comunicar no chat e (opcionalmente) compartilhar a visão do mapa. A única razão para criar sua própria equipe é se você quiser ter seu próprio progresso de pesquisa.
oarc-mod-faq-shared-spawn=O que é um spawn compartilhado?
oarc-mod-faq-shared-spawn-answer=Os jogadores podem optar por permitir que outros jogadores entrem em sua base. Isso permite que novos jogadores spawnem na mesma área inicial do jogador anfitrião. O anfitrião pode controlar quem pode entrar em sua base.
oarc-mod-faq-buddy-spawn=O que é um spawn com parceiro?
oarc-mod-faq-buddy-spawn-answer=Se você e outro jogador estiverem no menu de spawn ao mesmo tempo, poderão solicitar um spawn com parceiro. Isso fará com que você e seu parceiro spawnem lado a lado no mapa, cada um com sua própria área inicial.
oarc-mod-faq-regrowth=O que são os recursos de rebrota e devorador de mundo?
oarc-mod-faq-regrowth-answer="Rebrota" ajuda a manter o tamanho do arquivo de salvamento reduzido, removendo blocos inativos do mapa ao longo do tempo. Isso é útil para servidores de longa duração com muitos jogadores. Nenhum bloco com atividade de jogadores será removido. "Devorador de mundo" verifica lentamente cada bloco para ver se há estruturas de jogadores nele. Esta é uma verificação adicional sobre o recurso de rebrota que identificará quaisquer blocos nos quais os jogadores construíram, mas depois removeram todas as estruturas.
oarc-mod-faq-cleanup-abandoned=O que é o recurso de limpeza de bases abandonadas?
oarc-mod-faq-cleanup-abandoned-answer=Isso remove a área de spawn se o jogador sair dentro do "tempo mínimo online" e também excluirá o personagem dele. Esse recurso é útil para manter o mapa limpo e o tamanho do arquivo de salvamento reduzido. Servidores públicos provavelmente vão querer ativar este recurso.
oarc-mod-faq-offline-protection=O que é o recurso de proteção offline?
oarc-mod-faq-offline-protection-answer=Se uma base tiver todos os jogadores offline, ela será protegida contra ataques inimigos. Isso não é 100% garantido, mas ajudará a evitar que a base seja destruída enquanto os jogadores estiverem offline.
oarc-mod-faq-shared-power=O que é o recurso de energia compartilhada?
oarc-mod-faq-shared-power-answer=Isso permite que os jogadores compartilhem sua rede de energia com outros jogadores. Ele criará um poste elétrico especial em seu ponto de spawn que se conecta à rede de energia compartilhada sem fio. Ele utiliza postes elétricos entre superfícies para fazer conexões "sem fio".
oarc-mod-faq-shared-chest=O que é o recurso de baú compartilhado?
oarc-mod-faq-shared-chest-answer=Isso dá aos jogadores um baú especial em sua área de spawn que eles podem usar para compartilhar itens com outros jogadores. Ele usa o item "baú vinculado" que é um recurso oculto no Factorio. Isso permite que os jogadores compartilhem itens com outros jogadores de forma segura.
oarc-surface-settings-info=Isso permite que você defina as configurações de superfície, estando disponível apenas para administradores. Essas configurações NÃO estão disponíveis na página de configurações do mod. Se você quiser defini-las automaticamente no início de um novo jogo usando um arquivo personalizado, confira o cenário modelo incluído na pasta do mod. Eu realmente questiono minha sanidade por me dar ao trabalho de fazer essa interface gráfica. Enviem ajuda.
oarc-surface-settings-warning=AVISO: Estas configurações NÃO são sanitizadas, você pode travar o jogo se escolher valores inválidos!
