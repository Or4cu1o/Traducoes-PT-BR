[string-mod-setting]
aps-planet-muluna=[planet=muluna] Muluna

[mod-setting-description]
override-space-connection=Modifica as conexões de Nauvis para Vulcanus, Gleba e Fulgora para que passem por Muluna. Obrigará todas as plataformas a caminho de Nauvis a redefinirem seus voos manualmente.
space-science-pack-output=Modifica a saída de ambas as receitas do pacote científico espacial.
enable-muluna-satellite-radar=Pode causar problemas de desempenho ou potencial de causar problemas quando habilitado em servidores multijogador.
muluna-hardcore-restrict-crusher=Restringe as receitas triturador e triturador 2 à Muluna e adiciona placas de alumínio à receita triturador.
muluna-hardcore-restrict-asteroid-collector=Restringe a receita do coletor de asteroides à Muluna e adiciona placas de alumínio à receita do coletor de asteroides.
muluna-change-quality-science-pack-drain=As taxas de drenagem do pacote científico de Muluna podem ser desabilitadas para manter a compatibilidade com outros mods.
muluna-hardcore-remove-steam-furnaces=Remove os edifícios "fornalha a vapor de pedra" e "fornalha a vapor de aço" do jogo. Aumenta o realismo, mas aumenta consideravelmente a dificuldade de começar em Muluna sem remessas externas.
muluna-hardcore-remove-starting-cargo-pods=Remove as cápsulas de carga iniciais de Muluna. Isso torna impossível iniciar uma base Muluna sem remessas externas.
muluna-easy-simple-wood-gasification=Duplica a produção de cada etapa da cadeia de gaseificação da madeira, ao mesmo tempo que proíbe módulos de produtividade.
muluna-hardcore-classic-wood-gasification=Na versão 2.0, a cadeia de criação de gaseificação de madeira de Muluna teve uma etapa (madeira triturada) removida do jogo. Esta opção restaura essa etapa.
muluna-easy-vanilla-rocket-part-costs=Por padrão, Muluna dobra o custo de todas as receitas de peças de foguete que não são usadas em Muluna, dobra o número máximo de módulos que um silo de foguete pode usar e adiciona dez novos níveis de tecnologias de produtividade de peças de foguete, disponíveis após desbloquear a ciência espacial. Esta opção reverte essas alterações.
muluna-easy-wood-gasification-productivity=Reduz a dificuldade de produção de derivados de petróleo em Muluna adicionando uma tecnologia que aumenta a produtividade da gaseificação de madeira. Recomendado para jogar com Muluna inicial.
muluna-graphics-enable-footstep-animations=Partículas de passos consomem cerca de 0,01 ms por jogador em Muluna por atualização. Em servidores grandes, isso pode causar problemas de desempenho.
muluna-easy-simple-nanofoamed-polymers=Simplifica a cadeia de fabricação de polímeros nanoespumados, fazendo com que a deterioração do plástico difundido comece durante a fabricação, e não no início da fabricação.
muluna-easy-revert-changes-to-space-platform-technology=Também reverte as alterações na tecnologia do propulsor da plataforma espacial para tornar as receitas padrão de combustível/oxidante do propulsor disponíveis antes de chegar a Muluna.
muluna-interstellar-science-pack-dynamic-packs-required=Arredonda da metade para cima todos os pacotes científicos planetários que contribuem para a descoberta de [technology=interstellar-science-pack] será necessário, substituindo o codificado
require-gleba-for-greenhouse-tech=A tecnologia de estufa não pode ser pesquisada antes da descoberta de Gleba.
tree-seed-probability=Probabilidade média de sementes caírem ao cortar uma árvore (range: 0-1).
muluna-hardcore-lock-recipe-x=Incentiva uma pequena produção de ciência antes do lançamento do primeiro foguete ao bloquear uma tecnologia atrás de ciência espacial.
muluna-easy-electric-roboports-on-muluna=Aumenta a pressão da atmosfera de Muluna para 10 hPa, permitindo que roboports elétricos funcionem em Muluna.
muluna-alternative-automation-pack-recipe=Permite a pesquisa completa de tecnologias iniciais em Muluna. Sempre ativado no início em Muluna.
muluna-easy-interstellar-science-pack-compatibility-mode=O pacote científico de exploração só é adicionado a tecnologias específicas de Muluna e de fim de jogo.
muluna-runtime-locomotive-replacement=Ativa a substituição de entidades de locomotivas em tempo de execução para proibir combustíveis não oxigenados nelas.

[nav-beacon]
single-per-platform=Somente um radar de satélite pode existir por plataforma espacial.

[tips-and-tricks-item-name]
muluna-briefing=Muluna briefing
space-science=Ciência espacial em plataformas espaciais

[tips-and-tricks-item-description]
muluna-briefing=[planet=muluna] é uma extensão infinita de rocha cinzenta. Meteoritos são abundantes na superfície e são ricos em metais, combustível e água, embora para alcançar esses recursos seja necessário que os meteoritos sejam esmagados em [entity=crusher] primeira.\n[entity=metallic-asteroid-chunk]: Fonte primária de [item=iron-ore]. [entity=carbonic-asteroid-chunk]: Fonte primária de combustível químico na forma de [item=carbon].\n[entity=oxide-asteroid-chunk]: Fonte primária de [fluid=water]. [entity=anorthite-chunk]: Fonte alternativa de [item=copper-cable] e [item=rocket-fuel].\nO combustível não pode ser queimado sem uma fonte artificial de [fluid=oxygen]. Produtos petrolíferos não podem ser produzidos aqui sem tecnologias além do nosso conhecimento atual.
space-science=Ao desbloquear [item=interstellar-science-pack], torna-se possível produzir [item=space-science-pack] em plataformas espaciais usando pedaços de asteroides processados.

[console]
muluna-satellite-radar-invalid-storage=[Muluna] ERROR: Armazenamento de dados do radar de satélite inválido. Excluindo o armazenamento para evitar travamento. Talvez seja necessário reposicionar seus radares.
muluna-incompatible-aps-setting=As configurações de início do Muluna e "(hard) remover cápsulas de carga iniciais" são incompatíveis. Este salvamento está bloqueado. Inicie um novo salvamento com uma dessas opções desabilitada.
interstellar-science-pack-progress=__3__ progresso: __1__/__2__ pacotes científicos planetários descobertos.
can-not-place-here-unnatural-tile=Não pode ser aplicado aqui. Aplique diretamente sobre azulejos naturais.
muluna-2-message=Você atualizou o Muluna para a versão 2.0.0. Esta é uma atualização importante, então faça um backup do seu jogo antigo salvando este mapa com um novo nome..\nPasse os próximos minutos revisando seu [planet=muluna] factorio.\nVerificar [item=interstellar-science-pack] fábricas, [entity=muluna-greenhouse-wood], e outras partes da sua fábrica em busca de erros.
technology-enabled=[technology=__1__] habilitada.
can-not-place-more-telescopes-X=Atualmente, você não pode construir mais de __1__ telescópios por superfície.
can-not-place-more-telescopes-1=Atualmente, você não pode construir mais de __1__ telescópio por superfície.
mod-missing-using-placeholder-graphics=O mod de gráficos "__1__" não está instalado. Usando recursos provisórios. Para usar este mod de gráficos, descompacte __1__ versão __2__, altere "factorio_version" em info.json para 2.1 e coloque a pasta descompactada na sua pasta de mods. Não distribua este arquivo modificado.
factorio-update-required=[Muluna] Você provavelmente está jogando uma versão do Factorio rotulada como experimental. Versões iniciais do Factorio 2.1.X quebram as caixas de fluidos em entidades de Muluna e entidades de vários outros mods de planetas. Este não é um problema sobre o qual os criadores de mods de planetas tenham controle. Verifique o repositório do Github de Muluna para mais informações: https://tinyurl.com/muluna-fluidbox\nPara corrigir temporariamente este problema, separe as redes de fluidos com [item=pump], [item=valves-overflow], [item=valves-top_up] e [item=valves-one_way].

