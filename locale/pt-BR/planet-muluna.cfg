[mod-description]
planet-muluna=Explore a lua Muluna, da Nauvis, centrada no esmagamento de asteroides, e dê seu primeiro passo no espaço. Descubra novos usos para os trituradores, agora disponíveis em todas as superfícies. Use o pacote científico interestelar para aprimorar suas plataformas espaciais e alcançar ainda mais fundo no espaço.

