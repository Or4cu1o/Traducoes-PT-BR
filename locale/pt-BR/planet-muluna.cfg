[item-description]
muluna-satellite-radar=Atua como um radar com alcance ilimitado, mapeando a visão remota de jogadores em planetas orbitados pelo radar satélite. Consome energia apenas quando em uso. Radares de maior qualidade mapeiam mais quadrados e consomem menos energia por quadrado mapeado.
muluna-greenhouse=Deve ser semeado com uma cultura específica em uma máquina de montagem antes de ser colocado.
low-density-space-platform-foundation=Duas vezes mais durável e metade mais densa que as fundações de plataforma espacial padrão.
muluna-microcellular-plastic=Plástico contendo bilhões de orifícios microscópicos. Possui propriedades materiais incomuns.
muluna-diffused-plastic=Plástico difundido com dióxido de carbono. Este dióxido de carbono não permanece no plástico por muito tempo.
