[technology-description]
space-science-pack=Produção de [item=space-science-pack] em [planet=muluna].
muluna-anorthite-processing=Produção de alumínio a partir de [item=anorthite-chunk], que pode ser usado como [item=rocket-fuel] e uma fonte alternativa de [item=copper-cable].
muluna-advanced-stone-processing=Usando [item=crusher] processar [item=stone] com maior produtividade.
interstellar-science-pack=Tecnologias para se aventurar mais profundamente no espaço.
muluna-nanofoamed-polymers=Desbloqueado ao desbloquear quaisquer __1__ pacotes científicos planetários.
muluna-helium-enrichment=O reprocessamento de hélio nos permite explorar tecnologias exóticas.
advanced-space-science-pack=Permite a produção de [item=space-science-pack] no espaço.
space-chest-muluna=Um baú que pode armazenar uma pequena quantidade de itens longe do compartimento de carga de um navio.
muluna-cycling-steam-turbine=Uma turbina a vapor mais eficiente que permite que parte do vapor consumido seja condensado novamente em água para reaquecimento. Prefere vapor de melhor qualidade.
muluna-oxygen=Se quisermos queimar alguma coisa aqui, precisaremos produzir nosso próprio oxigênio.
muluna-wood-cultivation=Cultivo de [item=wood] em um [entity=chemical-plant]. Fácil de configurar, mas lento. Consome [fluid=carbon-dioxide] e produz [fluid=oxygen].
muluna-greenhouses=Estufas dedicadas podem produzir [item=wood] E [fluid=oxygen] muito mais rápido do que as plantas químicas, mas devem ser semeadas com [item=muluna-sapling] antes de usar.
muluna-gas-venting=Enquanto [item=wood] é um excelente sumidouro de carbono, mas sozinho não consegue manter uma usina elétrica estável. Em situações de emergência, é preciso liberar o excesso de gás para evitar um apagão.
muluna-fertilized-greenhouses=Nutrientes de [planet=gleba] nos permite aumentar a produção de madeira em [entity=muluna-greenhouse-wood].
muluna-fertilized-greenhouses-vulcanus=Flurocetona de [planet=aquilo] nos permite cultivar árvores em qualquer superfície e aumentar ainda mais a produção de madeira em [entity=muluna-greenhouse-wood].
asteroid-productivity=Aumento do rendimento do esmagamento de asteroides em plataformas espaciais e em [planet=muluna].
asteroid-reprocessing=Reprocessar as impurezas nos asteroides para obter um equilíbrio mais adequado de recursos nas plataformas espaciais e em [planet=muluna].
advanced-asteroid-processing=Obtenha uma gama mais ampla de recursos de asteroides em plataformas espaciais e em[planet=muluna].
automation-3=Montagem de máquinas capazes de processar ingredientes fluidos e de dados, com velocidade adicional e slots de módulo.
wood-gas-processing=A gaseificação da madeira utiliza um laboratório químico para transformá-la em gás de petróleo e betume diluído. O betume diluído pode ser transformado em combustível sólido usando um laboratório químico.
wood-gas-processing-to-crude-oil=A melhoria com betume diluído usa betume diluído e água para criar petróleo bruto.
advanced-wood-gas-processing=A gaseificação avançada de madeira transforma madeira e água em óleo pesado, óleo leve e gás de petróleo usando uma refinaria.
muluna-nanofoamed-polymers-2069=Desbloqueia quaisquer __1__ pacotes científico planetária da seguinte lista:
muluna-water-saving-wood-cultivation=Um método mais lento, porém com menor consumo de água, para a produção de madeira.
muluna-space-telescope=Dados astronômicos extraídos do Planeta Despedaçado.
x-asteroid-crushing=Triture asteroides em um triturador ou manualmente.
muluna-gleba-greenhouses=Cultive plantações de Gleba em qualquer lugar.
muluna-asteroid-upcycling=Use dados astronômicos para detectar e isolar pedaços de asteroides de alta qualidade.
rocket-part-productivity-vulcanus=Aumenta a produtividade das peças de foguete em Vulcanus.
rocket-part-productivity-fulgora=Aumenta a produtividade das peças de foguete em Fulgora.
