[space-location-description]
muluna=O maior satélite natural de Nauvis. A superfície é desprovida de vida, mas rica em metais e minerais. O cobre não é facilmente acessível, mas o alumínio pode ser usado como substituto para a maioria das coisas. As plantas podem crescer aqui com grande dificuldade.

