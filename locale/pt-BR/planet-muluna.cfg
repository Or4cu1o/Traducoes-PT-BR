[entity-factoriopedia-description]
muluna-telescope-combinator=Observa o universo, coletando informações sobre os arredores do telescópio.\nEm planetas:\n[img=quality.normal]: Índice de cada plataforma espacial em órbita\n[img=quality.uncommon]: Estado de cada plataforma espacial em órbita\n      [font=default-bold]1[/font]: Aguardando um pacote inicial.\n      [font=default-bold]2[/font]: O pacote inicial foi solicitado ao sistema logístico.\n      [font=default-bold]3[/font]: O pacote inicial está a caminho.\n      [font=default-bold]4[/font]: Seguindo o trajeto.\n      [font=default-bold]5[/font]: A plataforma está pronta para deixar este planeta e não aceita entregas.\n      [font=default-bold]6[/font]: Nenhuma estação no cronograma.\n      [font=default-bold]7[/font]: Sem trajeto.\n      [font=default-bold]8[/font]: Aguardando em uma estação\n      [font=default-bold]9[/font]: Pausado\n[img=quality.rare]: Se(2) ou se não(1) cada plataforma em órbita pode partir\nEm plataformas:\n[img=virtual-signal.signal-I]: Índice da plataforma espacial\n[img=virtual-signal.signal-X]: Se estiver em uma conexão espacial, posição atual ao longo da conexão espacial\n[img=virtual-signal.signal-L]: Se estiver em uma conexão espacial, comprimento total da conexão espacial\nO telescópio também emitirá um sinal para cada asteroide ao redor da plataforma. Subcomponente de [entity=muluna-telescope].
muluna-telescope-combinator-no-quality=Observa o universo, coletando informações sobre os arredores do telescópio.\nEm planetas: Índice de cada plataforma espacial em órbita\nEm plataformas:\n[img=virtual-signal.signal-I]: Índice da plataforma espacial\n[img=virtual-signal.signal-X]: Se estiver em uma conexão espacial, posição atual ao longo da conexão espacial\n[img=virtual-signal.signal-L]: Se estiver em uma conexão espacial, comprimento total da conexão espacial\nO telescópio também emitirá um sinal para cada asteroide ao redor da plataforma. Subcomponente de [entity=muluna-telescope].

