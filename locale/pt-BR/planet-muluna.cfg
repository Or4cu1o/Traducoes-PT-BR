[alert]
nav-beacon-available=Radar de satélite em órbita __1__.\nToda a terra pode ser visualizada remotamente por meio deste radar.\nDesative este alerta nas configurações de mod por jogador.
nav-beacon-available-disabled=Radar de satélite orbitando __1__.\nAtualmente está desativado.\nDesative este alerta nas configurações de mod por jogador.

[entity-description]
muluna-advanced-boiler=Uma caldeira que pode funcionar em ambientes com zero oxigênio, como [planet=muluna] e em plataformas espaciais.
space-heating-tower=Uma torre de aquecimento que pode funcionar em ambientes com zero oxigênio, como [planet=muluna] e em plataformas espaciais.
muluna-cycling-steam-turbine=Uma turbina a vapor mais eficiente que permite que parte do vapor consumido seja condensado novamente em água para reaquecimento. Prefere vapor de melhor qualidade.\n[fluid=steam] max. temperatura: 500 °C\n[fluid=cooled-steam] temperatura: 100 °C
muluna-rocket-buggy=Um carro maior e mais rápido, armado com um lançador de foguetes e uma grade de equipamentos.
muluna-vacuum-heating-tower=Gera calor a partir de combustíveis químicos com eficiência ainda maior. Pode ser usado em todas as superfícies, mas consome [fluid=oxygen] e produz [fluid=carbon-dioxide].
muluna-telescope-combinator=Observa o universo e coleta informações sobre os arredores do telescópio.\nEm planetas:\n[img=quality.normal]: Índice de todas as plataformas espaciais em órbita\n[img=quality.uncommon]: Estado de cada plataforma espacial em órbita\n[img=quality.rare]: Se(2) ou se não(1) cada plataforma em órbita pode sair\nEm plataformas:\n[img=virtual-signal.signal-I]:índice de plataforma espacial\n[img=virtual-signal.signal-X]:se em conexão espacial, posição atual ao longo da conexão espacial\n[img=virtual-signal.signal-L]:se houver conexão espacial, comprimento total da conexão espacial\nO telescópio também emitirá um sinal para cada asteroide ao redor da plataforma. Subcomponente de [entity=muluna-telescope].
muluna-telescope=Observa o universo, gerando dados astronômicos. Produz mais dados em locais mais exóticos. Também gera sinais de circuito via [entity=muluna-telescope-combinator].
E-greenhouse=Cultive sementes, colha plantas
muluna-telescope-combinator-no-quality=Observa o universo, coletando informações sobre os arredores do telescópio.\nEm planetas: Índice de cada plataforma espacial em órbita\nEm plataformas:\n[img=virtual-signal.signal-I]:Índice da plataforma espacial\n[img=virtual-signal.signal-X]:Se estiver em uma conexão espacial, posição atual ao longo da conexão espacial\n[img=virtual-signal.signal-L]:Se estiver em uma conexão espacial, comprimento total da conexão espacial\nO telescópio também emitirá um sinal para cada asteroide ao redor da plataforma. Subcomponente de [entity=muluna-telescope].
muluna-crusher=Um triturador movido a motor elétrico. Tritura itens com melhor eficiência energética.
muluna-burner-roboport=Um roboport que abastece robôs com combustível e oxidante em vez de eletricidade, permitindo que os robôs voem sem atmosfera.\nVeja também: [entity=muluna-burner-roboport-roboport]
muluna-burner-roboport-roboport=Componente de roboport de [entity=muluna-burner-roboport]

