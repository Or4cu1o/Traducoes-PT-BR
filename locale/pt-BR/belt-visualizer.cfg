[mod-setting-name]
bv-highlight-maximum=Máximo de destaques por tique
bv-container-passthrough=Passagem por contêineres

[mod-setting-description]
bv-highlight-maximum=O número máximo global de esteiras destacadas por tique. Reduzir diminui a velocidade da visualização e melhora o desempenho.
bv-container-passthrough=Controla se os carregadores destacados continuam através dos contêineres.

[controls]
bv-highlight-belt=Destacar esteiras que não sejam fantasmas
bv-highlight-ghost=Destacar esteiras
bv-toggle-hover=Alternar modo de passagem do mouse

[shortcut]
bv-toggle-hover=Alternar modo de passagem do mouse
