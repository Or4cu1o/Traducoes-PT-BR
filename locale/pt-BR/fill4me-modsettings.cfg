[mod-setting-name]
fill4me-maximum-fuel-value=Valor máximo do combustível
fill4me-maximum-ammo-value=Dano máximo da munição
fill4me-refill-ignores-range-limit=Ignorar o alcance para recarga
fill4me-ignore-ammo-radius=Ignorar o raio da munição
fill4me-ammo-load-limit=Carga de munição, limite por
fill4me-ammo-load-percent=Carga de munição, porcentagem
fill4me-ammo-load-count=Carga de munição, contagem
fill4me-blacklist-fuel=Lista negra de combustível do Fill4Me
fill4me-blacklist-ammo=Lista negra de munição do Fill4Me

[mod-setting-description]
fill4me-maximum-fuel-value=Não carregue automaticamente nenhum combustível em entidades se o valor do combustível exceder o valor fornecido.  O combustível de foguete é 100000000 (100 milhões).  O combustível sólido é 12000000 (12 milhões).  Use 0 para carregar qualquer um.
fill4me-maximum-ammo-value=Não carregue automaticamente nenhuma munição em entidades se o valor do dano exceder o valor fornecido.  Não distingue entre artilharia e balas.  Use com cautela.  Use 0 para carregar qualquer.
fill4me-refill-ignores-range-limit=Se ativado, o comportamento original deste mod será ativado, permitindo que você reabasteça qualquer torre/veículo, não importa o quão longe ele esteja.  Quando desativado, qualquer torre fora da distância de alcance "aberta ou acesso" não poderá ser recarregada até você se aproximar.
fill4me-ignore-ammo-radius=Verifique para ignorar o raio associado à munição ao carregar torres.  OBSERVAÇÃO: Isso pode levar a um tiroteio de torre em alvos que estão muito próximos e danificar ou se destruir.
fill4me-ammo-load-limit=Escolha o método a ser usado para decidir como limitar a quantidade de munição carregada em torres/armas.  "Porcentagem" carregará munição até uma porcentagem máxima do que você tem no inventário.  "Contagem" carregará munição até um número específico.  "Ambas" escolherá o menor dos dois valores, porcentagem ou contagem.
fill4me-ammo-load-percent=Porcentagem de munição disponível para carregar na torre, se estiver usando carregamento baseado em porcentagem.
fill4me-ammo-load-count=A quantidade máxima de inserção para carregar na torre, se estiver usando o carregamento baseado em contagem.
fill4me-blacklist-fuel=Insira os nomes internos das fontes de combustível separados por vírgulas. Use o comando "/f4m.list_fuel" para listar as fontes de combustível.  Exemplo: "small-electric-pole,wood"
fill4me-blacklist-ammo=Insira os nomes internos das munições separados por vírgulas. Use o comando "/f4m.list_ammo" para listar as munições.  Exemplo: "firearm-magazine,rocket"

[string-mod-setting]
fill4me-ammo-load-limit-percent=Porcentagem
fill4me-ammo-load-limit-count=Contagem
fill4me-ammo-load-limit-both=Ambas (porcentagem e contagem)

[shortcut-name]
fill4me-blacklist-button=Aplica a lista negra do Fill4Me
