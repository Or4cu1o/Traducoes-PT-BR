[mod-setting-description]
item-network-stack-size-on-assembler-paste=O tamanho de stack padrão ao colar uma receita de um montador em um baú de rede.
item-network-enable-player-logistics=Esta configuração controla se a rede de itens atenderá às solicitações logísticas dos jogadores.
item-network-enable-logistic-chest=Esta configuração controla se a rede de itens enviará itens para os baús solicitadores e buffer.
item-network-number-of-entities-per-tick=Esta configuração controla o número de entidades que serão atualizadas a cada tique. Números maiores transferirão itens e fluidos mais rapidamente, mas levarão mais tempo.
item-network-enable-performance-tab=Ative esta configuração para ver a guia desempenho na exibição de rede, que exibe as durações médias do mod.
item-network-unlock-stage=Escolha quando a Rede de Itens fica disponível.
item-network-detailed-steam-signals=Quando ativado, o vapor é dividido em sinais separados por temperatura (vapor-165, vapor-250 vapor-500).

