[mod-name]
ArmouredBiters=Mordedores Blindados

[mod-description]
ArmouredBiters=Adiciona inimigos blindados chamados Snappers ao jogo, com sprites e animações personalizados. Têm mais vida, mas são mais lentos que os mordedores comuns.

[entity-name]
small-armoured-biter=Snapper pequeno
small_armoured-corpse=Corpo de Snapper pequeno
medium-armoured-biter=Snapper médio
medium-armoured-corpse=Corpo de Snapper médio
big-armoured-biter=Snapper grande
big-armoured-corpse=Corpo de Snapper grande
behemoth-armoured-biter=Snapper colossal
behemoth-armoured-corpse=Corpo de Snapper colossal
armoured-biter-spawner=Ninho de Snapper
armoured-biter-spawner-corpse=Corpo de ninho de Snapper
leviathan-armoured-biter=Snapper leviatã
leviathan-armoured-corpse=Corpo de Snapper leviatã

[entity-description]
small-armoured-biter=Inimigo pequeno, lento, porém blindado.
medium-armoured-biter=Inimigo de porte médio, relativamente lento, mas bem blindado.
big-armoured-biter=Inimigo grande, fortemente blindado.
behemoth-armoured-biter=Inimigo enorme, imensamente blindado.
leviathan-armoured-biter=Inimigo gigantesco, imensamente blindado.

