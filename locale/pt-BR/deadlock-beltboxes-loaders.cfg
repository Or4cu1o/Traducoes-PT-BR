[mod-setting-description]
deadlock-stacking-auto-unstack=Desempilhe automaticamente quaisquer itens empilhados recolhidos do chão ou das esteiras.
deadlock-stacking-hide-unstacking=Remove receitas de desempilhamento da aba de criação do jogador. Isso evita que você "desempilhe manualmente", mas remove muita bagunça.
deadlock-loaders-snap-to-belts=Os carregadores definirão automaticamente seu modo e rotação para corresponder às esteiras adjacentes (e inventários no lado da esteira) quando colocados
deadlock-loaders-snap-to-inventories=Os carregadores serão inseridos automaticamente nos inventários para os quais estão voltados ou afastados quando colocados
deadlock-stacking-batch-stacking=As caixas de esteira serão empilhadas e desempilhadas em lotes de 4, carregando as esteiras uniformemente e aumentando a produtividade com esteiras modificadas de velocidade extremamente alta
deadlock-stacking-show-alt-info=Mostra ou oculta o ícone de receita exibido nas caixas de esteira em alt-mode.
deadlock-strict-fast-replace-beltboxes=Impedir que as caixas de esteira substituam rapidamente qualquer coisa que não sejam outras caixas de esteira
deadlock-strict-fast-replace-loaders=Impedir que os carregadores substituam rapidamente qualquer coisa que não sejam outros carregadores
deadlock-stack-size=Defina o número de itens que compõem cada item empilhado. Aviso: não é recomendado alterar esta configuração para jogos salvos existentes. Itens empilhados perderão densidade de inventário quando esta configuração for definida para um número pelo qual seus tamanhos de pilha não sejam divididos uniformemente.
