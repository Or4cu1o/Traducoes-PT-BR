[technology-description]
bob-alloy-processing=Aprenda a combinar mais de um ingrediente para produzir uma liga.
bob-chemical-processing=Pesquisa sobre o uso e a produção de produtos químicos.
bob-electrolysis=A eletrólise é usada para separar elementos de um líquido.
bob-aluminium-processing=Pesquise como purificar o alumínio, um metal leve e razoavelmente resistente.
bob-gold-processing=Pesquise como refinar o ouro.
bob-nickel-processing=Pesquise como refinar o níquel.
bob-lead-processing=Pesquise como refinar o chumbo.
bob-silicon-processing=Pesquise como purificar o silício para uso em eletrônica.
bob-titanium-processing=O titânio é um metal leve e muito resistente, mas difícil de separar do seu minério.
bob-tungsten-processing=O tungstênio tem um ponto de fusão altíssimo; vamos pesquisar como refiná-lo de outra forma.
bob-nitinol-processing=O nitinol é uma liga de níquel e titânio; vamos ver para que podemos usá-lo.
bob-invar-processing=O invar é uma liga de ferro e níquel; talvez possamos usá-lo para algo.

