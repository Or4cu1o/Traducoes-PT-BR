[mod-setting-description]
valves-pump-speed=A quantidade de fluido a bombear por segundo quando a válvula está aberta. Vale para todas as válvulas deste mod: transbordamento, reabastecimento e unidirecional. É limitada à vazão máxima de fluido definida pela constante de utilidade `max_fluid_flow`.
valves-disable-py-migration=Desativa a migração automática das válvulas do PyIndustry para este mod.
