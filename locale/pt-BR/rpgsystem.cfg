[mod-setting-description]
charxpmod_enable_damage_attribs=Habilita Bônus de armadura, Bônus de dano e Acerto crítico. Desative se o final do jogo estiver muito lento.
charxpmod_xpinilevel=XP necessário para subir de nível pela primeira vez
charxpmod_xpmult=Usado para construir a tabela de XP, do nível 1 até a configuração de Nível Máximo, utilizando este multiplicador
charxpmod_xp_mp_reductor=A cada nível, este redutor é aplicado ao multiplicador acima
charxpmod_afk=Tempo máximo em minutos que um jogador pode ficar ausente (AFK) antes de parar de receber XP. Zero desativa esta regra
charxpmod_death_penal=Porcentagem de XP perdida ao morrer
charxpmod_time_ratio_xp=XP proporcional concedido a um jogador com base em seu tempo de jogo
charxpmod_print_xp_user=Exibe todo o XP ganho como mensagens no bate-papo
charxpmod_xp_multiplier_bonus=De 0,1 a 100,0
charxpmod_xp_maxlevel=40-500 (padrão 100)
charxpmod_xp_maxlevel_ability=10-50 (padrão 20)
charxpmod_enable_potion_loot=Se habilitado, geradores podem soltar poções de RPG como espólio

