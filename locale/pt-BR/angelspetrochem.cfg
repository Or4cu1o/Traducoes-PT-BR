[technology-description]
kovarex-enrichment-process=Tudo o que é necessário para aproveitar o excesso de urânio-238. Converta-o em plutônio-239 por meio de ciclos regeneradores.
angels-thorium-power=Tudo o que é necessário para usar ciclos de energia à base de tório. Se você tiver excesso de plutônio-239 ou cúrio-245, poderá obter um aumento de energia.
angels-fusion-power=Tudo o que é necessário para iniciar e manter a energia de fusão por meio do uso de múons e deutério.
angels-fluid-control=Fornece utilitários para controlar o fluxo de fluidos.
angels-basic-chemistry=Conhecimento para produzir e manusear os ingredientes básicos para a química.
angels-water-chemistry=Enriquecimento e processamento de água pesada.
angels-sulfur-processing=O enxofre é um elemento químico não metálico altamente reativo com uma ampla gama de aplicações.
angels-nitrogen-processing=O nitrogênio é um elemento químico não metálico com uma ampla gama de aplicações.
angels-chlorine-processing=O cloro é um halogênio reativo com uma ampla gama de aplicações.
angels-advanced-gas-processing=Maneiras alternativas de fracionar hidrocarbonetos de cadeia curta.
angels-oil-processing=Tecnologia essencial para o processamento de hidrocarbonetos de cadeia longa.
angels-advanced-oil-processing=Maneiras alternativas de fracionar hidrocarbonetos de cadeia longa.
angels-gas-processing=Tecnologia essencial para o processamento de hidrocarbonetos de cadeia curta.
angels-flare-stack=Queimar o excesso de produtos químicos simplifica as cadeias de produção ao custo de poluição.
angels-advanced-chemistry=Conversões químicas seletivas usando catalisadores.
angels-coal-processing=Purificação e uso de coque, bem como de carbono.
angels-coal-cracking=Liquefação e gaseificação de carvão.
angels-gas-synthesis=Síntese de novo de hidrocarbonetos a partir de produtos químicos básicos.
angels-steam-cracking=Craqueamento a vapor de hidrocarbonetos.
angels-plastic=Várias fontes de plástico.
angels-resins=Materiais poliméricos sintéticos que podem ser moldados em composições protetoras.
angels-resin=Várias fontes de resinas.
angels-rubbers=Materiais poliméricos sintéticos que podem ser moldados em composições elásticas.
angels-rubber=Copolimerização de estireno e butadieno como uma borracha artificial versátil.
angels-sodium-processing=O sódio é um metal alcalino altamente reativo cujos sais são reagentes essenciais em muitos processos.
angels-rocket-booster=Combustível especializado para foguetes.
angels-explosives=Maneiras alternativas de fabricar explosivos.
angels-electric-boiler=Eletricidade como fonte de energia alternativa para a produção de vapor.
angels-nuclear-fuel=Materiais radioativos fornecem combustíveis com aceleração excepcional para veículos.
oil-gathering=Compostos orgânicos de depósitos fósseis servem como base para um vasto número de cadeias de produção.

