[tips-and-tricks-description]
angels-petrochem=Um mod que reformula o processamento petroquímico para ser mais complexo e pseudorrealista (sem exageros).\nRecursos brutos precisam ser processados e transformados por meio de cadeias de processamento químico para obter:\n__1__\n O mod também adiciona um novo poço: __2__
angels-air-filtering=Oxigênio e nitrogênio são materiais básicos essenciais para diversos processos industriais, alguns dos quais fazem parte deste mod. Por exemplo, usar [fluid=angels-gas-oxygen] em vez de ar bruto melhora a eficiência dos processos de fundição. Portanto, ser capaz de separar o ar em [fluid=angels-gas-oxygen] e [fluid=angels-gas-nitrogen] é uma tecnologia essencial.
angels-air-filtering-notes=\n\n[font=default-bold]NOTAS[/font]: A atmosfera da Terra é composta por aproximadamente 21% de oxigênio e 79% de nitrogênio.\nEste mod usa uma proporção diferente para reduzir o desperdício de gás de nitrogênio no início do jogo e o desperdício de gás de oxigênio no final do jogo. Podemos fazer isso porque Nauvis não é a Terra.
