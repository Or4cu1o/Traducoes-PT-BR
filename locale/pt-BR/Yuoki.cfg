[entity-description]
y_mftank=Armazena fluido MF aquecido.
y_trockner=Processa emulsão rica.
y_hppump=Bombeia emulsão no subsolo para minerar minerais.
y_crystalizer=Cultiva cristais minerais.
y_mixer_emu=Mistura emulsão de lavagem.
y_lampe_44basement_a=E... na mosca! Uau, isso é brilhante!
y_lampe_44basement_b=Ilumina os cantos para facilitar no subsolo.
y_lampe_66basement=Isso sim é o que eu chamo de uma fundação sólida!
yi_hny1=Que seus desejos se realizem! Aproveite a vida!
yi_hny2=Que seus desejos se realizem! Aproveite a vida!
yi_obelisk_A3_5X=Você é muito resistente à dor e testou versões <= YI-0.3.54 - (as versões com pouco/nenhum surgimento de recursos)
yi_bug1=Estou aqui sentado e esperando - e terei minha chance novamente (primeiros caçadores na 0.13: Peppe, GyroByte, Pirate_Rance, Lorico, Codec, zaydon, tzombiek - obrigado!)
ye_science_ultimate=Força através do conhecimento!
y_trade_ultimate=Lucro antes da consciência! A consciência leva à falência.
y_steam_turbine_mc=Uma bela peça de tecnologia a vapor, fabricada com amor e conhecimento. Oferece melhor eficiência.
y_obninsk_mc=A primeira usina nuclear comercial, reconstruída e aprimorada. Dê as boas-vindas ao futuro brilhante!
y_mc_dirtwasher=Lava minério e terra, separando materiais úteis.
y_mc_e2_mining_drill=Abre buracos no chão e coleta minério para você — nada mais de trabalho manual.
y_mc_underground_drill=Sob a superfície, você pode encontrar jazidas ricas... em alguns planetas... alguma sorte por aqui?
yi_mine_plasma=Viu aquele clarão verde? Um mordedor vira cinzas.
yi_mine_impact=Também tem alguns efeitos flamejantes.
y_signal_pole=Após momentos difíceis com fios, Martin desenvolveu um Conector de sinal — agora passar fiação é divertido! ;)
y_water_mixer=Pode misturar emulsão de água industrial e outros componentes sólidos em fluidos.
y_smelter=Novos avanços no processo de fundição.
y_charger=Thomas L. Zaydon desenvolveu este método de carregamento de calor.
y_old_bodenlampe=R~50 - O que produz essa luz azul? Brilha em um azul radiante.
y_lampe_neotix=R~50 - A recém-inventada série de lâmpadas de Neotix. Tem um brilho azul.
y_lampe_yuoki=R~50 - "YI" brilha intensamente! Tem um brilho amarelo.
y_lampe_corner=R~75 - Chega de cantos escuros...
y_tile_slagbricks=Por favor, chega de escória!
y_tile_slagpattern=Provavelmente não seria uma boa ideia usar salto alto aqui.
y_tile_slagfilled=É meio marrom.
y_sc11=Inteligente o bastante para aceitar fios.
y_rc22=Solicite o que quiser (não faz entregas de homens ou mulheres).
y_pc22=Fornece o inventário para a rede (às vezes só porcaria).
y_bc22=Só um tampão velho, no fim das contas.
y_boiler_sh=Superaquece o vapor a 1000 °C.
y-boiler-iv=Caldeira grande projetada para um espaço de 3x3.
y_boiler4_mc=O rótulo na frente diz: "Energia verde".
y-dirtwasher=Lave materiais para ver o que consegue.
y-obninsk-reactor=Dedicado ao primeiro reator nuclear de uso civil (30 MW térmicos - 5 MW elétricos líquidos). Agora temos uma versão avançada, é claro. A energia elétrica líquida real depende do gerador.
y-steam-turbine=Turbina a vapor, prioridade de saída padrão.
y-notfall-generator-s1=Funciona permanentemente... até ficar sem combustível ou ser desconectado da rede elétrica.
y-notfall-generator-s2=Gerador padrão - segunda prioridade para energia sob demanda.
y_turret_gun1f12=Apenas a força bruta pode repelir ataques alienígenas — sem piedade para os alienígenas!
y_turret_gun2f12=Cano duplo, com alta cadência de tiro graças ao Maudlin Fluid Mechanic System — descoberto no antigo mistério da mecânica dos fluidos.
y_turret_laser22f12=As últimas forças leais fogem com o cruzador "Eisenstein" para alertar o Império. Elas permanecem firmes contra todos os inimigos, humanos ou não, até serem destruídas. Cada arma é construída a partir de um pequeno pedaço da nave.
y-laser-def-s4=Posição defensiva miniaturizada, mas totalmente funcional como um Bonsai. Use sua Zoom-Gun para deixá-la do tamanho de bolso e sua Unzoom-Gun para deixá-la em tamanho real. Ou seu M-UI-Controller portátil...
y_turret_plasma=O plasma é um mistério à parte. Talvez um Pulse Laser Magnifire? Tanto faz. Mata alienígenas. É tudo o que importa.
y_turret_flame=Purifique a escória no fogo sagrado! Espere, alguém pediu um bife grelhado? Aqui vem ele, tostadinho na hora do lado de fora do muro! Aviso: piromaníacos adoram fogo e não farão distinção entre você e os alienígenas.
y-weapon-ztt=Arma de transferência de tempo zero: "Jorgen" foi a primeira pessoa a testar viagem no tempo... sem sucesso. Mas desenvolveu esta arma e continua pesquisando sobre temporalidade.
y-mining-drill=Queima combustível, sem necessidade de eletricidade.
y-rare-wall-basic=Feito de uma liga maluca de Durotal.
y-rare-wall-adv=Feito de liga de Krakon.
y-rare-chest-log=Os robôs acham que sou inteligente, mas sou apenas um baú... ou não? 1 + 1 = 2 — parece que posso fazer mais do que só guardar coisas!
j-dl-request=Os robôs acham que sou inteligente, mas sou só um baú egoísta... Me dê coisas!
j-dl-provider=Os robôs acham que sou inteligente, mas eu só quero que todo mundo tenha o que eu tenho!
j-dl-buffer=Os robôs acham que sou inteligente, mas eu só acumulo tralha!
j_yi_roboport1=The 8080: o expansor de rede logística que você não sabia que precisava...
j_logistic2-robot=Você chamou os serviços de entrega da Amazon?
j_construction2-robot=Só um pouquinho mais rápido que funcionários públicos.
y-substation-m=Troca cobre por fiação de liga avançada.
y-accumulator-s=Fique longe — contém eletricidade.
y-accumulator-m=Aproxime-se se quiser se queimar.
y-accumulator-b=Não se preocupe, é seguro tocar... NÃO, era brincadeira.
y-crusher=Insira qualquer coisa — o resultado é sempre pó.
y-wall-forcefield=Nomeado em homenagem a um cientista ucraniano. Reflete dano. Receber energia cinética (dano) também recarrega o campo, mas a estrutura central não se autorregenera.
y-wall-forcefield-a=Baseado na tecnologia de campo de força passivo. Agora causa mais dano, mas necessita de energia constante.
y-tank-1000=Preste atenção onde conecta. Fluxo de saída lento.
y-tank-4500=Tanque subterrâneo padrão de Durotal. Saída apenas com uma bomba.
y-tank-8000=Só um pouco maior. Quanto maior, melhor, sabe? Saída apenas com uma bomba.
y-tank-24k=Usa cavernas subterrâneas artificiais para armazenar fluidos. Saída apenas com uma bomba.
yi-monument1=Mostre aos alienígenas o seu poder e quem manda neste planeta.
y-pipe-hc=0,8x a capacidade dos canos padrão.
y-pipe-to-ground-hc=0,8x a capacidade dos canos padrão. Permite canos subterrâneos 50% mais longos.
y-pipe-ec=1,3x a capacidade dos canos padrão.
y-pipe-to-ground-ec=1,3x a capacidade dos canos padrão. Permite canos subterrâneos 100% mais longos.
yi_pipe_green=Capacidade padrão.
yi_pipe_underground_green=Capacidade padrão — se escondendo no subterrâneo.
y-atomic-quantum-composer=Você não entende como funciona, mas funciona, e isso é tudo com o que se importa... até o seu planeta colapsar.
y-accumulator-s-t2=Compreender o Quantrinum permite projetos de acumuladores mais compactos — versão pequena.
y-accumulator-m-t2=Compreender o Quantrinum permite projetos de acumuladores mais compactos — versão média.
y-accumulator-b-t2=Compreender o Quantrinum permite projetos de acumuladores mais compactos — versão grande.
y-accumulator-b-tx=Acumulador de efeito quântico atômico — agora com menos potencial explosivo! Isso significa sem buracos negros ou alterações na gravidade. Talvez. Seguro apenas se você estiver em outra galáxia. ;)
y_compensator_25=Doc: "Marty, me diga... será que fluxo voa?"
y-obninsk-turbine=O Efeito Rensuir permite rotação interna em velocidade extrema sem atingir o ponto de ruptura.
y-mining-drill-e2=Melhor que a perfuratriz elétrica padrão.
y-underground-drill=Para extrair pó rico.
y-ups-flywheel-b=Taxa de carga baixa, mas taxa de descarga extrema. Funciona se entrar energia.
y-atomic-constructor=Ninguém entende essa tecnologia alienígena de reconstruir átomos — mas funciona! Às vezes!
y-inserter-s4=Braço muito longo, feito um guindaste.
y-alien-infuser=Para transmutação de matéria.
y-accumulator-crystal-m=Acumulador de cristal de alta capacidade para o fim de jogo.
y-water-gen=Gera água. Ótimo para postos avançados independentes. Alta poluição.
y-stargate=Nomeado em homenagem à primeira e mais famosa cadela no espaço. Descanse em paz, Laika, nunca nos esqueceremos de você.
y-seg=Apenas MF! Gerador elétrico bonitinho. Pequeno o bastante para caber na sua mochila. Talvez.
y-seg-p=Apenas MF! Saída de energia primária, desacelera para a energia solar.
y-meg=Apenas W-MIX! Gerador de tamanho médio. Adora girar.
y-beg=Apenas MF! Maior que o normal em todos os aspectos.
y-heg=Apenas MF! Para cargas elétricas massivas.
y-stirling-solar-dish=Maior eficiência através de calor solar concentrado.
y-fame-gen=Graças a você... veja a página 34 do fórum da Yuoki Industries — o anel conta com 40 luzes.
y-inserter-fast=Para inserção mais rápida de itens.
y-inserter-smart=Inserção lógica aprovada.
y-inserter-smart-long=Inserção lógica com maior alcance.
y_inserter_smart_leftR2=Situações especiais exigem ferramentas especiais.
y_inserter_smart_rightR2=Situações especiais exigem ferramentas especiais.
y_inserter_smart_LL=Consegue lidar com cantos.
y_inserter_smart_RR=Consegue lidar com cantos.
y_inserter_evade_shortL=Sim, eu consigo — desvio pela esquerda.
y_inserter_evade_shortR=Dando a volta ou não... é um movimento diferente.
y_inserter_diagonal=Movimento hexagonal, caminho curto.
y_wall22_hardic=A YI orgulhosamente apresenta o Componente de Defesa Hardic, chamado simplesmente de HW. "Atrás de um HW, você está seguro. Até que os mordedores aprendam a voar." — Famosas últimas palavras do Soldado Ryan.
y-substation-h=Transmissão de energia de efeito em área — energia direto da tomada.
yi_radar=Para radarizar uma área.
yi_beacon=Para sinalizar uma área.
yi_roboport=Para robotizar uma área.
y_crusher2=Cuidado com as mãos — se forem trituradas, você não poderá usá-las mais. (Transforma material em pó.)
y_formpress2=Prensa pó em formas. Nenhuma forma feminina ainda — desculpe! (Modela pellets e blocos.)
y_maintance_workshop=Homens durões fazem trabalho pesado aqui, ou só fumam e bebem cerveja... (Pode consertar coisas.)
y_alien_solar=Odeio fazendas solares feias (ideia ao assistir à transmissão ao vivo do TheBruteMan em fev./2016).
y_alien_solar2=Eu ainda odeio fazendas solares feias — então quanto maior, melhor, sabe?
y-lamp-alien=Aviso legal: nenhum alienígena de verdade aqui dentro — isso é puro marketing.
y_lamp_red=Algumas pessoas gostam de um quarto com iluminação vermelha. Eis a lâmpada perfeita para isso.
y_lamp_green=Se você mora no deserto e sente falta da cor verde, acenda esta lâmpada.
y_lamp_yellow=A escuridão não está deixando você dormir? Faça o sol brilhar sempre...
y_lamp_blue=Os céus estão vermelhos ou cinzas? Acione o interruptor e encare esta luz.
y_buffer_station=Pode comportar até 7.000 unidades.

