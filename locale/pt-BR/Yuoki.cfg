[mod-setting-description]
yuoki-vanilla-overhaul=[color=red]AVISO: ISTO ESTÁ EM MODO ALPHA![/color] \n[color=red]NÃO USE COM Space Age![/color] \nUse por sua conta e risco (por favor, envie feedback!) \nAtualizações podem quebrar sua fábrica! \nAtivar esta configuração reformulará as receitas do vanilla com itens e máquinas Yuoki.
yuoki-prod-mod-behaviour=Define se os módulos de produtividade Yuoki se comportam como no vanilla ou não têm restrições\n\n[color=green]Desativado[/color]\n- Os módulos agem como no vanilla\n\n[color=yellow](Padrão: Desativado)[/color]
yuoki-start-with-yi-suit=Comece o jogo com armadura de energia Yuoki nível 1, equipamentos básicos e robôs\n\n[color=green]Ativado[/color]\nComece com:\n- [img=item/yi_armor_gray]Traje de proteção e trabalho padrão YI\n- [img=item/yi_equip_shield_a]Gerador de escudo CF-35\n- [img=item/yi_equip_battery_a]Bateria EQ-3A\n- [img=item/yi_equip_generator_a]MG-15 -44X-\n- [img=item/yi_equip_roboport]Estação móvel de ancoragem de robôs do Angelo\n- [img=item/yi_construction-robot]25x Construtor Yi\n\n[color=yellow](Padrão: Desativado)[/color]
yuoki-inventory-size=Define o tamanho do inventário do jogador\n\n[color=green]Valor mínimo:[/color] 80\n\n[color=green]Valor máximo:[/color] 150\n\n[color=yellow](Padrão: 80)[/color]
yuoki-player-reach=Define o alcance do jogador\n\n[color=green]Valor mínimo:[/color] 10\n\n[color=green]Valor máximo:[/color] 32 (1 porção)\n\n[color=yellow](Padrão: 10)[/color]
yuoki-uc-heavyoil=Ativa a receita de [img=fluid/heavy-oil]óleo pesado para [img=item/y-unicomp-a2]Unicomp\nVocê pode querer desativar isso por motivos de equilíbrio com o Space Age.\n\n[color=yellow](Padrão: Ativado)[/color]

