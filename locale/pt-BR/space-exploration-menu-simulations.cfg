[mod-setting-name]
se-add-menu-simulations=Usar simulações de menu do Space Exploration
se-remove-vanilla-simulations=Remover simulações de menu do jogo base
se-default-simulation-length=Duração da simulação de menu (segundos)

[mod-setting-description]
se-add-menu-simulations=Se marcado, as simulações de menu do Space Exploration serão adicionadas à seleção aleatória.
se-remove-vanilla-simulations=Se marcado, as simulações de menu do jogo base serão removidas da seleção aleatória.
se-default-simulation-length=Duração em que uma simulação de menu do Space Exploration será reproduzida antes que a próxima seja carregada.\nObserve que algumas simulações (geralmente aquelas com ações programadas) têm um tempo fixo e não serão afetadas por esta configuração.
