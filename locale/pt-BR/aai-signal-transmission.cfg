menu_aai-signal-transmission=Transmissão de sinal [img=item/aai-signal-receiver]
title_aai-signal-transmission=Transmissão de sinal
page_aai-signal-transmission_text_1=Transmissores e receptores de sinal são construções conectadas à rede de circuitos que permitem mover sinais de circuito por distâncias imensas apenas ao custo de eletricidade.\n\nOs sinais da rede de circuitos são enviados e recebidos com base em canais. Sinais enviados em um canal específico só serão recebidos por receptores que estejam escutando esse canal. Qualquer número de receptores de sinal pode escutar o mesmo canal; todos receberão exatamente o mesmo sinal. Qualquer número de transmissores de sinal pode transmitir no mesmo canal; o sinal recebido desse canal será a soma dos sinais transmitidos por todos os transmissores que transmitem nesse canal.\n\nAs entradas de fio verde e fio vermelho são mantidas separadas dentro de cada canal até a saída. Isso significa que um sinal inserido em um transmissor de sinal por um fio vermelho só será emitido por um receptor de sinal em um fio vermelho.\n\nTransmissores e receptores de sinal só funcionam corretamente quando estão com energia total. Se a rede elétrica em que estão for sobrecarregada (amarela ou vermelha na interface da rede elétrica), eles param de enviar e receber sinais.

