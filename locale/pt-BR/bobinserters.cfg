[technology-name]
bob-long-inserters=Insersores longos
bob-near-inserters=Insersores próximos
bob-more-inserters=Mais insersores

[technology-description]
bob-long-inserters=Permite configurar o alcance dos insersores.
bob-near-inserters=Permite configurar o deslocamento de entrega dos insersores.
bob-more-inserters=Permite mais opções de configuração de rotação dos insersores.

[mod-setting-name]
bobmods-inserters-long1=Pesquisa de insersores longos 1
bobmods-inserters-button-enable=Mostrar botão de configuração

[mod-setting-description]
bobmods-inserters-long1=Se ativado, a pesquisa de insersores longos 1 existirá. Isso permite alterar o comprimento do insersor.\nA opção é forçada a ativar se a opção "Reformulação de insersores" do Bob's Logistics estiver ativada.
bobmods-inserters-button-enable=Coloca um botão no canto superior esquerdo da tela para acessar a configuração de insersores.\nSe estiver desativado e a posição de encaixe estiver em "Desligado", a janela de configuração só poderá ser acessada com [font=default-semibold][color=128, 206, 240]__CONTROL__bob-inserter-open-gui__[/color][/font].
