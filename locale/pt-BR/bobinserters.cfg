[mod-setting-name]
bobmods-inserters-long1=Insersores longos 1 pesquisa
bobmods-inserters-button-enable=Mostrar botão de configuração

[mod-setting-description]
bobmods-inserters-long1=Se ativado, a pesquisa longa insere 1 existirá. Isso permite que o comprimento do insersor seja alterado.\nA configuração é a força ativada se a configuração de logística de bob "revista de insersor" estiver ativada ".
bobmods-inserters-button-enable=Coloca um botão no canto superior esquerdo da tela para acessar a configuração do insersor.\nSe isso estiver desativado e a posição do dock estiver definida como "OFF", a janela de configuração só estará acessível com [font=default-semibold][color=128, 206, 240]__CONTROL__bob-insersor-open-gui__[/color][/font].
