[mod-description]
Better_Starmap_Background=Adiciona um fundo estrelado ao mapa espacial.\nOs planetas não estão mais imersos em uma escuridão infinita!

[mod-setting-name]
universe-widget-enabled=Habilitar fundo estrelado em tela cheia
asteroid-belt-1-enabled=Habilitar cinturão de asteroides interno
asteroid-belt-2-enabled=Habilitar cinturão de asteroides externo
galaxy-background-enabled=Ativar plano de fundo da galáxia
universe-background-flicker-enabled=Ativar cintilação do céu estrelado

[mod-setting-description]
universe-widget-enabled=Se deve exibir o fundo com o céu estrelado em tela cheia no mapa espacial.
asteroid-belt-1-enabled=Se deve exibir um cinturão de asteroides entre Fulgora e Aquilo.
asteroid-belt-2-enabled=Se deve exibir um cinturão de asteroides entre o Fim do sistema solar e o planeta destruído.
galaxy-background-enabled=Se deve adicionar um plano de fundo para todos os sistemas estelares suportados.
universe-background-flicker-enabled=Se deve fazer o plano de fundo do céu estrelado em tela cheia cintilar durante o movimento da câmera.
