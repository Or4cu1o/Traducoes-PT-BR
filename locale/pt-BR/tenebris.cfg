[tips-and-tricks-item-description]
tenebris-briefing=[planet=tenebris] é um planeta envolto em escuridão eterna; energia solar é inútil aqui e a visão noturna também não funciona. O planeta é infestado de centopeias — elas são fortes e venenosas, mas não incomodam você a menos que você entre no caminho delas. O planeta é movido a [item=luciferin], um composto que permite criar maquinário bioluminescente, que não precisa de energia para operar. Cápsulas de carga podem sofrer falhas de navegação ao tentar pousar neste planeta; talvez possamos usar a tecnologia que pesquisamos aqui para contornar isso.\n\nVocê precisará usar o [entity=bioinfusor] para bioinfundir maquinário com propriedades bioluminescentes, o que permite que funcione sem precisar de energia.
