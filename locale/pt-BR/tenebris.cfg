[item-description]
luciferin=Um pó bioluminescente que emite um leve brilho azul-esverdeado, usado em aplicações avançadas de energia e luz.
lucifunnel=Uma planta bioluminescente com folhas delicadas em forma de funil que emitem um etéreo brilho azul-esverdeado. Suas gavinhas retorcidas e os padrões intrincados das folhas criam um espetáculo hipnotizante na escuridão, lembrando corais submarinos ou flora alienígena. O lucifunnel prospera em ambientes de pouca luz, onde irradia uma luz suave e espectral, atraindo polinizadores noturnos e iluminando os arredores com uma aura mística.
lucifunnel-seed=Uma semente rara e luminosa que emite um leve brilho azul-esverdeado, essencial para cultivar flora bioluminescente.
quartz-ore=Um mineral brilhante e cristalino encontrado em depósitos acidentados e terrosos, valorizado para fabricação e usos industriais.
quartz-crystal=Um mineral transparente e vítreo com facetas afiadas, valorizado por sua beleza e durabilidade na fabricação e na indústria.
chitin=Um material resistente e em camadas obtido de exoesqueletos, conhecido por sua resiliência e durabilidade.
tenecap=Um cogumelo marrom-opaco.
tenecap-spore=Um pequeno feixe de esporos, colhido do cogumelo Tenecap.
chitosan=Um material refinado e leve derivado da quitina, conhecido por sua flexibilidade e durabilidade.
biobeacon=Emissor infundido com energia bioluminescente; aceita todos os módulos que um emissor comum aceita, além de [item=productivity-module].

