[space-location-name]
tenebris=Tenebris

[space-location-description]
tenebris=Um planeta misterioso e escuro, perpetuamente encoberto pela sombra devido à sua atmosfera densa que absorve a luz. A superfície é escassamente iluminada por flora e fauna bioluminescentes que prosperam na ausência de luz solar, lançando brilhos tênues por uma paisagem tingida de roxos e azuis profundos. Tenebris é um mundo hostil e enigmático, onde a tecnologia e a luz são essenciais para a sobrevivência em meio à escuridão perpétua.

