[technology-description]
tanks=Um veículo ofensivo poderoso, com armadura pesada e um canhão.
vehicle-deployment=Implanta automaticamente um veículo a partir de um item de veículo. O combinador acoplado permite definir a UnitData com que os veículos são implantados, para que você possa alterar as configurações de troca de inventário deles.
vehicle-depot=Veículos podem depositar ou pegar itens rapidamente aqui. A mudança de inventário se baseia na UnitData do veículo e nas configurações de troca do depósito (combinador).
programmable-vehicle-structures=Escaneie o status de posição e o inventário dos veículos. Envie comandos automaticamente, mandando-os em uma direção específica, para coordenadas, ou para seguir um jogador ou outro veículo. Escaneie ou defina a UnitData para alterar a memória do veículo e as configurações de troca de inventário.
position-beacon=Um emissor estático (combinador) que emite seu ID e sua posição. Pode ser usado como ponto de rota com o controle remoto de rotas.

