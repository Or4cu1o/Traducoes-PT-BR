[entity-description]
vehicle-depot=Transfere itens rapidamente de e para veículos próximos com base na entrada de sinal. Defina um sinal de item positivo para aceitar aquele item dos veículos. Defina um sinal negativo para fornecer aquele item aos veículos.
vehicle-depot-combinator=Defina sinais aqui ou conecte a uma rede para configurar as opções de troca do depósito.
vehicle-deployer=Implanta um veículo do tipo carro. Quaisquer dados de sinal conectados são salvos no veículo ao ser implantado; caso contrário, são usados os padrões do veículo. Os dados do sinal de veículo são usados para as quantidades-alvo de itens do veículo, para que veículos transportadores possam trocar inventário se estiverem no alcance (o inventário acima desse valor será enviado a um transportador se ele aceitar). Dados de sinal em transportadores definem a capacidade máxima em vez da quantidade-alvo.
vehicle-deployer-combinator=Defina sinais aqui ou conecte a uma rede para configurar os dados da unidade implantada.
position-beacon=Um emissor estático (combinador) que emite seu ID e sua posição. Pode ser usado como ponto de rota com o controle remoto de rotas.

