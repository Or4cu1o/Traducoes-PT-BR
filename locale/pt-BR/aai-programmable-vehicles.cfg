[mod-setting-description]
aai-attack-target-fallback=Se um alvo de ataque não for encontrado, procura entidades não militares. Esta configuração é para PvP e pode reduzir o desempenho do jogo.
start-with-random-color=Jogadores surgem com uma cor aleatória.
pathfinding-visualisation-cutoff=Um caminho amarelo detalhado mostrando os resultados da busca de caminho das unidades. O processo não é rápido, então não é usado para longas distâncias. Diminua o número para reduzir o alcance em que esta visualização é usada. 0 desativa a visualização, para um desempenho melhor.
hand-deploy-vehicle-ai-default=Qual configuração de IA os veículos devem adotar por padrão ao serem implantados à mão.
exclude-vehicles=Veículos não programáveis. Informe o "entity-name" dos veículos a excluir, separando vários por 1 espaço.
restrict-remote-actions-to-player-ids=Se definido, apenas os IDs de jogador especificados podem usar as ações remotas de unidade e de rota, separando vários por 1 espaço.
passenger-no-control-alert=Permite desativar a mensagem "Para assumir o controle manual do veículo, mude o estado da IA para: Auto ou DESL.".
aai-remove-ai-on-mine=A receita para converter um veículo com IA em um veículo sem IA é removida para reduzir a bagunça no menu de fabricação. Em vez disso, você recupera a versão sem IA do veículo ao minerá-lo.
deadzone-construction-denial-range=Cria uma terra de ninguém entre bases inimigas. Impede a construção de estruturas dentro do alcance de estruturas hostis existentes. Inimigos não podem construir geradores ou vermes perto demais das suas torres, e você não pode construir torres perto demais deles.

