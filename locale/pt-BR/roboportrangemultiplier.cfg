[mod-setting-name]
RoboportRangeMultiplier-logistics-range-factor=Fator de alcance logístico
RoboportRangeMultiplier-construction-range-factor=Fator de alcance de construção
RoboportRangeMultiplier-personal-construction-range-factor=Fator de alcance de construção pessoal
RoboportRangeMultiplier-radar-range-factor=Fator de alcance do radar do roboport

[mod-setting-description]
RoboportRangeMultiplier-personal-construction-range-factor=Ajusta o alcance de construção do equipamento de roboport pessoal.
RoboportRangeMultiplier-radar-range-factor=Em 1,0, o alcance do radar se ajusta para cobrir tanto a área logística quanto a de construção, arredondado para cima em blocos. Ajuste este fator se quiser que o alcance do radar seja maior ou menor que essas áreas. Em 0, os roboports não terão radar.
