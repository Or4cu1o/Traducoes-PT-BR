[mod-setting-description]
s6x-telo-science=O pacote científico mais avançado necessário para desbloquear o teletransportador.
s6x-telo-cycle-length=A duração de um ciclo de teletransporte, em segundos.
s6x-telo-cycle-power=A potência de um ciclo de teletransporte, em megawatts.
s6x-telo-quality-reject=Isso não tentará se teletransportar entre teletransportadores de qualidades diferentes, pois eles operam em velocidades diferentes e tendem a ficar fora de sincronia. Espere muitos erros de sincronização de teletransportadores se você desabilitar isso.
s6x-telo-swap-red=Troque os slots excluídos dos teletransportadores, essencialmente tornando-os uma propriedade que é "teletransportada" junto com os itens.
s6x-telo-debug=Despeja informações de depuração no console quando um teletransporte falha.
s6x-telo-sound=Define se os teletransportadores fazem som ao operar.
s6x-telo-compact-gui=Esta configuração ativa uma GUI mais compacta, útil se você tiver muitos planetas.

