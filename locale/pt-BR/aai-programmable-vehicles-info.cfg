[aai-programmable-vehicles]
menu_aai-programmable-vehicles=AAI Programmable Vehicles
title_aai-programmable-vehicles=AAI Programmable Vehicles
page_aai-programmable-vehicles_text_1=[font=heading-2][color=#ffe6c0]Formas de usar o mod[/color][/font]\nHá muitas coisas que os veículos programáveis podem fazer com apenas alguns cliques, o que pode fazer valer a pena instalá-lo casualmente em uma partida. Você pode usar o mod de forma bem simples, ou pode levar os veículos programáveis ao extremo e tentar automatizar o máximo que puder usando veículos. Saiba que grandes quantidades de veículos automatizados podem ter um custo de UPS e não são adequadas à escala de megabases. \n\n[font=heading-2][color=#ffe6c0]Ações básicas[/color][/font]\nPara controlar unidades você deve primeiro fabricar uma versão com IA do veículo e então colocá-la no chão.\n\nPressione Y para acessar um controle remoto de unidades ou um controle remoto de caminhos.\n\nCom um controle remoto de unidades em mãos, clique e arraste uma área de seleção para selecionar unidades.\n\nUma seleção pode ser salva com CTRL + 1, ou qualquer número de 1 a 9. \n\nUma seleção pode ser carregada com CTRL + SHIFT + 1, ou qualquer número de 1 a 9.\n\n(Nota: se você tiver o Space Exploration instalado, essas teclas vão conflitar com locais fixados, então você deve remapear um dos conjuntos.)\n\nPara dar um comando às unidades, segure Shift e clique no chão enquanto as unidades estiverem selecionadas para que elas vão até lá. Você também pode arrastar uma área em vez de clicar para distribuir as unidades pela área selecionada.\n\nSe você enviar um comando para um chão vazio, as unidades tentarão ir até lá. Se você clicar em outra unidade com IA, elas tentarão segui-la. Se você clicar em um jogador, elas tentarão seguir o jogador.\n\nSe várias unidades receberem um comando de seguir, elas tentarão formar uma bolha protetora e manter um ângulo específico, em vez de seguir sem um ângulo preferido.\n\nAs unidades geralmente tentarão usar a busca de caminho para chegar a um local-alvo. Se isso falhar, elas tentam dirigir em linha reta até baterem em algo e então tentam a busca de caminho novamente.\n\nA maioria das unidades causa muito menos dano de impacto do que no jogo original (apenas o suficiente para disparar um evento de dano e permitir que o código troque de modo). Tanques e o flame tumbler ainda causam muito dano de impacto, então tome cuidado ao automatizá-los dentro de bases.\n\nCom a ferramenta de caminho selecionada (pressione Y duas vezes), você pode colocar pontos de rota no caminho selecionado (ela cria um novo caminho se nenhum existir). Coloque 3 pontos de rota em um triângulo aproximado fora da base para testar isso. Depois que os pontos de rota forem criados, você pode selecioná-los na interface para editá-los. Note que você pode mudar um ponto de rota de uma posição para mirar outro veículo com IA.\n\nPara atribuir uma unidade a um caminho, certifique-se de que o caminho desejado esteja sempre mostrando seu ponto de rota inicial usando as opções de caminho. Selecione uma unidade com a ferramenta Controle remoto de unidades e então dê a ela uma ordem de movimento diretamente sobre o ponto de rota inicial do caminho. Se houver outro veículo, depósito ou jogador no caminho, isso pode interferir na ordem para o caminho, então pontos de rota iniciais em áreas livres são mais confiáveis.\n\n[font=heading-2][color=#ffe6c0]Alguns casos de uso básicos[/color][/font]\nCadê meu carro?: Se você vinculou seu carro ao grupo de controle 1 (com Ctrl+Shift+1), então pressionar Ctrl+1 seleciona seu carro. Segure Shift e clique em você mesmo e ele dirigirá até você e o seguirá.\n\nMotorista pessoal: Talvez dirigir com precisão na sua base simplesmente não seja a sua praia. Coloque um carro no modo "IA ligada" e diga a ele para onde ir. Ele pode levá-lo aonde precisar, e você pode se concentrar em outras coisas enquanto é levado.\n\nEntrega pessoal e coleta de lixo: Um caminho vai de você até um depósito de descarga, depois um depósito de coleta e de volta para você. Você pode colocar seu veículo no caminho para descarregar qualquer tralha que você deu a ele, depois pegar suprimentos e entregá-los a você.\n\nForça de ataque básica: Junte um grupo de metralhadores e destrua bases inimigas.\n\nFormação de ataque básica: Ordene que um grupo de metralhadores vá até a localização do seu personagem. Eles formarão um círculo protetor ao seu redor. Você pode avançar em direção às bases inimigas a pé ou no seu próprio veículo enquanto os outros veículos tentam manter a formação em círculo.\n\n[font=heading-2][color=#ffe6c0]Mecânicas de jogo extras[/color][/font]\nTerra de ninguém: Você e seus inimigos ficam restritos quanto a onde podem colocar novas estruturas. Vermes e ninhos inimigos não podem surgir dentro do alcance das suas estruturas. Da mesma forma, você não pode construir torretas dentro do alcance de ninhos ou vermes inimigos. Os mordedores inimigos ficam entocados perto dos ninhos e atrapalham a construção acima deles.
menu_vehicles=[img=item/car]  Veículos
title_vehicles=Veículos
page_vehicles_text_1=[font=heading-2][color=#ffe6c0]Veículos do jogo base[/color][/font]\n\n[font=heading-2]Carro[/font]\nO carro é bem adequado como veículo de transporte pessoal se você não tiver acesso ao Flame Tumbler. Um pequeno grupo de carros pode ser uma boa força de resposta rápida para caçar pequenos grupos de mordedores que passaram pelas defesas e eliminá-los antes que cheguem a algo importante.\n\n[font=heading-2]Tanque[/font]\nTanques podem formar uma poderosa formação de ataque. Tome cuidado com qual munição eles usam; uma 2ª variante de munição é adicionada, que não causa dano de penetração nem dano acidental a veículos sobre os quais atira. O dano em área pode complementar o dano dos tanques a laser e dos tanques de chamas.\n\n[font=heading-2][color=#ffe6c0]Veículos AAI[/color][/font]\n\n[font=heading-2]Transportador[/font]\nUm veículo utilitário básico projetado para movimentar carga. Ele pode acionar a troca de inventário com veículos próximos, como um depósito de veículos. Isso permite que ele colete recursos de veículos de mineração e os entregue a depósitos, ou colete combustível e munição de um depósito e os entregue a formações de ataque.\n\n[font=heading-2]Veículo de mineração[/font]\nMinera minérios, colhe árvores, devora rochas. Há 5 níveis que melhoram a velocidade de mineração, a velocidade de movimento, a capacidade de carga e outras coisas. Embora você possa depender exclusivamente de veículos de mineração para minerar, isso não é necessário só porque você tem o mod instalado. Veículos de mineração podem ser especialmente úteis em situações em que os recursos-alvo são remotos e uma longa linha de suprimento estática seria difícil de defender (especialmente com o mod Rampant AI), mas alguns veículos de guarda nos recursos e uma escolta protetora para o transportador seriam menos vulneráveis. Veículos de mineração também são úteis para remover pequenos depósitos de recursos onde não vale a pena montar uma estação de trem completa.\n\n[font=heading-2]Metralhador[/font]\nSe você pegar uma torreta de arma e colar algumas esteiras de transporte de cabeça para baixo embaixo dela, você acaba com algo parecido com o metralhador. É bom para limpar bases inimigas no início do jogo. No fim do jogo, alguns podem ser úteis para eliminar inimigos mais fracos que não valem o gasto de armas pesadas.\n\n[font=heading-2]Guardião[/font]\nUm veículo utilitário avançado. Tem a mesma capacidade de transferência de inventário do transportador, mas, enquanto o transportador se destaca como veículo de entrega, o guardião costuma ser melhor cuidando de um pequeno grupo de veículos ou patrulhando o perímetro de uma base. O guardião tem um radar, então ter 1 com uma força de ataque remota é útil para ver para onde você está indo. Ele pode ser um bom depósito de munição para veículos próximos, então, à medida que outros veículos ficam com pouca munição ou combustível, ele pode reabastecê-los. Ele tem um feixe de reparo, então, se houver kits de reparo no inventário, ele pode reparar veículos ou estruturas próximos. Um guardião patrulhando atrás de um muro pode mantê-lo reparado sem precisar de robôs de construção. A arma do guardião causa um pulso em área no alvo que retarda os inimigos. A lentidão dificulta que os mordedores ataquem outros veículos antes de morrer e pode tornar um pequeno grupo de veículos muito mais resistente.\n\n[font=heading-2]Tanque de chamas[/font]\nO tanque de chamas é um bom veículo de linha de frente. Tem curto alcance, mas blindagem muito pesada e velocidade suficiente para se manter à frente de uma formação típica. As duas opções de munição são um lança-chamas ou um jato de chamas. Se usar a munição de lança-chamas, tome cuidado com outros veículos dirigindo pelo fogo. O tanque de chamas é à prova de fogo, mas a maioria dos outros veículos não é.\n\n[font=heading-2]Tanque a laser[/font]\nUm tanque pesado que não sacrifica muita velocidade. Um poderoso canhão a laser causa dano massivo. Ele é mais resistente e causa mais dano a alvo único do que um tanque padrão, mas os projéteis explosivos causam dano em área, então uma mistura ainda pode ser útil.\n\n[font=heading-2]Flame Tumbler[/font]\nO flame tumbler é excepcionalmente rápido e é feito como um veículo de investida. É projetado principalmente para ser controlado manualmente fora de uma base, onde você pode dirigir de forma selvagem e atravessar obstáculos sem se preocupar com dano colateral. O lança-chamas atua como arma secundária, sendo a investida a arma principal. A velocidade do veículo faz com que, na maioria dos casos, as chamas fiquem atrás de você, mas isso é útil para queimar qualquer rastro de mordedores seguindo você. Quando usado de forma autônoma, o flame tumbler é um ótimo veículo de transporte pessoal e pode dirigir pela sua base com segurança. Flame tumblers podem ser usados em formações de veículos, mas são frágeis em comparação com outros veículos de linha de frente.\n\n[font=heading-2]Em breve[/font]\nHá outros veículos planejados, como navios, naves com propulsor e veículos mais incomuns.\n\n[font=heading-2][color=#ffe6c0]Veículos de terceiros[/color][/font]\nHá muitos veículos feitos por outros criadores de mods que funcionam com o AAI Programmable Vehicles. Cuidado ao usar demais quaisquer veículos de outros mods que tenham várias armas ou sejam superpoderosos. Se a formação de veículos ideal não contiver pelo menos 3 tipos de veículos, tente garantir que você esteja limitado a um conjunto de opções mais equilibrado.
menu_vehicle_ai=[img=virtual-signal/active-state-on]  Estado da IA do veículo
title_vehicle_ai=Estado da IA do veículo
page_vehicle_ai_text_1=Você pode implantar um veículo à mão, ou com a estrutura Implantador de veículos. Para que o veículo seja controlado por IA, você deve criar um veículo habilitado para IA usando a versão com IA da receita do veículo. Quando você implanta o veículo à mão, sua configuração inicial de IA depende da configuração do próprio jogador para implantar veículos. A configuração padrão é "Auto".\n\n[img=virtual-signal/active-state-on]  Ligada: O veículo tentará atacar inimigos se tiver munição. Se receber uma ordem, tentará cumpri-la. Se um jogador entrar no veículo, a IA do veículo continua no comando; o jogador é passageiro.\n\n[img=virtual-signal/active-state-auto]  Auto: O veículo se comporta como se a IA estivesse "Ligada" enquanto não houver jogador no veículo. Se houver um jogador no veículo, o jogador está no controle e o veículo se comporta como se a IA estivesse "Desligada".\n\n[img=virtual-signal/active-state-off]  Desligada: O veículo não responderá a comandos nem atacará inimigos. Se já estiver em movimento, ele para. Se um jogador entrar no veículo, terá controle total.\n\nA IA precisa estar desligada para que um veículo seja recolhido. (Isso porque a IA coloca um personagem falso no veículo, e o Factorio não permite que veículos sejam minerados enquanto há um personagem dentro.)
menu_unit_remote_controller=[img=item/unit-remote-control]  Controle remoto de unidades
title_unit_remote_controller=Controle remoto de unidades
page_unit_remote_controller_text_1=Pressione [__CONTROL__create-toggle-controller__] para pegar um Controle remoto de unidades [img=item/unit-remote-control].\n\n[font=heading-2][color=#ffe6c0]Seleção[/color][/font]\n\nCom o Controle remoto de unidades em mãos, você pode clicar com o botão esquerdo e arrastar uma caixa de seleção sobre veículos habilitados para IA. Os veículos selecionados são mostrados com um círculo de seleção abaixo deles, e a lista de unidades selecionadas é exibida à esquerda da tela.\n\nCada unidade selecionada tem sua própria linha. Você pode remover uma unidade da seleção usando o botão mais à esquerda da linha.\n\n[font=heading-2][color=#ffe6c0]Ordens[/color][/font]\n\n[font=heading-2]Atribuir uma ordem[/font]\nCom 1 ou mais unidades selecionadas, você pode segurar Shift e clicar com o botão esquerdo ou clicar e arrastar para atribuir uma ordem de movimento às unidades selecionadas.\n\n[font=heading-2]Mover para uma posição[/font]\nSe um único ponto foi selecionado com Shift+clique, todos os veículos tentarão se mover até o ponto selecionado ou para perto dele.\n\n[font=heading-2]Distribuir por uma área[/font]\nSe o movimento foi atribuído sobre uma área (com Shift+clique+arrastar), os veículos selecionados serão enviados para vários locais na área selecionada.\n\n[font=heading-2]Seguir um jogador ou veículo[/font]\nSe uma ordem de movimento para um ponto foi dada na localização de um jogador ou veículo com IA, os veículos selecionados receberão um comando de seguir em vez de um simples comando de movimento.\n\nSe uma única unidade recebeu um comando de seguir, ela tentará manter uma distância constante (cerca de 4 ladrilhos), mas não se importará com seu ângulo em relação ao alvo seguido.\n\nSe várias unidades receberam um comando de seguir, para evitar colidir umas com as outras elas tentarão formar um círculo ao redor do alvo. Cada veículo tentará manter um ângulo específico em relação ao alvo e uma distância baseada no número de unidades no círculo. O raio do círculo de seguir depende do número de unidades selecionadas. Se o mesmo alvo for seguido por 2 círculos com números diferentes de unidades, como 6 unidades e 18 unidades, então o círculo de 6 unidades ficará dentro do outro. (Você pode criar formações direcionais de unidades mais elaboradas usando a torre de controle de unidades com o AAI Programmable Structures.)
menu_path_remote_controller=[img=item/path-remote-control]  Controle remoto de caminhos
title_path_remote_controller=Controle remoto de caminhos
page_path_remote_controller_text_1=Pressione [__CONTROL__create-toggle-controller__] duas vezes para pegar um controle remoto de caminhos [img=item/path-remote-control].\n\nCom o controle remoto de caminhos em mãos, um clique com o botão esquerdo coloca um novo ponto de rota. O ponto de rota é adicionado ao fim do caminho atualmente selecionado. Se nenhum caminho tiver sido criado, um novo caminho será feito automaticamente.\n\nSe você tiver um ponto de rota específico selecionado e expandido, um clique substituirá o ponto de rota atual em vez de adicionar ao fim do caminho.\n\n[font=heading-2]Tipos de ponto de rota:[/font]\n\nUm ponto de rota de posição é apenas uma coordenada em uma superfície. É estático e não se move.\n\nUm ponto de rota de baliza de posição é travado ao ID de uma baliza de posição. Se você mover uma baliza de posição removendo a antiga e criando uma nova com o mesmo ID, o caminho também será atualizado. Isso é útil para fazer projetos de estradas e pontos de acesso.\n\nUm ponto de rota de depósito de veículos é travado ao ID de um depósito de veículos. Se você remover um depósito de veículos e colocar um novo com o mesmo ID, o ponto de rota mirará a posição do novo depósito.\nUm ponto de rota de unidade mira um veículo com IA. Ele funciona como um comando de seguir de curto alcance que é concluído quando o veículo-alvo está ao alcance. Isso é útil para fazer um transportador chegar perto de uma sequência de veículos de mineração antes de voltar a um depósito.\nUm ponto de rota de jogador mira um jogador com um comando de seguir que é concluído quando o veículo se aproxima. Isso pode ser útil para fazer um transportador agir como um robô logístico, trazendo itens de uso comum para você e levando o lixo embora.\n\n[font=heading-2][color=#ffe6c0]Atribuir unidades a caminhos[/color][/font]Uma unidade pode ser atribuída a um caminho de 3 formas:\n\n1. Se o caminho tiver a opção "Sempre mostrar ponto de rota inicial" marcada, ordenar uma unidade diretamente no meio do marcador do ponto de rota inicial atribuirá o veículo ao caminho (Nota: se houver um veículo ou outra entidade no mesmo local, pode ser atribuído um comando de seguir ou de movimento em vez de um comando de caminho).\n\n2. Se houver um sinal de caminho e de ponto de rota definido em um Implantador de veículos, a unidade será atribuída a esse caminho.\n\n3. Você pode usar um controlador de unidades para definir um veículo para um caminho e ponto de rota específicos.
menu_control_groups=[img=virtual-signal/signal-follow-id]  Grupos de controle
title_control_groups=Grupos de controle
page_control_groups_text_1=Os grupos de controle padrão vão de 0 a 9.\n\nPara atribuir as unidades selecionadas ao grupo de controle 1, pressione [__CONTROL__save-unit-group-1__].\n\nPara selecioná-las novamente, pressione [__CONTROL__load-unit-group-1__].\n\nUma unidade pode fazer parte de vários grupos de controle. \n\nOs atalhos de teclado são configuráveis. Os atalhos padrão para o grupo de controle 1 são Ctrl + 1 para pegar e Ctrl + Shift + 1 para definir. Se você estiver usando o Space Exploration, os atalhos padrão vão conflitar com as visões fixadas do Space Exploration.
menu_unit_identifiers=[img=virtual-signal/signal-id]  Identificadores de unidade
title_unit_identifiers=Identificadores de unidade
page_unit_identifiers_text_1=[font=heading-2][color=#ffe6c0]ID da unidade  [img=virtual-signal/signal-id][/color][/font]\n\nQuando uma unidade está selecionada, o 2º botão a partir da esquerda é o ícone de ID de unidade para aquele tipo de unidade, e o número ao lado dele é o ID de unidade da unidade.\n\nOs IDs de unidade são únicos e imutáveis. A primeira unidade colocada tem um ID de unidade 1, e nenhuma outra unidade jamais será atribuída a esse ID, mesmo que a unidade com ID 1 seja destruída ou recolhida. Os IDs de unidade não são divididos por tipo de unidade nem por superfície; todas as unidades compartilham o mesmo conjunto de números. (Nota: no multijogador PvP, cada força tem uma lista própria de IDs de unidade.)\n\n[font=heading-2][color=#ffe6c0]Unidade de ID de tipo  [img=virtual-signal/tank-tank-cannon-_-signal] [img=virtual-signal/car-vehicle-machine-gun-_-signal][/color][/font]\n\nQuando uma unidade está selecionada, o botão mais à esquerda é o ícone de Unidade-de-tipo para aquele tipo de unidade, e o número ao lado dele é o ID de Unidade de tipo da unidade.\n\nToda superfície do jogo tem uma lista de unidades vivas de cada tipo. Cada tipo de unidade tem sua própria lista (carros, tanques etc.) e, se você tiver várias superfícies (por exemplo, vários planetas), haverá listas separadas de carros/tanques para cada uma.\n\nA unidade viva mais antiga de cada tipo por superfície tem o ID de Unidade de tipo 1. A unidade viva mais recente desse tipo tem um ID igual ao número de unidades vivas desse tipo naquela superfície. Se uma unidade for destruída ou recolhida, todos os IDs de tipo de unidade são atualizados de acordo.\n\nUma unidade única pode ser identificada usando dois sinais: A: O tipo de sinal correspondente ao tipo de unidade. Se o veículo for um Carro com IA, o sinal é o Sinal de Carro com IA (na página de sinais virtuais). O número que corresponde a esse sinal é o ID de Unidade de tipo da unidade. B: O sinal de Superfície com um número correspondente ao índice da superfície. Se não for especificado, presume-se a superfície 1, que é Nauvis (a superfície padrão do jogo). Por exemplo: Superfície 1, Sinal de Carro com IA 5 significa o 5º carro vivo mais antigo na superfície 1.
menu_unit_data=[img=virtual-signal/chip]  Dados da unidade
title_unit_data=Dados da unidade
page_unit_data_text_1=Os dados da unidade são um conjunto de sinais guardados na memória da unidade, como um combinador constante interno. Quando uma unidade está selecionada, o 3º botão a partir da esquerda [img=virtual-signal/chip] permite ver e editar os dados de uma unidade.\n\nOs dados da unidade podem ser usados de algumas formas:\n\nOs dados da unidade são usados como as configurações de transferência de inventário com unidades do tipo transportador e depósitos de veículos. (Veja a página Transferência de inventário.)\n\nAtribuição arbitrária de função. Quaisquer sinais que correspondam a itens físicos serão usados como parte das configurações de transferência de inventário, mas os sinais virtuais não têm itens físicos e podem ser usados com segurança para indicar outras coisas arbitrárias, como atribuição de função ou outras coisas para ajudar a organizar as unidades. Por exemplo, digamos que você queira que alguns tanques patrulhem uma fronteira norte e outros tanques patrulhem uma fronteira sul. Você poderia marcar todos os tanques do norte com N = 1 e todos os tanques do sul com S = 1. Assim, mesmo que um tanque seja temporariamente designado para outra coisa, como reabastecimento, reparo ou ataque, ele pode voltar à sua designação anterior com base em ter um sinal N ou S.\n\n[font=heading-2][color=#ffe6c0]Colocação à mão[/color][/font]\n\nUnidades colocadas à mão têm alguns dados de unidade padrão definidos automaticamente para ajudar na automação básica de veículos, como valores de munição e combustível para ajudar nas solicitações de transferência de inventário.\n\n[font=heading-2][color=#ffe6c0]Implantação automatizada[/color][/font]\n\nSe você implantar um veículo a partir de um implantador de veículos, ele é implantado apenas com os sinais do implantador de veículos, ou em branco se você não tiver definido nenhum sinal. O implantador tem um combinador embutido que você pode editar, ou você pode passar sinais por fios. Não confunda conectar fios ao inventário do implantador e ao combinador do implantador. (Veja Implantador de veículos para mais detalhes.)\n\nSe você tiver o AAI Programmable Structures instalado, os dados da unidade podem ser lidos e definidos remota e automaticamente pelo escâner de dados de unidade e pela torre de controle de dados de unidade.
menu_inventory_transfer=[img=virtual-signal/signal-minimum-fuel]  Transferência de inventário
title_inventory_transfer=Transferência de inventário
page_inventory_transfer_text_1=A transferência de inventário pode transferir itens a curta distância entre um depósito de veículos e um veículo, ou entre um veículo do tipo transportador e qualquer tipo de veículo.\n\nVeículos do tipo transportador geralmente se restringem a veículos que não têm armas, ou cuja única arma não causa dano. Exemplos incluem o Transportador AAI e o Guardião AAI.\n\nQuando a transferência acontece entre entidades, vale considerar a hierarquia de prioridade. Veículos normais têm prioridade máxima, então podem empurrar itens para outras entidades ou coletar itens delas. Transportadores têm prioridade mínima, então tentam se acomodar às outras entidades. Depósitos de veículos têm prioridade intermediária, então podem acomodar veículos normais, mas podem empurrar para ou puxar de transportadores.\n\nAs transferências são gerenciadas por configurações de dados de troca para depósitos de veículos, e por dados de unidade para unidades.\n\nEm geral, um sinal de dados de unidade positivo indica que a entidade quer ou aceita itens até o valor especificado. Um valor negativo significa que a entidade permite a exportação daquele tipo de item ou está tentando ativamente se livrar de todos os itens daquele tipo.
page_inventory_transfer_text_2=[font=heading-2][color=#ffe6c0]Exemplo 1: Combustível e munição[/color][/font]\n\nNeste exemplo vamos pegar combustível, munição e kits de reparo de um depósito de veículos e entregá-los a veículos de combate na linha de frente. Para este exemplo usaremos um Metralhador como veículo de combate, um Guardião AAI como veículo de entrega e Combustível processado do AAI Industry como combustível, mas estes poderiam facilmente ser substituídos por um Carro, um Transportador AAI e Combustível sólido.\n\nO Depósito de veículos tem Combustível processado, Cartuchos de balas perfurantes e kits de reparo no inventário. Nos dados de troca (canto superior direito da estrutura) foi dado a ele um sinal de Combustível processado de -1, um sinal de Cartuchos de balas perfurantes de -1 e um sinal de kit de reparo de -1, significando que o depósito quer doar esses itens.\n\nO Guardião AAI está em um caminho em loop a partir do depósito, move-se ao longo da linha de frente de leste a oeste e então retorna ao depósito. Os Dados de unidade do Guardião foram modificados com os sinais adicionais de 1000 Combustível processado, 1000 Cartuchos de balas perfurantes, 100 kits de reparo e um sinal "[img=virtual-signal/signal-minimum-fuel] Combustível mínimo (MJ)" de 800. Quando o guardião se aproxima do depósito, o depósito aciona uma troca. O guardião, como o transportador, é um veículo de apoio e tem prioridade de troca menor que a do depósito. O depósito tenta doar os itens, e o guardião está aceitando itens correspondentes, então os itens são dados ao guardião até que ele tenha 1000 Combustível processado, 1000 Cartuchos de balas perfurantes e 100 kits de reparo.\n\nO guardião se move para a linha de frente. Metralhadores estão lá fazendo um loop de leste a oeste e depois de oeste a leste. O guardião deve passar perto de todos os metralhadores na patrulha enquanto se move de leste a oeste. O guardião é um veículo de apoio e pode acionar transferências de inventário com os metralhadores.\n\nOs dados de unidade do metralhador têm os sinais: 50 Cartuchos de balas perfurantes e 50 Combustível processado. O Metralhador tem prioridade de troca maior que a do guardião, então ele pegará itens até ter 50 Cartuchos de balas perfurantes e 50 Combustível processado. O guardião doará toda a munição se puder, mas não doará cada pedaço de combustível. O guardião tem o sinal "[img=virtual-signal/signal-minimum-fuel] Combustível mínimo (MJ)", então ele sempre tentará manter pelo menos esse valor de combustível em reserva e não doá-lo.\n\nO Guardião também reparará metralhadores próximos com kits de reparo. Quando chegar ao fim da linha de combate, retornará ao depósito e começará o loop novamente.\n\n[font=heading-2][color=#ffe6c0]Exemplo 2: Minério de ferro[/color][/font]\n\nUm veículo Veículo de mineração AAI tem um sinal de dados de unidade de Minério de ferro definido em -1. É um tipo normal de veículo com prioridade máxima, então está tentando ativamente exportar Minério de ferro para qualquer coisa que aceite.\n\nSe um veículo Transportador AAI se aproximar do veículo de mineração, ele pode iniciar uma transferência de inventário porque é um veículo especial do tipo transportador. Se o transportador não tiver configurações de dados de unidade, nada acontecerá porque ele não está configurado para aceitar nenhum tipo de item. Se o transportador tiver configurações de dados de unidade de 5000 Minério de ferro, ele aceitará até 5000 Minério de ferro de outros veículos e poderá coletar minério do veículo de mineração.\n\nSe o transportador que coletou o minério de ferro se aproximar de um depósito de veículos, o depósito de veículos pode iniciar uma transferência de inventário com o transportador com base nos dados de troca do depósito. Depósitos de veículos têm prioridade de transferência maior que a dos transportadores, então, se o depósito de veículos tiver um sinal positivo de Minério de ferro, ele pode forçar o transportador a largar seu minério. Quanto maior o sinal no depósito, mais minério ele tentará puxar do transportador.
menu_vehicle_depot=[img=item/vehicle-depot]  Depósito de veículos
title_vehicle_depot=Depósito de veículos
page_vehicle_depot_text_1=O Depósito de veículos pode receber e fornecer materiais a veículos. O depósito tem uma conexão de fio geral que emite o conteúdo do contêiner. A conexão superior direita define as informações de transferência do depósito (como os dados de unidade).\n\nO depósito tem prioridade de transferência maior que a de um transportador, o que significa que o depósito pode empurrar ou puxar itens para um transportador que possa aceitar esses itens ou que tenha esses itens para puxar.\n\nO depósito tem prioridade de transferência menor que a de outros veículos, o que significa que esses veículos podem empurrar ou puxar itens para o depósito, desde que o depósito esteja configurado para aceitar esses itens ou tenha esses itens para serem puxados.
menu_vehicle_deployer=[img=item/vehicle-deployer]  Implantador de veículos
title_vehicle_deployer=Implantador de veículos
page_vehicle_deployer_text_1=O implantador de veículos permite que você implante veículos de uma versão de item para uma versão de entidade. O veículo é empurrado para fora da estrutura sobre uma esteira transportadora para o espaço à frente, e esse espaço precisa estar livre de obstruções para que o veículo seja implantado. Você pode colocar uma esteira sobrepondo a esteira transportadora para movimentar o veículo implantado mesmo que ele não tenha combustível.\n\nSe o veículo implantado for um veículo com IA, ele receberá dados de unidade com base em quaisquer sinais definidos em, ou ligados a, um pequeno combinador embutido no canto inferior direito da estrutura. Se nenhum sinal for definido, a unidade não terá dados de unidade e não realizará transferências de inventário. Se um sinal de caminho e de ponto de rota for definido, a unidade será atribuída a esse caminho (como um ponto de encontro).\n\nO Implantador de veículos tem 2 pontos de conexão de fio. A estrutura principal é o contêiner, que emite quaisquer itens no contêiner. A conexão do combinador no canto inferior direito é a conexão de dados de unidade; você pode definir os dados de unidade ali diretamente, ou ter o valor trazido por fios externos.
menu_position_beacon=[img=item/position-beacon]  Baliza de posição
title_position_beacon=Baliza de posição
page_position_beacon_text_1=Uma baliza de posição é apenas um marcador de localização. Você pode usá-la para obter as coordenadas de uma posição, ou usar a baliza de posição como um ponto de rota ou alvo de movimento com base no ID da baliza de posição.
