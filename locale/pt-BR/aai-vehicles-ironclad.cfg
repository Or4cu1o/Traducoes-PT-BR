[mod-name]
aai-vehicles-ironclad=AAI Veículos: Encouraçado

[mod-description]
aai-vehicles-ironclad=Um barco pesado revestido de placas de metal, armado com um morteiro de longo alcance e um canhão. Um bom espaço de carga permite transportar itens entre ilhas. A arma pode usar tanto munição de morteiro quanto munição de tanque. É mais fácil entrar e sair do Encouraçado a partir de água rasa (mod Alien Biomes).

[item-name]
mortar-bomb=Bomba de morteiro
mortar-cluster-bomb=Bomba de fragmentação de morteiro
ironclad-cannon=Canhão
ironclad-mortar=Morteiro

[item-description]
mortar-bomb=Um explosivo de trajetória curva e altíssimo alcance.
mortar-cluster-bomb=Um explosivo de trajetória curva e longo alcance que se subdivide.
ironclad-cannon=Dispara projéteis de canhão de médio alcance e trajetória baixa.
ironclad-mortar=Dispara bombas de morteiro de longo alcance e trajetória alta.

