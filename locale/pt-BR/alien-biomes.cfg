[mod-setting-description]
alien-biomes-terrain-scale=Aumente ou diminua o tamanho do bioma. Valores menores criam biomas menores e mais frequentes. O padrão é 100.
alien-biomes-temperature-low=Os extremos inferiores de temperatura do planeta. Diminua para adicionar mais neve congelada e gelo. Aumente para tornar as áreas congeladas menos comuns ou impossíveis. O padrão é -50.
alien-biomes-temperature-high=Os extremos superiores de temperatura do planeta. Aumente para adicionar mais áreas vulcânicas. Diminua para tornar as áreas vulcânicas menos comuns ou impossíveis. O padrão é 150.
alien-biomes-humidity-low=Os extremos inferiores de umidade do planeta. Diminua para adicionar mais deserto. Aumente para tornar as áreas de deserto menos comuns ou impossíveis. O padrão é 0.
alien-biomes-humidity-high=Os extremos superiores de umidade do planeta. Aumente para adicionar mais áreas de grama. Diminua para tornar as áreas de grama menos comuns ou impossíveis. O padrão é 100.
alien-biomes-aux-low=Os extremos inferiores de variação de cor do planeta. Diminua para adicionar mais cores verde / marrom / castanho-claro. Aumente para tornar as cores verde / marrom / castanho-claro menos comuns. O padrão é 0.
alien-biomes-aux-high=Os extremos superiores de variação de cor do planeta. Aumente para adicionar mais cores azul / roxo / vermelho. Diminua para tornar as cores azul / roxo / vermelho menos comuns. O padrão é 100.
alien-biomes-disable-vegetation=Se ativado, todos os terrenos gramados, árvores e decorativos de plantas serão removidos (a menos que adicionados por outro mod). Isso permite que você simule um planeta morto, lua ou asteroide.
alien-biomes-reduced-tiles=Variantes de piso reduzidas
tile-speed-reduction=Alguns pisos (como terreno vulcânico quente) reduzem a velocidade do jogador. Reduzir este número significa que o terreno desacelerará você menos.
