[aai-structure-settings]
structure_settings=__1__
save=OK
output-filtering=Filtragem de saída
tick_limit=Frequência de ticks
tick_limit-tooltip=Processa apenas a cada X ticks. 60 = uma vez por segundo. 0 = desligado. Números maiores não deixam o jogo tão lento, mas usar menos estruturas é muito melhor.
output_pulse=Pulso de saída
output_pulse-tooltip=Se marcado, os sinais de saída pulsam por 1 tick quando escaneados e depois são zerados até o próximo tick de escaneamento (definido pela frequência de ticks). Se desmarcado, os sinais persistem até o próximo escaneamento.
quantity-tooltip=Sinal de quantidade por tipo. Geralmente representa o número de entidades de um tipo em uma superfície específica.
surface=Superfície
surface-tooltip=O ID da superfície do jogo. Cada superfície é um mundo desconectado.
unit_id=ID da unidade
unit_id-tooltip=ID único da unidade, imutável e independente da superfície.
type_id=ID de tipo
type_id-tooltip=Sinal de ID de tipo, baseado na n-ésima unidade viva daquele tipo na superfície (ou ID do jogador, independentemente da superfície).
xy_tile=Ladrilho
xy_tile-tooltip=Ladrilho X e Ladrilho Y
xy_subtile=Subladrilho
xy_subtile-tooltip=Subladrilho X e Subladrilho Y
physical=Propriedades físicas
physical-tooltip=Ângulo e velocidade
stat=Estatísticas da unidade
stat-tooltip=Vida, energia, % da bateria
timer=Cronômetros
timer-tooltip=Tempo desde: último ladrilho percorrido, fixação de alvo, comando dado
inventory_space=Espaço de inventário
inventory_space-tooltip=Número de espaços de inventário vazios
inventory-tooltip=Conteúdo de inventário, combustível e munição
zone=Zona atual
zone-tooltip=Tipo e ID da zona atual
terrain=Terreno
terrain-tooltip=Terra, água, piso
resource=Recursos
resource-tooltip=Minérios, madeira, fluidos
entity=Entidades
entity-tooltip=Inimigos, estruturas, unidades, penhascos, itens no chão
unitdata=Dados da unidade
unitdata-tooltip=Os sinais armazenados são usados como alvos de inventário de itens do veículo ao interagir com Transportadores, ou podem ser usados para diferenciar unidades, indicar funções etc.
path_id=ID do caminho
path_id-tooltip=O ID do caminho escaneado. Emitido como Sinal de caminho. IDs de caminho são específicos da superfície.
path_quantity=Quantidade de caminhos
path_quantity-tooltip=O número de caminhos definidos por esta força para a superfície indicada. Emitido como sinal P.
waypoint_id=ID do ponto de rota
waypoint_id-tooltip=O ID do ponto de rota escaneado. Emitido como Sinal de ponto de rota.
waypoint_quantity=Quantidade de pontos de rota
waypoint_quantity-tooltip=O número de pontos de rota definidos no caminho escaneado. Emitido como sinal W.
target=Alvo
target-tooltip=O alvo vinculado ao ponto de rota (se houver). Retorna a Baliza de posição, o Depósito de veículos, o Jogador ou o ID da unidade visados.
misc=Diversos
misc-tooltip=Outros dados.

