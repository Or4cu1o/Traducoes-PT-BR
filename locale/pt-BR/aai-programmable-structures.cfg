path-control=Controlador de caminhos

[item-description]
tile-scan=Insira um Sinal de distância para escanear ladrilhos aleatórios nesse alcance. Escaneie um ladrilho específico com os sinais Ladrilho X e Ladrilho Y. Use a distância com um ladrilho X e Y para escanear ladrilhos aleatórios ao redor do ladrilho XY. Retorna a posição do ladrilho escaneado mais quaisquer inimigos, recursos, estruturas, unidades, veículos e terra ou água no ladrilho visado.
zone-scan=Insira um tipo de zona; a contagem de entrada seleciona o n-ésimo ladrilho de zona desse tipo, ou use um valor negativo para selecionar um ladrilho de zona em ordem inversa. Emite a localização do ladrilho de zona.
zone-control=Insira as coordenadas Ladrilho X e Ladrilho Y para limpar zonas do ladrilho especificado. Se um tipo de zona também for inserido, o tipo de zona especificado é colocado no ladrilho especificado.
unit-scan=Insira o ID do jogador (aba de sinais virtuais); seleciona o n-ésimo jogador por índice ou use um valor negativo para selecionar em ordem inversa (mais recente primeiro). Emite os detalhes do jogador selecionado, se encontrado, incluindo posição, vida e inventário.
unit-control=Insira o ID do veículo como no Escâner de jogadores, mais um sinal de comando. Sinais de comando direto são Ângulo e Velocidade, ou Subladrilho X e Subladrilho Y como deslocamento (convertidos em ângulo e velocidade). Defina um comando indireto de busca de caminho com coordenadas Ladrilho X e Ladrilho Y (usa a IA dos mordedores, então pode ser meio desajeitado).
unitdata-scan=Insira o ID do veículo ou o ID do jogador (aba de sinais virtuais); seleciona a n-ésima entidade desse tipo na ordem de colocação ou use um valor negativo para selecionar em ordem inversa (mais recente primeiro). Emite quaisquer dados de sinal armazenados no veículo. Os sinais armazenados são usados como alvos de inventário de itens do veículo ao interagir com Transportadores, ou podem ser usados para diferenciar unidades, indicar funções etc.
unitdata-control=Insira o ID do veículo como no Escâner de dados de unidade, mais quaisquer sinais que você queira salvar no veículo visado. Os sinais de entrada sobrescrevem TODOS os sinais atualmente salvos no veículo. Se quiser modificar os sinais existentes, será preciso escanear primeiro os dados do veículo, fazer as alterações e depois salvar os sinais modificados de volta no veículo.
path-scan=Insira um ID de caminho para obter o número de pontos de rota, ou um ID de caminho e um ID de ponto de rota para escanear o alvo de um ponto de rota específico. Retorna dados XY para pontos de rota de posição, ou um ID de alvo para pontos de rota não estáticos.
path-control=Insira um ID de caminho e um ID de ponto de rota para atribuir dados a um ponto de rota. Sem dados, o ponto de rota é limpo. Dados XY definem uma posição estática. Defina um ponto de rota dinâmico com ID do jogador, ID da unidade, ID da baliza de posição ou ID do depósito de veículos.

