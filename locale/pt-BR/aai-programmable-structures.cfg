[technology-name]
programmable-structures=Estruturas programáveis

[technology-description]
programmable-structures=Escaneie ladrilhos para detectar recursos, inimigos e estruturas. Coloque zonas automaticamente em coordenadas. Escaneie posições de ladrilhos de zona. Escaneie a posição, a vida e o inventário do jogador.

[mod-setting-name]
aai-max-structs-per-tick=AAI Máximo de estruturas por tick
aai-structs-tick_limit=AAI Frequência de ticks padrão
aai-structs-output_pulse=AAI Pulso de saída padrão

[mod-setting-description]
aai-max-structs-per-tick=Melhora o UPS restringindo quantas estruturas podem ser processadas por quadro. Valores maiores significam mais potencial de sobrecarga de UPS; 0 significa ilimitado. Ao escolher 0, pode valer a pena limitar as estruturas de outras formas, como cortar a energia das estruturas quando não são necessárias, ou enviar sinais em pulsos em vez de constantemente.
aai-structs-tick_limit=Frequência de ticks padrão do AAI para estruturas recém-colocadas
aai-structs-output_pulse=Configuração padrão de pulso de saída do AAI para estruturas recém-colocadas
