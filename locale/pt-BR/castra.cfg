[tips-and-tricks-item-description]
castra-briefing=À medida que as bases [entity=data-collector] ao seu redor coletam dados, elas avançam na árvore de pesquisa e aprimoram suas bases. Mantenha-se atualizado com suas próprias pesquisas militares para ficar à frente delas. [item=castra-data] é obtido coletando itens gerados quando uma [entity=data-collector] coleta dados suficientes. Entidades que emitem dados os mencionarão em suas descrições.

