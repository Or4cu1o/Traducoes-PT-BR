[entity-name]
beacon=Transmissor MK1
wr-beacon-2=Transmissor MK2
wr-beacon-3=Transmissor MK3

[entity-description]
beacon=Distribui efeitos de módulo para máquinas próximas. Usar vários transmissores na mesma máquina irá sobrecarregá-la. Este transmissor tem apenas oito slots de módulo e curto alcance, mas é mais eficiente do que os transmissores MK2 e MK3.
wr-beacon-2=Distribui efeitos de módulo para máquinas próximas. Usar vários transmissores na mesma máquina irá sobrecarregá-la. Este transmissor tem quinze slots de módulo e um grande alcance, mas não é tão eficiente quanto o Transmissor MK1.
wr-beacon-3=Distribui efeitos de módulo para máquinas próximas. Usar vários transmissores na mesma máquina irá sobrecarregá-la. Este transmissor tem vinte slots de módulo e um grande alcance, mas é o transmissor menos eficiente.

[technology-description]
effect-transmission=Transmissores são capazes de transmitir os efeitos de módulos de atualização colocados dentro deles para máquinas aliadas próximas. No entanto, uma máquina só pode ser afetada por um transmissor por vez, ou ela ficará sobrecarregada. Transmissores de nível mais alto têm mais alcance e slots, mas têm maiores consumos de energia.

[item-name]
beacon=Transmissor MK1
wr-beacon-2=Transmissor MK2
wr-beacon-3=Transmissor MK3

