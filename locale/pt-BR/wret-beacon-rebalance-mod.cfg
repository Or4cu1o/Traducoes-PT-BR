wret-overload-enable-beaconmk3=Habilitar transmissor mk3
wret-overload-enable-notnotmelon-style=Habilitar balanceamento alternativo do Transmissor MK1
wret-overload-enable-lamp-tile-detection=Habilitar lâmpada de depuração
wret-change-K2-beacon=Rebalancear o transmissor de singularidade
wret-block-FE-beacons=Remover transmissores FE+
wret-FE-beacons-modification=Rebalancear transmissores FE+
wret-block-bob=Desabilitar transmissores dos Módulos do Bob
wret-change-bob=Rebalancear transmissores dos Módulos do Bob
wret-overload-keep-vanilla-sprite-mk1=Manter o sprite básico do Transmissor MK1
wret-overload-disable-overloaded=Sobrecarga de máquinas que possuem mais de um transmissor afetando-as

[mod-setting-description]
wret-overload-enable-beaconmk2=Desmarcar esta caixa removerá o Transmissor MK2 (não fará nada se o Transmissor MK3 estiver habilitado)
wret-overload-enable-beaconmk3=Desmarcar esta caixa removerá o Transmissor MK3
wret-overload-enable-notnotmelon-style=Define o alcance do Transmissor MK1 para nove ladrilhos e o inventário de módulos do Transmissor MK1 para quatro módulos.
wret-overload-enable-lamp-tile-detection=Colocar lâmpadas informa ao jogador o número de transmissores que afetam o ladrilho abaixo da lâmpada e quais transmissores. (colocar lâmpadas muito rapidamente fará com que o valor não seja impresso no chat)
wret-change-K2-beacon=Fornece 15 slots de módulo para o transmissor de singularidade
wret-block-FE-beacons=Remove transmissores FE+, se você quiser apenas os módulos daquele mod
wret-FE-beacons-modification=Dá ao Transmissor FE+ MK3 12 slots e ao Transmissor FE+ MK2 10 slots (só importa se você habilitar os transmissores daquele mod)
wret-block-bob=Remove os transmissores dos Módulos do Bob, se você preferir ter apenas os do Rebalance
wret-change-bob=Modifica os transmissores dos Módulos do Bob para se adequarem ao tema do Rebalance
wret-overload-disable-overloaded=Esta configuração permite que você desligue a sobrecarga do transmissor e, em vez disso, não tenha efeito algum quando vários transmissores estiverem presentes. Não funciona com listas de permissões do transmissor.
