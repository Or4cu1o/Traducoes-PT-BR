[mod-setting-description]
ltn-dispatcher-depot-inactivity=Duração em segundos de inatividade antes de os trens deixarem o depósito.\npadrão = 5
ltn-dispatcher-stop-timeout=Duração em segundos antes de os trens serem forçados a sair de uma estação.\n0 desativa este recurso.\npadrão = 120
ltn-dispatcher-delivery-timeout=Duração em segundos que as entregas podem levar antes de se considerar o trem perdido.\npadrão = 600 (10 min)
ltn-dispatcher-requester-delivery-reset=Falso (padrão):\nA entrega e o cronograma são redefinidos quando o trem chega ao depósito.\nMudanças em trens estacionados em paradas solicitantes não têm efeito.\n\nVerdadeiro:\nA entrega e o cronograma são redefinidos quando o trem sai do solicitante.\nMudanças em trens estacionados em paradas solicitantes removem a entrega e redefinem o cronograma.
ltn-dispatcher-finish-loading=Verdadeiro (padrão):\nImpede que os trens partam enquanto insersores/bombas estão trabalhando, adicionando uma condição de inatividade de 2 s.\n\nFalso:\nOs trens partem imediatamente quando todos os itens forem carregados.\nOs insersores nas estações de carregamento ficarão travados.
ltn-depot-reset-filters=Verdadeiro (padrão):\nOs vagões de carga têm seus filtros e limitações de pilha removidos ao entrar em um depósito.
ltn-depot-fluid-cleaning=Quantidade máxima de fluido por vagão destruída automaticamente ao entrar nos depósitos.\nDefina como 0 para desativar ou -1 para remover tudo.
ltn-provider-show-existing-cargo=Verdadeiro (padrão):\nA carga dentro do trem ao chegar no provedor é exibida na saída do LTN.\nInclui itens de insersores segurando itens sobre os trilhos.
ltn-provider-ignore-stopped-train=Verdadeiro (padrão):\nIgnora um trem parado na parada solicitante ao calcular o carregamento para o solicitante.
ltn-schedule-fuel-station=Ativa o reabastecimento de trens em estações de reabastecimento.\nEnvia trens para reabastecer se estiverem com pouco combustível e houver uma estação de reabastecimento na rede atual.
ltn-schedule-reset-interrupts=Remove todas as interrupções do cronograma do trem ao chegar a um depósito.
ltn-schedule-reselect-depot=(Esta configuração não tem efeito se "A entrega é concluída no solicitante" estiver desativada.) Se ativada, reseleciona o depósito para o qual o trem irá.
ltn-fuel-station-interrupt=Quando ativado, usa uma interrupção de trem do Factorio para enviar um trem para reabastecer. Este é o padrão e só deve ser alterado se a interrupção causar problemas. Quando desativado, o LTN altera dinamicamente o cronograma de um trem para enviá-lo para reabastecer. Isso exige mais ciclos, mas controla melhor o reabastecimento (por exemplo, não enviará o trem para reabastecer ao chegar a uma parada temporária).
ltn-advanced-cross-surface-delivery=Quando ativado, o LTN escolherá trens de superfícies diferentes para executar entregas ou enviará trens para outras superfícies primeiro para retirar entregas. Não ative a menos que sua rede se estenda por várias superfícies e esteja conectada (por exemplo, pelo Elevador Espacial do Space Exploration).
ltn-depot-fudge-factor=A maior diferença de distância entre depósito e provedor que é considerada equivalente ao selecionar um trem livre.
ltn-depot-stop-limit-trains=[font=default-semibold][color=red][EXPERIMENTAL!][/color][/font] Controla o comportamento da configuração "Limite de trens" para as paradas de depósito do LTN.
ltn-dispatcher-enabled=Aviso: Desativar o expedidor interrompe a geração da entrega.\nOs níveis de itens ainda serão monitorados.
ltn-dispatcher-nth_tick=Quão rápido paradas e solicitações são atualizadas.\nNúmeros mais altos melhoram o desempenho distribuindo atualizações por mais ticks.\nQuando definido > 1 força Atualizações por tick para 1.
ltn-dispatcher-provider-threshold=Quantidade de itens / fluidos necessários para atuar como provedor.\nPode ser substituído pelo sinal nas paradas do provedor.\npadrão = 1000
ltn-dispatcher-requester-threshold=Quantidade faltante de itens / fluidos que acionam uma entrega.\nPode ser substituído pelo sinal nas paradas do solicitante.\npadrão = 1000
ltn-dispatcher-schedule-circuit-control=Adiciona condições de circuito para aguardar vermelho = 0 OU verde ≥ 1 em todas as paradas.\nAviso: Todas as paradas LTN requerem ter "enviar para trem" ativado e uma conexão de circuito. Caso contrário, os trens ficarão presos esperando para sempre.\npadrão = falso
ltn-dispatcher-updates-per-tick=Limita o número de paradas e solicitações atualizadas por tick.\nNúmeros mais baixos aumentam o desempenho.\nIgnorado quando Atualizar frequência > 1.
ltn-interface-console-level=Nível de detalhe das mensagens no jogo.\n\n0: Off\nNenhuma mensagem será gerada.\n\n1: Erros e avisos\nExibir apenas erros e avisos.\n\n2: Notificações (padrão)\nExibir informações básicas, como falta de recursos ou geração de entregas.\n\n3: Mensagens detalhadas\nExibir informações detalhadas sobre como encontrar provedores e trens.
ltn-interface-debug-logfile=Escreva informações de depuração em /Factorio/factorio-current.log.
ltn-interface-factorio-alerts=Mostrar erros e avisos como alertas do Factorio
ltn-stop-default-network=ID de rede usado para paradas sem sinal "ID de rede codificado".

[string-mod-setting]
ltn-depot-stop-limit-trains-0=Redefinir limite de trens (padrão)
ltn-depot-stop-limit-trains-1=Definir limite de trens como 1
ltn-depot-stop-limit-trains-2=Não modificar ou alterar o limite de trens
ltn-interface-console-level-0=0: Desligado
ltn-interface-console-level-1=1: Erros e Avisos
ltn-interface-console-level-2=2: Notificações
ltn-interface-console-level-3=3: Mensagens Detalhadas
