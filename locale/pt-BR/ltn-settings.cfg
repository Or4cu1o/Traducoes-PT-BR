ltn-dispatcher-depot-inactivity=Inatividade no depósito (s)
ltn-dispatcher-stop-timeout=Tempo limite na parada (s)
ltn-dispatcher-delivery-timeout=Tempo limite de entrega (s)
ltn-provider-ignore-stopped-train=Solicitantes ignoram trens parados
ltn-schedule-fuel-station=Ativar estações de reabastecimento
ltn-schedule-reset-interrupts=Remover interrupções do cronograma do trem
ltn-schedule-reselect-depot=Reselecionar o depósito quando a entrega for concluída
ltn-fuel-station-interrupt=Usar interrupção para reabastecimento
