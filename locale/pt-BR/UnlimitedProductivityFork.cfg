[mod-setting-name]
up-allow-beacon=Permitir produtividade em transmissores
up-allow-all-beacons=Permitir produtividade em transmissores modificados
allow-quality-in-beacons=Permitir qualidade em transmissores
allow-quality-in-all-beacons=Permitir qualidade em transmissores modificados
up-allow-lab=Permitir todos os efeitos no tipo de laboratório
up-allow-furnace=Permitir todos os efeitos nas fornalhas
up-allow-drill=Permitir todos os efeitos nas mineradoras
up-allow-assembler=Permitir todos os efeitos nas máquinas de montagem (incluindo plantas químicas e outras máquinas com seleção de receita)
up-remove-all-restrictions=Remover as restrições de receita dos módulos de produtividade
maximum-productivity=Produtividade máxima para receitas
up-beacon-range=Alcance do transmissor (limitação do jogo: 64)
up-beacon-module-count=Número de módulos do transmissor
distribution-effectivity=Efetividade de distribuição
distribution-effectivity-quality=Efetividade de distribuição por nível de qualidade
beacon-quality-module-slots=Número de módulos do transmissor por nível de qualidade
beacon-quality-range=Aumento de alcance do transmissor por nível de qualidade

[mod-setting-description]
up-allow-beacon=Permita que os módulos de produtividade sejam usados em transmissores do jogo base.
up-allow-all-beacons=Permita que os módulos de produtividade sejam usados em transmissores adicionados por mods.
allow-quality-in-beacons=Permita que os módulos de qualidade sejam usados em transmissores do jogo base. Funciona apenas quando a produtividade em transmissores também está ativada!
allow-quality-in-all-beacons=Permita que os módulos de qualidade sejam usados em transmissores adicionados por mods. Funciona apenas quando a produtividade em transmissores modificados também está ativada!
up-allow-lab=Permitir todos os efeitos de módulo em todas as estruturas do tipo laboratório de pesquisa.\nPode exigir que 'Remover restrições de receita' esteja ativo para ter efeito perceptível.
up-allow-furnace=Permitir todos os efeitos de módulo em todas as fornalhas (máquinas de produção sem seleção de receita).\nPode exigir que 'Remover restrições de receita' esteja ativo para ter efeito perceptível.
up-allow-drill=Permitir todos os efeitos de módulo em todas as mineradoras.\nNão deve fazer nada no jogo base.
up-allow-assembler=Permitir todos os efeitos de módulo em todas as máquinas de montagem.\nRequer que 'Remover restrições de receita' esteja ativo para ter efeito perceptível. Não deve fazer nada no jogo base.
up-remove-all-restrictions=Remove as restrições de receita de todos os outros módulos, incluindo aqueles adicionados por mods.
maximum-productivity=O quanto se pode aumentar uma máquina com produtividade.
up-beacon-range=Quantos ladrilhos a área afetada se estende a partir das laterais do transmissor. O valor do jogo base é 3. 0 significa 'sem alteração'.
up-beacon-module-count=Quantos módulos cabem em um transmissor. O valor do jogo base é 2. 0 significa 'sem alteração'.
distribution-effectivity=O multiplicador dos efeitos do módulo, quando compartilhado entre os vizinhos.
distribution-effectivity-quality=Quão eficazes os transmissores são por nível de qualidade
beacon-quality-module-slots=Quantos módulos cabem em um transmissor por nível de qualidade
beacon-quality-range=Aumento de alcance dos transmissores por nível de qualidade
