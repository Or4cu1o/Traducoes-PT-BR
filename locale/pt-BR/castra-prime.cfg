[tips-and-tricks-item-description]
castra-briefing=[planet=castra] é um deserto militarizado ocupado por uma facção hostil que estuda e espelha a sua tecnologia, aprimorando continuamente as suas defesas ao longo do tempo.\n\nAs bases [entity=data-collector] emitem poluição de dados que periodicamente libera [item=castra-data] — colete-os rapidamente, pois se deterioram em um minuto. Quanto mais tempo os coletores operarem livremente, mais as suas bases se aprimoram com novas torres, muros, roboports e painéis solares.\n\nImplante [entity=jammer-radar] perto dos coletores inimigos para drenar a poluição de dados e reduzir o ritmo de aprimoramento das bases e de geração de itens.\n\n[item=millerite] é o minério primário, processado em placa de níquel ([item=nickel-plate]) usada na maioria das receitas locais. [fluid=hydrogen-sulfide] é extraído de [entity=hydrogen-sulfide-vent]. Depósitos de [item=gunpowder] podem ser minerados diretamente. Oceanos de [fluid=light-oil] podem ser bombeados com uma [entity=offshore-pump]. [item=copper-ore] e [item=uranium-ore] também estão presentes.\n\nA [entity=forge] é o edifício de fabricação planetário, com bônus embutidos de produtividade e qualidade. Desbloqueá-la exige processar os três recursos exclusivos de Castra, e ela é necessária para produzir [item=battlefield-science-pack].
castra-lithium-supply=[planet=castra] não contém lítio. Para produzir [item=lithium-battery], você precisará importar [item=lithium] de outro planeta ou exportar [item=nickel-plate] para produzir baterias em outro lugar.

