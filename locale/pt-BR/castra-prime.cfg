[mod-setting-description]
castra-prime-forge-glow=Ativa a camada de emissão de luz na Forja, dando a ela uma aparência brilhante enquanto opera.
castra-prime-extend-data-spoilage=Aumenta o tempo de deterioração dos pacotes de dados do campo de batalha de 1 minuto para 5 minutos.
castra-prime-disable-artillery=Impede que as bases inimigas construam torres de artilharia. Recomendado para partidas longas.
castra-prime-buffed-forge=Aumenta a velocidade de fabricação da Forja para 3,0, o bônus de produtividade para 50% e reduz o consumo de energia para 2,5 MW.
castra-prime-gates-progression=Quando ativado (padrão), os recursos de Castra são necessários para a progressão de fim de jogo: baterias de lítio são necessárias para fabricar canhões de trilho e pacotes de ciência de Prometheus, e a ciência do campo de batalha é necessária para a ciência de Prometheus e para a pesquisa de produtividade de pesquisa. Desative para tornar Castra um planeta secundário opcional.
castra-prime-suppress-research-msg=Suprime as mensagens sobre o progresso da pesquisa inimiga. Útil para jogadores que preferem uma experiência mais imersiva, sem notificações constantes.
castra-prime-research-rate-multiplier=Multiplica a velocidade de pesquisa da facção inimiga. O padrão 1,0 é igual ao do mod original. Valores menores que 1,0 tornam a pesquisa inimiga mais lenta; valores maiores a aceleram. Intervalo: 0,01 a 100. OBSERVAÇÃO: a pesquisa inimiga é limitada pelo motor do jogo, então aumentos podem não funcionar como esperado.
castra-prime-nauvis-nukes=Quando ativado, remove o pacote científico do campo de batalha da tecnologia da bomba atômica, permitindo que ela seja pesquisada sem visitar Castra.
castra-prime-buff-equipment=Reforça o Escudo de energia MK3 (450 HP, 18/s de regeneração, 300 kW de consumo) e a Bateria MK3 (300 MJ de capacidade) adicionados por este mod. Se desmarcado, usa os valores do mod original.
castra-prime-disable-enemy-nukes=Impede que as torres inimigas carreguem munição nuclear: bombas atômicas e bombas de hidrogênio em torres de foguetes, e projéteis de artilharia nucleares (Cerys/Maraxsis) em torres de artilharia. A munição nuclear existente permanecerá até ser disparada. Não remove a munição nuclear já presente nas torres.
castra-prime-disable-land-mines=Não remove as minas já existentes
castra-prime-nerf-enemy-bases=Reduz a vida, as resistências e a taxa de regeneração de todos os coletores de dados inimigos em 50%.

