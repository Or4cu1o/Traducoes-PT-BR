[technology-description]
plutonium-processing=Processamento do plutônio, elemento radioativo que não pode ser extraído da natureza, mas pode ser obtido de células de combustível de urânio esgotadas.
plutonium-nuclear-power=O plutônio é uma poderosa fonte de energia, especialmente seus isótopos de maior energia.
MOX-nuclear-power=Uma mistura de isótopos menos ativos de plutônio e urânio pode ser usada para gerar energia mais barata.
plutonium-reprocessing=Células de combustível à base de plutônio podem ser recicladas após o uso.
plutonium-ammo=Munição avançada de plutônio para maior dano.
plutonium-atomic-bomb=O plutônio produz munição atômica muito potente, permitindo criar munições de artilharia de impacto extremo.
nuclear-breeding=A regeneração nuclear é um processo que usa material físsil para produzir mais material físsil, utilizável em outros lugares.
breeder-fuel-cell-from-uranium-cell=Células de combustível de urânio esgotadas podem ser recicladas por regeneração nuclear.
breeder-fuel-cell-from-MOX-fuel-cell=Células de combustível MOX esgotadas podem ser recicladas por regeneração nuclear.
fission-reactor-equipment-from-plutonium=Receita alternativa para o reator de fissão portátil usando plutônio.
fission-reactor-equipment-from-MOX-fuel=Receita alternativa para o reator de fissão portátil usando combustível MOX.

