enable-plutonium-ammo=Ativa ou desativa o cartucho de balas de plutônio e as munições de canhão.

[mod-description]
PlutoniumEnergy=Adiciona o processamento do plutônio, criado pela fissão nuclear do urânio. Ele pode ser usado para extrair ainda mais energia ou incinerar inimigos com novas munições.
