[mod-name]
metal-and-stars=○🌐Metal e Estrelas

[mod-description]
metal-and-stars=○🌐O universo lá fora é enorme, e há outras maneiras de sair do sistema solar. Vários novos destinos com novas máquinas, tecnologias e processos únicos.

[mod-setting-name]
is-nix-frozen-enabled=Nix requer aquecimento
is-micro-gravity-lab-all-science-enabled=O laboratório de microgravidade pode processar ciência básica
is-science-packs-other-labs-enabled=Adicionar os pacotes científicos de Metal e Estrelas a outros laboratórios

[mod-setting-description]
is-nix-frozen-enabled=Isso fará com que Nix precise de aquecimento, assim como Aquilo.
is-micro-gravity-lab-all-science-enabled=Isso permite que o laboratório de microgravidade processe ciência básica. Normalmente, ele processa apenas ciências espaciais.
is-science-packs-other-labs-enabled=Quando ativado, os pacotes científicos de Metal e Estrelas são adicionados a laboratórios de outros mods, para que esses laboratórios possam pesquisar as tecnologias de Metal e Estrelas. Os laboratórios do jogo base não são afetados.

[space-location-name]
shipyard=Neumann V
nix=Nix
ringworld=Circa
mirandus-a=Mirandus-A
calidus-senestella-gate-senestella=Portal estelar de Calidus
calidus-senestella-gate-calidus=Portal estelar de Senestella

[space-location-description]
shipyard=Um satélite abandonado, com detritos espaciais anormalmente calmos. Nanos não instruídos, robôs microscópicos multifuncionais, estão onipresentes na estrutura — provavelmente tanto o que o destruiu quanto o que o manteve intacto por tanto tempo. As condições são semelhantes às de uma plataforma espacial. [item=microgravity-assembler] e [item=neumann-conduit] estão espalhados ao redor da ruína.
nix=Um mundo de tundra com noites excepcionalmente longas e escuras. Também lar de fontes anômalas [entity=dark-matter-vent] que contêm muita energia se você conseguir colhê-la. [planet=nix] tem condições de congelamento semelhantes às de [planet=aquilo] — é rico em recursos, mas extraí-los no frio pode ser desafiador.
ringworld=Um anel construído circundando uma estrela fria. Metade do anel está coberta de água e completamente coberta de vegetação, e a outra metade é um deserto. É sempre dia aqui, então a tecnologia solar é muito confiável.
mirandus=Um planeta fragmentado que existe em emaranhamento quântico. Você não pode pousar aqui, mas os asteroides mirandites em sua órbita podem ser minerados em busca de [item=quantite-a], um mineral instável com propriedades de deslocamento atômico.
calidus-senestella-gate-senestella=Tecnologia precursora, este portal permite que naves viajem rapidamente entre dois locais no espaço. Ele leva a Calidus (o sistema inicial).
calidus-senestella-gate-calidus=Tecnologia precursora, este portal permite que naves viajem rapidamente entre dois locais no espaço. Ele leva a Senestella (Metal e Estrelas).

