[mod-setting-description]
start-with-vehicle-miner=Adiciona um Veículo de mineração MK1 gratuito ao inventário da nave do modo livre.
vehicle-mining-multiplier=Um multiplicador para a velocidade de mineração dos veículos de mineração. Definir um valor de 50 significa que os veículos mineram à metade da velocidade.
vehicle-mining-disallow-resources=Insira o "resource-name" dos recursos que deseja proibir, separando vários com um espaço. Descubra os nomes com a opção de dicas de depuração F4.
vehicle-mining-interval=O número de ticks entre processamentos de mineração; um valor baixo deixa a mineração mais suave, um valor alto economiza UPS.
vehicle-mining-requires-movement=O veículo só pode minerar em movimento, seja conduzido por um jogador ou por qualquer mod de IA de veículo (por exemplo, AAI Programmable Vehicles com a ferramenta de rota).
vehicle-collection-interval=O número de ticks entre processamentos de coleta de árvores, rochas e itens no chão; um valor baixo é mais frequente, um valor alto economiza UPS.
