[mod-setting-description]
artillery-toggle=Selecione as entidades afetadas
autogen-color=Selecione a cor
ick-tags=Escolha se você quer tags, ícones ou nada antes dos nomes dos atalhos adicionados por este mod.\n\nNo menu de configurações, as tags estarão sempre visíveis.
ick-prepare-uninstall=[img=utility.danger_icon] Cuidado! Esta configuração ativará todo o equipamento desativado em todo o save. Você pode digitar uma destas quatro opções:\n\n- [color=yellow]uninstall[/color] = Permite desinstalar este mod com segurança. \n- [color=yellow]active-defense-equipment[/color] = Ativa todo o equipamento pessoal de defesa a laser, permitindo desativar com segurança a configuração __1__. \n- [color=yellow]belt-immunity-equipment[/color] = Ativa todo o equipamento de imunidade a esteiras, permitindo desativar com segurança a configuração __2__. \n- [color=yellow]night-vision-equipment[/color] = Ativa todo o equipamento de visão noturna, permitindo desativar com segurança a configuração __3__.\n\nSe você remover o mod ou desativar as configurações mencionadas sem usar esta configuração antes, todo o equipamento desativado será perdido.

[string-mod-setting]
tree-killer-trees-rocks=__ENTITY__tree-proxy__/rochas
